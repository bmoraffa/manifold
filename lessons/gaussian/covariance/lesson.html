<template data-part="lede"
  >Type your own matrix, or pick a shape, and watch the cloud, the contours and the hill morph to
  match. Isotropic gives circles. Diagonal stretches along an axis. Off-diagonal entries tilt
  it.</template
>

<template data-part="intro"
  ><p
    >The covariance matrix answers two questions at once. The diagonal says how much each variable
    varies on its own. The off-diagonal says whether they vary together: positive when a large \(x\)
    tends to come with a large \(y\), negative when it comes with a small one, zero when knowing one
    tells you nothing about the other.</p
  >
</template>

<template data-part="math"
  ><h4>The matrix</h4>$$\Sigma=\begin{pmatrix}\sigma_x^2 & \rho\,\sigma_x\sigma_y\\[2pt]
  \rho\,\sigma_x\sigma_y & \sigma_y^2\end{pmatrix},\qquad
  \Sigma_{12}=\mathbb{E}\big[(x-\mu_x)(y-\mu_y)\big],\qquad
  \rho=\frac{\Sigma_{12}}{\sigma_x\sigma_y}\in[-1,1].$$ <h4>Three families</h4
  ><p
    ><b>Isotropic</b>, \(\Sigma=\sigma^2 I\): the same spread in every direction, circular contours,
    one number to learn. <b>Diagonal</b>, \(\Sigma=\operatorname{diag}(\sigma_x^2,\sigma_y^2)\):
    independent variables, ellipses lined up with the axes, one number per dimension. <b>Full</b>:
    any tilt, \(d(d+1)/2\) numbers in \(d\) dimensions. Models choose between these all the time:
    naive Bayes assumes diagonal, a standard VAE and diffusion noise are isotropic.</p
  >
  <h4>What makes a matrix valid</h4
  ><p
    >The variance in any direction \(\mathbf u\) is \(\mathbf u^{\top}\Sigma\,\mathbf u\), and a
    variance cannot be negative. So \(\Sigma\) must be symmetric and positive definite, which in two
    dimensions means \(\Sigma_{11}>0\), \(\Sigma_{22}>0\) and
    \(\Sigma_{12}^2&lt;\Sigma_{11}\Sigma_{22}\). That last condition is the same as
    \(|\rho|&lt;1\).</p
  >
  <h4>Axes of the ellipse</h4>$$\Sigma=Q\,\Lambda\,Q^{\top},\qquad
  \Lambda=\operatorname{diag}(\lambda_1,\lambda_2).$$<p
    >The columns of \(Q\) (the eigenvectors) are the directions of the ellipse axes, and the axis
    lengths are proportional to \(\sqrt{\lambda_1}\) and \(\sqrt{\lambda_2}\). Finding these axes
    from data is exactly PCA. The determinant \(|\Sigma|=\lambda_1\lambda_2\) measures the area of
    the ellipse, \(\pi\sqrt{|\Sigma|}\) for the 1σ contour, and sets the peak height
    \(1/(2\pi\sqrt{|\Sigma|})\).</p
  >
  <h4>How the samples are made</h4
  ><p
    >Draw \(\mathbf z\sim N(\mathbf 0,I)\) and set \(\mathbf x=\boldsymbol\mu+L\mathbf z\) with
    \(LL^{\top}=\Sigma\). The dots in the picture are the same \(\mathbf z\) every time, pushed
    through a different \(L\). This "reparameterisation" is what lets a VAE learn through a sampling
    step.</p
  ></template
>

<template data-part="question"
  >Two matrices have the same determinant. Do they give the same shape?</template
>

<template data-part="answer"
  >No. The determinant fixes the area of the ellipse, not its shape. A circle and a long thin
  ellipse can have the same area. Compare 1, 0, 1 with 3, 0, 0.33.</template
>
