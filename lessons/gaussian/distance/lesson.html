<template data-part="lede"
  >Points A and B are the same straight-line distance from the centre. But A lies along the cloud
  and B lies across it, so B is far more surprising. Mahalanobis distance measures distance in units
  of spread.</template
>

<template data-part="intro"
  ><p
    >Is a point far from the centre? It depends which way you went. Along the long axis of the cloud
    the data spreads widely, so two units is nothing unusual. Across the short axis two units puts
    you well outside the cloud. A useful distance should count steps in units of the spread in that
    direction.</p
  >
</template>

<template data-part="tryit"
  >Watch the space squeeze until the ellipses become circles, then relax again. When it is fully
  whitened, compare the two rings with the ordinary distances on screen. Then make the cloud
  isotropic: do the two distances still differ?</template
>

<template data-part="math"
  ><h4>The formula</h4>$$d_M(\mathbf x)=\sqrt{(\mathbf
  x-\boldsymbol\mu)^{\top}\,\Sigma^{-1}\,(\mathbf x-\boldsymbol\mu)}$$
  <p
    >This is the multivariate version of the z-score \(|x-\mu|/\sigma\). If \(\Sigma=\sigma^2 I\) it
    reduces to ordinary distance divided by \(\sigma\).</p
  >
  <h4>Whitening</h4
  ><p
    >Apply the change of variables \(\mathbf z=\Sigma^{-1/2}(\mathbf x-\boldsymbol\mu)\). In the new
    coordinates the cloud is round with unit variance, and</p
  >$$d_M(\mathbf x)=\lVert\mathbf z\rVert.$$<p
    >Mahalanobis distance is ordinary distance after the space has been stretched until the data
    looks isotropic. That is what the animation does. Whitening inputs before training is the same
    operation, and it is why feature scaling matters for methods based on distance such as k-nearest
    neighbours.</p
  >
  <h4>Distance and density</h4
  ><p
    >The Gaussian density is \(p(\mathbf x)\propto e^{-d_M^2/2}\), so points at the same Mahalanobis
    distance are equally likely: the rings are contours. In two dimensions the share of the data
    closer than \(d\) is \(1-e^{-d^2/2}\), which gives 39% inside \(d=1\), 86% inside \(d=2\) and
    98.9% inside \(d=3\).</p
  ></template
>

<template data-part="question"
  >An anomaly detector flags points with Mahalanobis distance above 3. Why is that better than a
  straight-line threshold?</template
>

<template data-part="answer"
  >A straight-line threshold draws a circle, which is too generous along the short axis and too
  strict along the long one. The Mahalanobis threshold draws the 3σ ellipse, which matches where the
  data actually lives.</template
>
