<template data-part="lede"
  >Cut the hill with a vertical wall at x = x₀. The cut face is a bell curve again: what you know
  about y once x is fixed. The shadows on the back walls are what you know about each variable
  alone.</template
>

<template data-part="intro"
  ><p
    >A <b>marginal</b> answers "what do I know about \(y\) if I ignore \(x\)?" You get it by
    squashing the hill flat against a wall. A <b>conditional</b> answers "what do I know about \(y\)
    now that I have seen \(x=x_0\)?" You get it by slicing the hill at \(x_0\) and rescaling the
    slice so its area is 1. For a Gaussian, both are Gaussian again. Very few distributions have
    this property, and it is why Gaussians make exact inference possible.</p
  >
</template>

<template data-part="math"
  ><h4>The marginal</h4>$$p(y)=\int p(x,y)\,dx=N\big(\mu_y,\ \sigma_y^2\big)$$<p
    >To marginalise a Gaussian you simply drop the rows and columns you do not care about.</p
  >
  <h4>The conditional</h4>$$y\mid x_0\ \sim\ N\!\Big(\
  \mu_y+\rho\,\frac{\sigma_y}{\sigma_x}\,(x_0-\mu_x)\ ,\ \ \sigma_y^2\,(1-\rho^2)\ \Big)$$
  <p
    ><b>The mean is a straight line in \(x_0\).</b> Its slope \(\rho\,\sigma_y/\sigma_x\) is the
    slope of the least-squares regression line. Linear regression is this formula.</p
  >
  <p
    ><b>The variance does not depend on \(x_0\).</b> Wherever you cut, the slice has the same width.
    And it is smaller than the marginal variance by the factor \(1-\rho^2\): the fraction \(\rho^2\)
    of the variance of \(y\) has been explained by \(x\). That is the \(R^2\) of regression.</p
  >
  <h4>In any number of dimensions</h4>$$\boldsymbol\mu_{a\mid
  b}=\boldsymbol\mu_a+\Sigma_{ab}\Sigma_{bb}^{-1}(\mathbf x_b-\boldsymbol\mu_b),\qquad \Sigma_{a\mid
  b}=\Sigma_{aa}-\Sigma_{ab}\Sigma_{bb}^{-1}\Sigma_{ba}.$$<p
    >Gaussian processes, Kalman filters and the denoising step of a diffusion model all apply these
    two lines.</p
  ></template
>

<template data-part="question">If ρ = 0, what does knowing x tell you about y?</template>

<template data-part="answer"
  >Nothing. The slice has the same centre and width wherever you cut, and it matches the shadow on
  the wall. For Gaussians, zero correlation means independence.</template
>
