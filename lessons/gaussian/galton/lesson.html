<template data-part="lede"
  >Each ball hits a peg and bounces left or right at random, row after row. No single ball is
  predictable. The pile at the bottom always is.</template
>

<template data-part="intro"
  ><p
    >Every peg is a coin flip. A ball's final slot is just the number of times it went right, so a
    ball that lands in slot \(k\) after \(n\) rows made exactly \(k\) right turns. There is one path
    to the far edge and a huge number of paths to the middle, and every individual path is equally
    likely when \(p=\tfrac12\). The pile is tall where paths are many.</p
  >
</template>

<template data-part="math"
  ><h4>The formula</h4
  ><p>Counting paths gives the binomial distribution:</p
  >$$P(K=k)=\binom{n}{k}\,p^{k}(1-p)^{n-k},\qquad \mathbb{E}[K]=np,\quad
  \operatorname{Var}(K)=np(1-p).$$
  <p
    >For many rows the binomial is very close to a Gaussian with the same mean and variance (the de
    Moivre–Laplace theorem), which is the curve drawn over the pile:</p
  >$$\binom{n}{k}p^{k}(1-p)^{n-k}\;\approx\;\frac{1}{\sqrt{2\pi\,np(1-p)}}\exp\!\left(-\frac{(k-np)^2}{2\,np(1-p)}\right).$$
  <h4>Reading it</h4
  ><p
    >The board is \(n\) slots wide, but the pile is only about \(\sqrt{np(1-p)}\) wide. Doubling the
    rows doubles the width of the board and widens the pile by only \(\sqrt2\). Sums of many small
    independent pushes concentrate, and their shape is always this one.</p
  ></template
>

<template data-part="question">Why do so few balls reach the outer slots?</template>

<template data-part="answer"
  >To land at the far right a ball must bounce right every single time, and only one path does that.
  There are many different paths to the middle slots, so most balls end up there.</template
>
