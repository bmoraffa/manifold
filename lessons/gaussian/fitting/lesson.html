<template data-part="lede"
  >Go the other way: start from data and find the Gaussian. Build your own data set, watch points

<template data-part="intro"
  ><p
    >Maximum likelihood asks one question: of all possible Gaussians, which one would have made this
    data least surprising? It slides and reshapes the hill until the data points sit as high on it
    as possible, on average.</p
  >
</template>

<template data-part="math"
  ><h4>The likelihood</h4
  ><p
    >For independent points the probability of the whole data set is a product, so its logarithm is
    a sum:</p
  >$$\ell(\boldsymbol\mu,\Sigma)=\sum_{i=1}^n\ln p(\mathbf x_i)=-\frac
  n2\ln\big|2\pi\Sigma\big|-\frac12\sum_{i=1}^n(\mathbf
  x_i-\boldsymbol\mu)^{\top}\Sigma^{-1}(\mathbf x_i-\boldsymbol\mu).$$
  <p
    >The second term rewards hills that sit close to the points. The first term penalises hills that
    are spread out, since a wide hill is low everywhere. The best fit balances the two.</p
  >
  <h4>The answer</h4
  ><p>Setting the derivatives to zero gives the estimates in closed form:</p
  >$$\hat{\boldsymbol\mu}=\frac1n\sum_{i=1}^n\mathbf x_i,\qquad
  \hat\Sigma=\frac1n\sum_{i=1}^n(\mathbf x_i-\hat{\boldsymbol\mu})(\mathbf
  x_i-\hat{\boldsymbol\mu})^{\top}.$$<p
    >The sample mean and the sample covariance. No iteration is needed, which is rare; most models
    in later topics need gradient descent to do this same job.</p
  >
  <h4>Train against test</h4
  ><p
    >The fit is tuned to the training points, so they score better under it than fresh points do.
    With \(n\) points and \(k\) fitted numbers (here \(k=5\)), the gap in average log-likelihood is
    roughly \(k/n\). It is large for small \(n\), and it closes as data arrives. This gap is
    overfitting in its simplest form. With fewer than 3 points \(\hat\Sigma\) is singular and the
    likelihood is infinite, which the next lesson fixes.</p
  >
  <h4>When the model is wrong</h4
  ><p
    >Maximum likelihood finds the best Gaussian, not a good model. For two clumps it returns one
    wide hill whose peak sits in the empty gap.</p
  ><p>A CSV needs at least two numeric columns. The first two are used.</p></template
>

<template data-part="question"
  >For “Two clumps”, the fitted peak sits where there is almost no data. What does that tell
  you?</template
>

<template data-part="answer"
  >Maximum likelihood finds the best Gaussian, not a good model. One Gaussian cannot have two peaks.
  That is the reason for mixtures of Gaussians, which come later.</template
>
