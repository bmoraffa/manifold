<template data-part="lede"
  >Two people talk at once in a room with two microphones. Each microphone records a different blend
  of the two voices. Nobody tells you what either voice sounds like or how they were blended.
  Independent component analysis recovers both voices anyway, from one assumption: the two sources
  have nothing to do with each other, and neither is plain Gaussian noise.</template
>

<template data-part="intro"
  ><p
    >Mix two paints and you get a colour that looks more like mud than either original. Mixing
    independent signals does something similar: a blend of several independent things looks more
    like a bell curve than any one of them, which is the central limit theorem at work. So run the
    film backwards. Search for the two ways of combining the microphone recordings that look
    <i>least</i> like a bell curve. Those combinations must be the originals, because any leftover
    mixing would have made them more bell-shaped.</p
  >
</template>

<template data-part="math"
  ><h4>The model</h4
  ><p
    >Sources \(\mathbf s(t)\in\mathbb R^2\) with independent components are mixed by an unknown
    matrix:</p
  >$$\mathbf x(t)=\mathbf A\,\mathbf s(t).$$<p
    >We observe only \(\mathbf x\) and want an unmixing matrix \(\mathbf W\) with \(\mathbf
    y=\mathbf W\mathbf x\approx\mathbf s\). The order and scale of the sources can never be
    recovered, since any such change can be absorbed into \(\mathbf A\).</p
  >
  <h4>Step one: whitening</h4
  ><p>Subtract the mean and transform so that the covariance is the identity:</p>$$\mathbf z=\mathbf
  D^{-1/2}\mathbf E^{\top}(\mathbf x-\bar{\mathbf x}),\qquad\operatorname{Cov}(\mathbf x)=\mathbf
  E\mathbf D\mathbf E^{\top}.$$<p
    >This is PCA followed by rescaling. It removes all correlation, and it does half the job: the
    sources themselves are uncorrelated with unit variance, so they must be a <i>rotation</i> of
    \(\mathbf z\). Uncorrelated is weaker than independent, though, and any rotation of \(\mathbf
    z\) is still uncorrelated. Second-order statistics cannot pick the right one.</p
  >
  <h4>Step two: the rotation</h4
  ><p>In two dimensions a rotation is one angle \(\theta\):</p>$$\mathbf
  y=\begin{pmatrix}\cos\theta&\sin\theta\\-\sin\theta&\cos\theta\end{pmatrix}\mathbf z.$$<p
    >Choose the angle that makes the outputs as non-Gaussian as possible. This page measures that
    with the excess <b>kurtosis</b>, which is zero for a Gaussian:</p
  >$$\operatorname{kurt}(y)=\mathbb E[y^4]-3\quad(\text{for unit variance}),\qquad
  J(\theta)=\operatorname{kurt}(y_1)^2+\operatorname{kurt}(y_2)^2.$$<p
    >The curve at the bottom right is \(J(\theta)\). The run climbs it by gradient ascent and stops
    when the angle changes by less than \(10^{-4}\) radians. The curve repeats every 90°, because
    turning by a quarter-turn only swaps the outputs and flips a sign.</p
  >
  <h4>Why Gaussian sources cannot be separated</h4
  ><p
    >A whitened pair of independent Gaussians has a perfectly round distribution. Rotate it by any
    angle and it looks exactly the same. Every angle gives independent Gaussian outputs, the
    contrast \(J(\theta)\) is flat apart from sampling noise, and there is nothing to find. ICA can
    tolerate at most one Gaussian source.</p
  >
  <h4>Compared with PCA</h4
  ><p
    >PCA finds uncorrelated directions ordered by variance. ICA finds independent directions, which
    need not be at right angles in the original space and have no natural order. PCA uses the
    covariance only. ICA needs higher-order statistics, which is why it needs non-Gaussian data.</p
  >
  <h4>Beyond this page</h4
  ><p
    >The standard algorithm is FastICA (Hyvärinen and Oja, 2000), a fixed-point iteration that works
    in any number of dimensions and offers more robust measures of non-Gaussianity than kurtosis,
    which is sensitive to outliers. Real rooms add echoes and delays, so real audio needs
    convolutive versions of the model. ICA is routinely used to remove eye-blink artefacts from
    brain recordings and to find independent spatial patterns in brain imaging.</p
  ></template
>

<template data-part="question"
  >After whitening, the two signals are uncorrelated. Why is that not the same as having separated
  the sources?</template
>

<template data-part="answer"
  >Uncorrelated only means there is no straight-line relationship between the two signals.
  Independent means that knowing one tells you nothing at all about the other. Every rotation of a
  whitened cloud is still uncorrelated, so whitening leaves a whole circle of candidate answers, and
  only one orientation (up to swaps and signs) makes the outputs independent. You can see it in the
  scatter plot: after whitening the cloud is round overall but its sharp edges are tilted. Turning
  until the edges line up with the axes is the step that correlation cannot do and higher-order
  statistics can.</template
>
