<template data-part="lede"
  >A photograph can contain tens of thousands of different colours. Treat every pixel as a point in
  red-green-blue space, run k-means, and repaint each pixel with the colour of its centre. The
  picture survives on K colours. Use the built-in picture or upload your own.</template
>

<template data-part="intro"
  ><p
    >A box of crayons with only six crayons can still draw a recognisable landscape, as long as the
    six are well chosen: a sky blue, a leaf green, something for the roofs. Choosing those six is
    exactly a clustering problem. Pixels with similar colour should share one crayon, and each
    crayon should be the average of the pixels that use it, so that no pixel is repainted with a
    colour far from its own.</p
  >
</template>

<template data-part="math"
  ><h4>The picture as data</h4
  ><p
    >A picture with \(n\) pixels becomes \(n\) points \(x_i=(r_i,g_i,b_i)\in[0,255]^3\). Where a
    pixel sits in the picture is ignored: only its colour matters. k-means with K centres
    \(\mu_1,\dots,\mu_K\) minimises</p
  >$$J=\sum_{i=1}^{n}\lVert x_i-\mu_{c(i)}\rVert^2 ,$$<p
    >the total squared colour error of the repainted picture. Dividing by \(n\) and taking the
    square root gives the average colour error shown under the pictures. Nothing about the algorithm
    changes from the two-dimensional lesson: three coordinates instead of two.</p
  >
  <h4>Why this compresses</h4
  ><p
    >Storing a full-colour pixel takes 24 bits, eight for each of red, green and blue. After k-means
    each pixel only needs to say which of the K colours it uses, which takes \(\lceil\log_2
    K\rceil\) bits, plus one small table of K colours for the whole picture. With \(K=16\) that is 4
    bits per pixel, a sixth of the original. This is called <b>vector quantisation</b>, and the
    table of colours is the <b>codebook</b> or palette. The GIF image format works this way with up
    to 256 colours.</p
  >
  <h4>What to notice</h4
  ><p
    >The centres do not spread evenly through the colour cube. They go where the pixels are: a
    picture that is mostly sky spends several of its colours on slightly different blues, because
    that lowers \(J\) most. Small bright details, such as a red roof, get a colour of their own only
    when K is large enough that splitting a big region again would gain less than fixing the small
    one. Smooth gradients turn into visible bands, because nearby pixels with nearly equal colours
    fall on opposite sides of a boundary between two centres.</p
  >
  <h4>The same idea elsewhere</h4
  ><p
    >Replacing each item by the index of its nearest centre is used well beyond pictures:
    compressing audio, building visual "words" from image patches, speeding up nearest-neighbour
    search in large collections of embeddings (product quantisation), and the discrete codes of
    VQ-VAE models that you will meet in the generative part of this site.</p
  ></template
>

<template data-part="question"
  >Two pictures have the same number of pixels. One is a photo of a clear blue sky, the other a
  photo of a flower market. For the same K, which has the smaller colour error, and why?</template
>

<template data-part="answer"
  >The sky. Its pixels form one thin strand in colour space, so a few centres placed along that
  strand are close to every pixel. The flower market fills much more of the colour cube, so the same
  number of centres must each cover a wider range of colours and the average error is larger. How
  well k-means compresses depends on how concentrated the data is, not on how many points there
  are.</template
>
