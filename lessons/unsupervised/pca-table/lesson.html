<template data-part="lede"
  >With two columns you can look at the cloud. With six or twelve you cannot, and that is where PCA
  earns its place: it finds the few combinations of columns that carry most of the variation, so a
  wide table can be drawn on one page. Use the built-in tables or upload your own.</template
>

<template data-part="intro"
  ><p
    >A school report lists six marks for each student. If you had to describe a student with only
    two numbers, you would not pick two of the six subjects and discard the rest. You would say
    something like "overall, strong" and "better at sciences than at languages". Those are not
    columns of the table. They are combinations of columns, and they summarise the table well
    because the subjects are correlated. PCA finds such combinations automatically and tells you how
    much each one explains.</p
  >
</template>

<template data-part="math"
  ><h4>From the table to the components</h4
  ><p
    >Let \(\mathbf X\) be the table with \(n\) rows and \(d\) columns. Standardise each column:
    \(z_{ij}=(x_{ij}-\bar x_j)/s_j\). The correlation matrix is</p
  >$$\mathbf R=\frac{1}{n-1}\mathbf Z^{\top}\mathbf Z,$$<p
    >a \(d\times d\) table whose entry \((j,k)\) is the correlation between columns \(j\) and \(k\).
    Its eigenvectors \(\mathbf w_1,\dots,\mathbf w_d\), ordered by eigenvalue
    \(\lambda_1\ge\dots\ge\lambda_d\), are the principal components. The entries of \(\mathbf w_k\)
    are called <b>weights</b> or <b>loadings</b>: how much of each column goes into component
    \(k\).</p
  >
  <h4>Scores</h4
  ><p
    >The score of row \(i\) on component \(k\) is \(t_{ik}=\mathbf w_k^{\top}\mathbf z_i\): multiply
    each standardised entry by its weight and add. The lower-left picture plots \((t_{i1},t_{i2})\)
    for every row. Two rows that are close in that picture are similar across all \(d\) columns, to
    the extent that two components capture the table.</p
  >
  <h4>The scree plot</h4
  ><p
    >With standardised columns each has variance 1, so the total is \(d\) and \(\sum_k\lambda_k=d\).
    Component \(k\) carries the share \(\lambda_k/d\). Plotting these shares in order gives the
    scree plot. Common rules for how many to keep: enough to reach 80 or 90% of the total; the
    components before the curve flattens; or those with \(\lambda_k&gt;1\), meaning they carry more
    than one original column's worth. None is a law, and the right number depends on what the
    components are for.</p
  >
  <h4>Why standardise</h4
  ><p
    >Without it PCA uses the covariance matrix, and a column with large numbers dominates purely
    because of its units. Weight in kilograms with a standard deviation of 12 has a variance of 144;
    shoe size with a standard deviation of 2 has a variance of 4. Component 1 would be almost
    entirely weight. Standardise unless all columns share one unit and their differences in spread
    are meaningful.</p
  >
  <h4>Reading the arrows</h4
  ><p
    >In the lower-left picture each column is an arrow from the origin to its pair of weights on
    components 1 and 2. Arrows pointing the same way belong to columns that rise together. Arrows at
    right angles are unrelated, and opposite arrows are columns that trade off. A row lying far out
    along an arrow scores high on that column.</p
  >
  <h4>Cautions</h4
  ><p
    >Components are defined only up to sign: flipping all the weights of one component changes
    nothing. They are forced to be at right angles, which real underlying causes need not be, so the
    interpretation of a component is a suggestion and not a discovery. And a component with a small
    eigenvalue is not necessarily unimportant for a later prediction task: PCA never looked at any
    target.</p
  ></template
>

<template data-part="question"
  >A table has 10 columns and the first two components carry 95% of the spread. What does that tell
  you about the 10 columns?</template
>

<template data-part="answer"
  >That they are highly redundant. The rows lie very close to a flat two-dimensional sheet inside
  the ten-dimensional space, so the ten measurements are close to being ten different mixtures of
  only two underlying quantities plus a little noise. You could store two numbers per row and
  rebuild all ten columns with an error of 5% of the total variance.</template
>
