<template data-part="lede"
  >There is no need to choose the number of clusters in advance. Start with every point alone, join
  the two closest clusters, and repeat until one remains. The record of who joined whom, and at what
  distance, is a tree called a dendrogram. Cutting it at any height gives a clustering.</template
>

<template data-part="intro"
  ><p
    >Biologists do not sort animals into one fixed set of groups. They build a tree: house cats and
    lions join early, then cats with dogs, then all mammals, then mammals with birds. The tree holds
    every level of grouping at once, and you choose the level that suits your question. Hierarchical
    clustering builds the same kind of tree for any data, using nothing but the distances between
    points.</p
  >
</template>

<template data-part="math"
  ><h4>The agglomerative algorithm</h4
  ><p
    >Begin with \(n\) clusters, each holding one point. At every step find the two clusters \(A\)
    and \(B\) with the smallest distance \(d(A,B)\), merge them, and record the merge at height
    \(d(A,B)\). After \(n-1\) merges everything is in one cluster. Unlike k-means there is no random
    start: the same data and the same linkage always give the same tree.</p
  >
  <h4>Linkage: the distance between two clusters</h4
  ><p
    >Distance between two points is clear. Distance between two groups of points needs a rule, and
    the choice changes the result:</p
  >
  $$d_{\text{single}}(A,B)=\min_{a\in A,\,b\in B}\lVert a-b\rVert,\qquad
  d_{\text{complete}}(A,B)=\max_{a\in A,\,b\in B}\lVert
  a-b\rVert,$$$$d_{\text{average}}(A,B)=\frac{1}{|A|\,|B|}\sum_{a\in A}\sum_{b\in B}\lVert
  a-b\rVert,\qquad d_{\text{Ward}}(A,B)=\frac{|A|\,|B|}{|A|+|B|}\,\lVert\bar a-\bar b\rVert^2 .$$
  <p
    ><b>Single</b> linkage joins clusters that touch anywhere, so it can follow long curved chains,
    and for the same reason one stray point between two groups can bridge them.
    <b>Complete</b> linkage keeps every cluster compact and tends to break large groups.
    <b>Average</b> sits between the two. <b>Ward</b> merges the pair whose union adds least to the
    within-cluster sum of squares, the same quantity k-means minimises, and so gives round, even
    clusters.</p
  >
  <h4>Reading the dendrogram</h4
  ><p
    >Leaves along the bottom are the points. Each ∩-shaped join is one merge, and its height is the
    distance at which it happened. Short joins near the bottom connect near-identical points. A tall
    stretch of the tree with no joins means the clusters below it are far apart compared with their
    own size. Cutting there, with a horizontal line, gives a natural number of clusters: the number
    of vertical lines the cut crosses. The order of leaves left to right is partly arbitrary, since
    any join can be flipped, so only the heights carry meaning.</p
  >
  <h4>Cost</h4
  ><p
    >The method needs all \(\tfrac12 n(n-1)\) pairwise distances, so memory grows as \(n^2\) and a
    plain implementation takes about \(n^3\) time. It suits hundreds or a few thousand points, not
    millions. A merge can never be undone: an early mistake stays in the tree.</p
  >
  <h4>When to use it</h4
  ><p
    >When the number of clusters is unknown, when you want groups at several levels at once, or when
    you only have distances and no coordinates (for example edit distances between gene sequences).
    The dendrogram is itself a useful picture of the data.</p
  ></template
>

<template data-part="question"
  >On the two moons, single linkage recovers the two moons but average linkage does not. Explain in
  one sentence each.</template
>

<template data-part="answer"
  >Single linkage measures the gap between the nearest members of two clusters, and along each moon
  neighbouring points are closer to each other than to anything in the other moon, so each moon is
  chained together before the two ever join. Average linkage looks at all pairs of points, and the
  two halves of one moon are far apart on average, farther than half of one moon is from the nearby
  half of the other, so it merges pieces across moons.</template
>
