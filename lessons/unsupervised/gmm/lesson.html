<template data-part="lede"
  >k-means gives every point to exactly one cluster. A Gaussian mixture says each cluster is a bell
  shape, and lets a point belong 70% to one cluster and 30% to another. The EM algorithm fits it
  with two alternating steps. Start in one dimension, where every part of the idea can be seen, then
  move to two.</template
>

<template data-part="intro"
  ><p
    >Suppose you measure the heights of a crowd without recording who is an adult and who is a
    child. The histogram has two humps. If you knew who belonged to which group, fitting a bell
    curve to each group would be easy. If you knew the two bell curves, you could say for any height
    how likely it is to be a child's. You know neither, so you guess the curves, compute everyone's
    probable group, refit the curves using those probabilities as weights, and repeat. That loop is
    the EM algorithm, and the pair of bell curves is a Gaussian mixture.</p
  >
</template>

<template data-part="math"
  ><h4>The model</h4
  ><p
    >The data are assumed to come from K Gaussians. Cluster \(k\) has a weight \(\pi_k\) (its share
    of the data, with \(\sum_k\pi_k=1\)), a mean \(\boldsymbol\mu_k\) and a covariance matrix
    \(\boldsymbol\Sigma_k\). The density of a point is</p
  >$$p(\mathbf x)=\sum_{k=1}^{K}\pi_k\,\mathcal N(\mathbf
  x\mid\boldsymbol\mu_k,\boldsymbol\Sigma_k).$$<p
    >We want the parameters that maximise the log-likelihood of the data,</p
  >$$\ell=\sum_{i=1}^{n}\log\sum_{k=1}^{K}\pi_k\,\mathcal N(\mathbf
  x_i\mid\boldsymbol\mu_k,\boldsymbol\Sigma_k).$$<p
    >The sum inside the logarithm prevents a closed-form answer, which is why an iterative method is
    needed.</p
  >
  <h4>E-step: responsibilities</h4
  ><p
    >With the current parameters, Bayes' rule gives the probability that point \(i\) came from
    cluster \(k\):</p
  >$$r_{ik}=\frac{\pi_k\,\mathcal N(\mathbf
  x_i\mid\boldsymbol\mu_k,\boldsymbol\Sigma_k)}{\sum_{j}\pi_j\,\mathcal N(\mathbf
  x_i\mid\boldsymbol\mu_j,\boldsymbol\Sigma_j)} .$$<p
    >These are the colours in the picture: a point halfway between two clusters is drawn in a blend
    of their colours.</p
  >
  <h4>M-step: weighted fits</h4
  ><p
    >Treat each \(r_{ik}\) as a fraction of a point. With \(N_k=\sum_i r_{ik}\) the effective number
    of points in cluster \(k\),</p
  >$$\pi_k=\frac{N_k}{n},\qquad\boldsymbol\mu_k=\frac{1}{N_k}\sum_i r_{ik}\,\mathbf
  x_i,\qquad\boldsymbol\Sigma_k=\frac{1}{N_k}\sum_i r_{ik}\,(\mathbf x_i-\boldsymbol\mu_k)(\mathbf
  x_i-\boldsymbol\mu_k)^{\top}.$$<p
    >These are the ordinary maximum-likelihood formulas for a Gaussian from the first module, with
    every point counted according to its responsibility.</p
  >
  <h4>Why it works</h4
  ><p
    >Each E-step followed by an M-step can never lower \(\ell\). The E-step builds a lower bound on
    \(\ell\) that touches it at the current parameters, and the M-step moves to the top of that
    bound. So the curve in the lower right rises at every step and flattens at a local maximum. Like
    k-means, EM finds a local optimum that depends on the start, so it is usually started from a
    k-means++ seeding and restarted a few times.</p
  >
  <h4>How it relates to k-means</h4
  ><p
    >Force every covariance to be the same small circle, \(\boldsymbol\Sigma_k=\sigma^2\mathbf I\),
    and let \(\sigma\to0\). Each responsibility becomes 0 or 1, the E-step becomes "assign to the
    nearest centre" and the M-step becomes "move to the average". k-means is the hard, round limit
    of a Gaussian mixture. Choosing Circle in the controls shows the halfway case.</p
  >
  <h4>Cautions</h4
  ><p
    >A bell can shrink onto a single point, where its density, and with it the likelihood, grows
    without bound. Implementations add a small constant to the diagonal of each
    \(\boldsymbol\Sigma_k\), as this page does. More clusters always raise the likelihood, so K is
    chosen with a penalty for the number of parameters, such as BIC \(=-2\ell+p\log n\), or by
    likelihood on held-out data. And a mixture of Gaussians still cannot follow a curved shape such
    as the two moons with K = 2: it needs several bells per moon.</p
  ></template
>

<template data-part="question"
  >After EM converges, a point has responsibilities 0.5 and 0.5 for two clusters. k-means would have
  put it firmly in one. Which answer is more useful?</template
>

<template data-part="answer"
  >The 0.5 and 0.5 is information that k-means throws away: the model is telling you that this point
  is on the border and that its membership is uncertain. If a decision depends on the cluster, for
  example which offer to send a customer, knowing that the assignment is a coin flip matters. A hard
  label can always be recovered from the soft one by taking the larger share, but not the other way
  round.</template
>
