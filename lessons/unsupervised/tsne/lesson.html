<template data-part="lede"
  >PCA can only cast a flat shadow. t-SNE gives up on preserving distances altogether and asks for
  less: points that are neighbours in the original space should be neighbours on the page. It starts
  from a random scatter and moves the points, a little at a time, until that is true.</template
>

<template data-part="intro"
  ><p
    >Imagine seating guests at a wedding. You cannot reproduce on a floor plan every relationship
    among 150 people, but you can try to seat friends at the same table. You do not care how far
    table 3 is from table 9, only that each person sits near the people they are close to. t-SNE
    (t-distributed stochastic neighbour embedding) draws data this way. Here each "guest" is a 5 by
    7 picture of a letter, a point with 35 coordinates, and the page has only two.</p
  >
</template>

<template data-part="math"
  ><h4>Step 1: neighbours in the original space</h4
  ><p
    >For each point \(i\), put a Gaussian on it and ask how much of its probability falls on each
    other point \(j\):</p
  >$$p_{j\mid i}=\frac{\exp\!\big(-\lVert\mathbf x_i-\mathbf
  x_j\rVert^2/2\sigma_i^2\big)}{\sum_{k\ne i}\exp\!\big(-\lVert\mathbf x_i-\mathbf
  x_k\rVert^2/2\sigma_i^2\big)},\qquad p_{ij}=\frac{p_{j\mid i}+p_{i\mid j}}{2n}.$$<p
    >Each point gets its own width \(\sigma_i\), chosen so that the distribution \(p_{\cdot\mid i}\)
    has a fixed <b>perplexity</b> \(2^{H(p_{\cdot\mid i})}\), where \(H\) is the entropy in bits.
    Perplexity is the effective number of neighbours: in a dense region \(\sigma_i\) comes out
    small, in a sparse one large, so every point ends up with about the same number of
    neighbours.</p
  >
  <h4>Step 3: neighbours on the page</h4
  ><p
    >For the positions \(\mathbf y_i\) on the page the same idea is used with a Student-t curve with
    one degree of freedom in place of the Gaussian:</p
  >$$q_{ij}=\frac{\big(1+\lVert\mathbf y_i-\mathbf y_j\rVert^2\big)^{-1}}{\sum_{k\ne
  l}\big(1+\lVert\mathbf y_k-\mathbf y_l\rVert^2\big)^{-1}} .$$<p
    >The heavy tails are the important design choice. In 35 dimensions a point can have many
    neighbours all at a moderate distance. On a flat page there is not enough room for that. With
    heavy tails, a moderate distance in the original space is matched by a much larger distance on
    the page, which gives the groups room to move apart instead of piling up in the middle (the
    "crowding problem").</p
  >
  <h4>Step 4: what is minimised</h4
  ><p
    >The positions are chosen to make \(Q\) resemble \(P\), measured by the Kullback–Leibler
    divergence</p
  >$$C=\mathrm{KL}(P\,\Vert\,Q)=\sum_{i\ne j}p_{ij}\log\frac{p_{ij}}{q_{ij}},\qquad\frac{\partial
  C}{\partial\mathbf y_i}=4\sum_{j}(p_{ij}-q_{ij})\,\frac{\mathbf y_i-\mathbf y_j}{1+\lVert\mathbf
  y_i-\mathbf y_j\rVert^2}.$$<p
    >Read the gradient as forces. If \(p_{ij}&gt;q_{ij}\) the two points are neighbours that sit too
    far apart, and they attract. If \(p_{ij}&lt;q_{ij}\) they sit closer than they should, and they
    repel. Because the cost weights each term by \(p_{ij}\), putting true neighbours far apart is
    punished heavily, while putting strangers close costs little. t-SNE therefore protects local
    structure first.</p
  >
  <h4>Early exaggeration</h4
  ><p
    >For the first iterations every \(p_{ij}\) is multiplied by a constant (4 on this page). The
    attraction between neighbours is then far stronger than the repulsion, so tight clumps form
    while the map is still small and the clumps can slide past each other into a good arrangement.
    Then the factor is removed and the map relaxes.</p
  >
  <h4>How to read a t-SNE map</h4
  ><ul
    ><li><b>Trust:</b> which points are grouped together.</li
    ><li
      ><b>Do not trust:</b> the distance between groups, the size of a group, or its position. These
      change from run to run and with perplexity.</li
    ><li
      ><b>Perplexity</b> between 5 and 50 is usual. Too small and the map shatters into fragments of
      a few points. Too large and distinct groups blur together. It must be smaller than the number
      of points.</li
    ><li
      >The cost is not convex, so different random starts give different maps. Run it more than
      once.</li
    ><li>There is no formula that places a new point on an existing map, unlike PCA.</li></ul
  >
  <h4>UMAP</h4
  ><p
    >UMAP follows the same plan with different ingredients: a nearest-neighbour graph in place of
    the \(p_{ij}\), a different curve on the page, and a cost that is cheaper to optimise. It is
    much faster on large data and tends to keep somewhat more of the large-scale arrangement, but
    the same cautions about distances between groups apply.</p
  ></template
>

<template data-part="question"
  >On a t-SNE map, cluster A is twice as far from cluster B as from cluster C. Can you conclude that
  A is more similar to C than to B?</template
>

<template data-part="answer"
  >No. t-SNE is built to keep neighbours together and makes almost no attempt to preserve distances
  between points that are not neighbours. The heavy-tailed curve on the page deliberately stretches
  moderate distances by an amount that depends on local density, and the arrangement of groups
  changes between runs. To compare groups, go back to the original distances or use a method that
  preserves them, such as PCA.</template
>
