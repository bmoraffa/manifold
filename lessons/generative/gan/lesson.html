<template data-part="lede"
  >Two networks play against each other. The generator turns random numbers into fake data and has
  never seen the real thing. The discriminator sees both and tries to tell them apart. Each time the
  detective gets better, the forger has to improve, and the other way round. Watch the gold fakes
  chase the dark real points across the plane, and watch what can go wrong.</template
>

<template data-part="intro"
  ><p
    >A forger paints fake banknotes and a detective inspects them. The forger never sees a real
    note. All they learn is what the detective says: "fake, the ink is wrong". They fix the ink. The
    detective, now seeing better fakes, learns to check the paper. The forger fixes the paper. Round
    after round both improve, and in the end the fakes are indistinguishable from the real thing.
    Neither could have got there alone. A generative adversarial network (GAN) sets up that contest
    between two networks.</p
  >
</template>

<template data-part="math"
  ><h4>The two players</h4
  ><p
    >The <b>generator</b> \(G\) maps random noise \(\mathbf z\sim\mathcal N(\mathbf 0,\mathbf I)\)
    to a data point \(G(\mathbf z)\). The <b>discriminator</b> \(D\) maps a point to the probability
    that it is real. They play</p
  >$$\min_G\max_D\;\;\mathbb E_{\mathbf x\sim\text{data}}\big[\log D(\mathbf x)\big]+\mathbb
  E_{\mathbf z}\big[\log\big(1-D(G(\mathbf z))\big)\big].$$<p
    >\(D\) wants both terms large: real points scored near 1, fakes near 0. \(G\) wants the second
    term small.</p
  >
  <h4>Training</h4
  ><p
    >Alternate two steps. <b>Discriminator step:</b> ordinary classification, real against fake,
    with \(G\) held fixed. <b>Generator step:</b> hold \(D\) fixed and backpropagate through it into
    \(G\). In practice \(G\) maximises \(\log D(G(\mathbf z))\), which gives stronger gradients
    early on than minimising \(\log(1-D(G(\mathbf z)))\). The generator's only teaching signal is
    the gradient of the discriminator's opinion: which way should each fake move to look more
    real?</p
  >
  <h4>The ideal end point</h4
  ><p
    >For a fixed generator the best discriminator is \(D^*(\mathbf x)=\dfrac{p_{\text{data}}(\mathbf
    x)}{p_{\text{data}}(\mathbf x)+p_G(\mathbf x)}\). If the generator matches the data exactly,
    \(D^*=\tfrac12\) everywhere: the detective is reduced to tossing a coin, and both losses settle
    near \(\log2\approx0.69\) and \(2\log2\approx1.39\). So unlike every other lesson on this site,
    a falling loss is not the goal, and there is no test for convergence. This page stops after a
    fixed number of steps.</p
  >
  <h4>What goes wrong</h4
  ><ul
    ><li
      ><b>Mode collapse.</b> The generator finds a few outputs that fool the detective and produces
      only those. The detective catches up, the generator jumps elsewhere, and they chase each
      other. Nothing in the objective rewards covering all of the data.</li
    ><li
      ><b>Instability.</b> Two networks optimising against each other can oscillate or diverge, and
      the balance is sensitive to learning rates.</li
    ><li
      ><b>Vanishing signal.</b> If the detective becomes too good, its opinion is flat near the
      fakes and the generator learns nothing.</li
    ></ul
  >
  <h4>Where GANs stand</h4
  ><p
    >From 2014 to about 2020 GANs produced the sharpest generated images, and they are still used
    where speed matters, since generation is one forward pass. Diffusion models have largely
    replaced them for images because they train stably and cover the data better.</p
  >
  <h4>What this page trains</h4
  ><p
    >Two real networks, each with two hidden layers of 32 neurons, trained with Adam. The generator
    maps two random numbers to a point in the plane.</p
  ></template
>

<template data-part="question"
  >After long training the discriminator’s accuracy is about 50% on both real and fake points. Has
  training failed?</template
>

<template data-part="answer"
  >No, that is the best possible outcome. If the generator’s points are distributed exactly like the
  real data, no rule can tell them apart, and the best the discriminator can do is guess. A
  discriminator that stays near 100% accuracy means the generator is still producing detectable
  fakes; one near 50% means either success or, less happily, that the discriminator is too weak to
  notice differences that are there.</template
>
