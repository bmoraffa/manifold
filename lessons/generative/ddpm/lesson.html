<template data-part="lede"
  >Stir a drop of ink into water and it spreads until nothing of the drop is left. That direction is
  easy. A diffusion model learns the other direction: it removes a little noise at a time until a
  picture appears. Choose a picture, watch it dissolve, then watch the denoiser bring it back.
  Whether the same picture returns depends on how much of it survived, and that is decided by the
  noise schedule, which you can redesign here: the original DDPM schedule, the improved one from
  IDDPM, or your own.</template
>

<template data-part="intro"
  ><p
    >A sculptor starts with a rough block and removes a little at a time until the statue appears.
    Nobody could carve a statue in a single blow, but each small cut is easy: look at what is there,
    decide what does not belong, take it off. A diffusion model generates the same way. It starts
    from a block of static and removes a little noise at each step. It learns what "does not belong"
    by first watching real pictures being buried in noise, where it knows exactly what noise was
    added. If you bury a picture only part of the way, enough of it shows through for the sculptor
    to recover that same picture. Bury it completely and the sculptor is free to carve any statue it
    knows.</p
  >
</template>

<template data-part="math"
  ><h4>The forward process: adding noise</h4
  ><p
    >Let \(\mathbf x_0\) be a picture with pixel values scaled to \([-1,1]\). Each step mixes in a
    little Gaussian noise:</p
  >$$\mathbf x_t=\sqrt{1-\beta_t}\;\mathbf
  x_{t-1}+\sqrt{\beta_t}\;\boldsymbol\varepsilon_t,\qquad\boldsymbol\varepsilon_t\sim\mathcal
  N(\mathbf 0,\mathbf I).$$<p
    >The numbers \(\beta_1,\dots,\beta_T\) are the <b>noise schedule</b>. Because Gaussians combine
    neatly, any step can be reached from the original in one jump. With \(\bar\alpha_t=\prod_{s\le
    t}(1-\beta_s)\),</p
  >$$\mathbf x_t=\sqrt{\bar\alpha_t}\;\mathbf x_0+\sqrt{1-\bar\alpha_t}\;\boldsymbol\varepsilon
  .$$<p
    >\(\sqrt{\bar\alpha_t}\) is how much picture is left and \(\sqrt{1-\bar\alpha_t}\) how much
    noise: the two solid curves at the lower right. The step slider uses this formula to jump
    anywhere.</p
  >
  <h4>The reverse process: removing noise</h4
  ><p
    >A network \(\boldsymbol\varepsilon_\theta(\mathbf x_t,t)\) is trained to predict the noise that
    was added, by minimising</p
  >$$\mathcal L_{\text{simple}}=\mathbb E_{\mathbf
  x_0,\,t,\,\boldsymbol\varepsilon}\Big[\big\lVert\boldsymbol\varepsilon-\boldsymbol\varepsilon_\theta\big(\sqrt{\bar\alpha_t}\,\mathbf
  x_0+\sqrt{1-\bar\alpha_t}\,\boldsymbol\varepsilon,\;t\big)\big\rVert^2\Big].$$<p
    >Predicting the noise is the same as predicting the clean picture, since \(\hat{\mathbf
    x}_0=(\mathbf x_t-\sqrt{1-\bar\alpha_t}\,\boldsymbol\varepsilon_\theta)/\sqrt{\bar\alpha_t}\).
    One reverse step then draws \(\mathbf x_{t-1}\) from a Gaussian whose centre lies between the
    current noisy picture and the guess:</p
  >$$\mathbf
  x_{t-1}=\underbrace{\frac{\sqrt{\bar\alpha_{t-1}}\,\beta_t}{1-\bar\alpha_t}\,\hat{\mathbf
  x}_0+\frac{\sqrt{1-\beta_t}\,(1-\bar\alpha_{t-1})}{1-\bar\alpha_t}\,\mathbf
  x_t}_{\text{mean}}+\sigma_t\,\mathbf z,\qquad\mathbf z\sim\mathcal N(\mathbf 0,\mathbf I).$$<p
    >This is DDPM, denoising diffusion probabilistic models (Ho, Jain and Abbeel, 2020). They used a
    schedule in which \(\beta_t\) rises in a straight line, and \(\sigma_t^2=\beta_t\).</p
  >
  <h4>Why the picture you chose comes back, or does not</h4
  ><p
    >The reverse process only sees the noisy picture. When you turn back early,
    \(\sqrt{\bar\alpha_t}\) is still well above zero, the original shows through, and the denoiser's
    guess is that picture. At the very end of a schedule \(\bar\alpha_T\) is practically zero: the
    noisy picture is static that would look the same whichever picture you began with. Nothing is
    left to say it was the sunflower, so the reverse process is free to end on any picture it knows.
    That is not a fault. It is exactly what makes diffusion a <b>generator</b>: begin from fresh
    static and a new sample appears. Starting the reverse process from a partly noised picture, as
    the first button does, is how diffusion models are used to edit or restore an existing image.</p
  >
  <h4>IDDPM, part 1: the cosine schedule</h4
  ><p
    >Nichol and Dhariwal (2021) noticed that the linear schedule destroys small pictures far too
    quickly. Look at the middle strips: with the linear schedule the picture is gone about halfway
    through, so the remaining steps are spent turning static into static and teach the network very
    little. They proposed choosing \(\bar\alpha_t\) directly, as a smooth curve that falls gently at
    both ends:</p
  >$$\bar\alpha_t=\frac{f(t)}{f(0)},\qquad
  f(t)=\cos^2\!\Big(\frac{t/T+s}{1+s}\cdot\frac{\pi}{2}\Big),\qquad
  \beta_t=1-\frac{\bar\alpha_t}{\bar\alpha_{t-1}},$$<p
    >with a small offset \(s=0.008\) and \(\beta_t\) capped at 0.999. Information is removed at a
    nearly even pace from the first step to the last. The readout "steps on which the denoiser can
    still recognise the original" measures the difference. The ideal denoiser on this page sees
    through far more noise than your eye does, so judge the strips by eye and the readout by
    number.</p
  >
  <h4>IDDPM, part 2: how much noise to put back</h4
  ><p
    >For the size \(\sigma_t\) of the fresh noise in the reverse step there are two natural choices.
    The largest sensible value is \(\sigma_t^2=\beta_t\). The smallest is the variance the step
    would have if the clean picture were known exactly,</p
  >$$\tilde\beta_t=\frac{1-\bar\alpha_{t-1}}{1-\bar\alpha_t}\,\beta_t .$$<p
    >DDPM fixed one of them. IDDPM lets the network output a number \(v\) between 0 and 1 for every
    step and pixel, and uses a blend of the two on a logarithmic scale:</p
  >$$\sigma_t^2=\exp\!\big(v\,\log\beta_t+(1-v)\,\log\tilde\beta_t\big).$$<p
    >On this page you set \(v\) by hand with the reverse-noise slider. The two ends differ most in
    the last few steps, where \(\tilde\beta_t\) goes to zero and \(\beta_t\) does not. To train
    \(v\), IDDPM adds a small multiple of the full likelihood bound to the simple loss, \(\mathcal
    L_{\text{hybrid}}=\mathcal L_{\text{simple}}+\lambda\,\mathcal L_{\text{vlb}}\).</p
  >
  <h4>IDDPM, part 3: fewer reverse steps</h4
  ><p
    >With a well-chosen variance, sampling does not have to visit every step. Pick a shorter list of
    steps \(t_1>t_2>\dots\), treat each jump from \(t\) to \(s\) as one step with
    \(\beta'=1-\bar\alpha_t/\bar\alpha_s\), and apply the same formulas. A model trained with 4,000
    steps could then be sampled in about 100. The "reverse steps used" slider does this. The DDIM
    and Samplers tab takes the idea further.</p
  >
  <h4>Why the first guesses are blurry</h4
  ><p
    >The best possible answer to "what clean picture is behind this static?" is the average of all
    the pictures it could have been, weighted by how likely each is. At high noise many pictures are
    plausible, so the average is a blur. As noise is removed the candidates narrow and the guess
    sharpens. The fresh noise added at each step helps decide which candidate wins.</p
  >
  <h4>What this page computes</h4
  ><p
    >The forward process, the schedules, the reverse mean and the reverse variance are exactly the
    formulas above. For the denoiser this page does not train a network. It uses the
    <b>mathematically ideal denoiser for a tiny data set</b>: when the model "knows" only the \(K\)
    pictures in the list, the best guess is</p
  >$$\hat{\mathbf x}_0=\sum_{k=1}^{K}w_k\,\mathbf x^{(k)},\qquad
  w_k\propto\exp\!\Big(-\frac{\lVert\mathbf x_t-\sqrt{\bar\alpha_t}\,\mathbf
  x^{(k)}\rVert^2}{2(1-\bar\alpha_t)}\Big),$$<p
    >the bars at the top right. Because it knows so few pictures, it can pick out the original from
    astonishingly little: a picture has thousands of pixels, and a faint trace spread over all of
    them adds up. A real diffusion model replaces this sum with a U-Net trained on millions of
    pictures. When such a model denoises a heavily noised photo it returns a picture like the
    original, not the original itself, and it can produce pictures that are in none of its training
    data. The next tab trains a denoising network on simple data. The built-in pictures are drawn by
    code, and an uploaded photo is shrunk to 32 × 32 pixels.</p
  ></template
>

<template data-part="question"
  >You noise the sunflower all the way to the last step of the linear schedule and denoise it, and a
  cat comes back. A classmate says the denoiser made a mistake. Did it?</template
>

<template data-part="answer"
  >No. At the last step of that schedule the share of the original left in the mix is practically
  zero, so the noisy picture is static that could have come from any picture with almost equal
  probability. The information that it was a sunflower has been destroyed, not hidden, and no
  denoiser, however good, can read what is no longer there. From that point the reverse process is
  generating a new sample, and which picture it lands on is decided by the random noise. Turn back
  earlier, or use a schedule that still keeps a trace at the turning point, and the sunflower
  returns.</template
>
