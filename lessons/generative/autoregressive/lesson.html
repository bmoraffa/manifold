<template data-part="lede"
  >Every chatbot writes the same way: it looks at what has been written so far, works out how likely
  each possible next piece is, picks one, and repeats. That is all “autoregressive” means. Here the
  model is as simple as it can be: it has read a short text and counted which letter tends to follow
  which. Watch it write, then give it your own text to learn from.</template
>

<template data-part="intro"
  ><p
    >Play a game: I say "once upon a", and you say the next word. You did not need to think. You
    have heard that phrase finished the same way many times. An autoregressive model plays this game
    with itself. It writes a piece, reads back what it has written, guesses the next piece, and
    continues. The only thing that changes from the toy on this page to the largest language model
    is how it makes the guess: by counting here, with a Transformer there.</p
  >
</template>

<template data-part="math"
  ><h4>The idea in one line</h4
  ><p
    >The probability of a whole sequence can always be split into a product of next-item
    probabilities, by the chain rule:</p
  >$$p(x_1,x_2,\dots,x_T)=\prod_{t=1}^{T}p\big(x_t\mid x_1,\dots,x_{t-1}\big).$$<p
    >So a model that can answer "what comes next, given everything so far?" is a complete model of
    sequences. To generate, sample \(x_1\), then \(x_2\) given \(x_1\), and so on.</p
  >
  <h4>The model on this page</h4
  ><p
    >It assumes the next letter depends only on the previous \(k\) letters, and estimates the
    probability by counting in the training text:</p
  >$$p\big(x_t\mid x_{t-k},\dots,x_{t-1}\big)\approx\frac{\text{count}(x_{t-k}\dots
  x_{t-1}\,x_t)}{\text{count}(x_{t-k}\dots x_{t-1})}.$$<p
    >This is an n-gram model with \(n=k+1\). Training is one pass of counting. A neural language
    model replaces the table of counts with a network, which lets it use thousands of items of
    context and share what it learns between similar contexts.</p
  >
  <h4>Temperature</h4
  ><p
    >Before sampling, each probability is raised to the power \(1/\tau\) and the results are
    rescaled to add up to 1:</p
  >$$p_\tau(x)\propto p(x)^{1/\tau}.$$<p
    >With \(\tau&lt;1\) likely letters become more likely still, and the text is safe and
    repetitive. With \(\tau&gt;1\) the choices even out, and the text is varied and error-prone.
    \(\tau\to0\) always takes the single most likely letter.</p
  >
  <h4>Memory against data</h4
  ><p
    >Longer context gives better guesses but splits the text into more and more distinct contexts,
    each seen fewer times. With a short text and \(k=6\), most contexts were seen once, so the model
    has exactly one continuation to offer and reproduces the text. That is overfitting.
    <b>Perplexity</b>, \(\exp\big(-\tfrac1T\sum_t\log p(x_t\mid\text{context})\big)\), is the
    model's average number of equally likely choices per letter. On the training text it always
    falls as \(k\) grows, which is why it must be measured on text the model has not seen.</p
  >
  <h4>Why it matters</h4
  ><p
    >GPT-style models, WaveNet for audio and PixelCNN for images are all autoregressive. Their
    strengths: an exact likelihood and simple training (predict the next item). Their weakness:
    generation is one item at a time, and an early mistake cannot be taken back.</p
  ></template
>

<template data-part="question"
  >With a memory of 6 letters the output is nearly a copy of the training text. Is that a better
  model than memory 3?</template
>

<template data-part="answer"
  >It is a better memoriser, not a better model. With a short training text almost every 6-letter
  context occurred once, so only one continuation has a non-zero count and the model can do nothing
  but replay the text. It has the lowest perplexity on the training text and would do badly on new
  text, where most 6-letter contexts never appeared at all. Memory 3 has seen each context many
  times and has learned patterns it can recombine.</template
>
