<template data-part="lede"
  >Start with the simplest cloud there is, a round Gaussian blob, printed on a rubber sheet. Stretch
  and turn the sheet, a little at a time, until the blob has the shape of the data. If every stretch
  can be undone, two things come for free: new samples, by pushing fresh blob points through the
  stretches, and the exact probability of any point, by pulling it back to the blob and keeping
  count of how much the sheet was stretched there.</template
>

<template data-part="intro"
  ><p
    >Draw a round target on a sheet of rubber, densest at the bullseye. Now stretch the sheet. Where
    you stretch it, the ink thins out, and the density falls. Where you bunch it up, the ink
    concentrates, and the density rises. The total amount of ink never changes. A normalizing flow
    is a recipe for stretching, learned so that the ink ends up where the data is. Because you know
    exactly how much each spot was stretched, you know exactly how dense the ink is there. No other
    model in this module can tell you the exact probability of a point. This one can.</p
  >
</template>

        ><li
          >Take a batch of real points and pull them backwards through the six layers, toward the

<template data-part="math"
  ><h4>Change of variables</h4
  ><p
    >Let \(f\) be an invertible map that carries a data point \(\mathbf x\) back to a point
    \(\mathbf z=f(\mathbf x)\) with a standard Gaussian density \(p_Z\). Then the density of the
    data is</p
  >$$\log p_X(\mathbf x)=\log p_Z\big(f(\mathbf x)\big)+\log\left|\det\frac{\partial
  f}{\partial\mathbf x}\right| .$$<p
    >The first term asks whether \(\mathbf x\) is pulled back to a likely place under the bell. The
    second is the bookkeeping for stretched rubber: the determinant of the Jacobian says how much
    \(f\) expands or shrinks a small area around \(\mathbf x\). Training maximises the average of
    this quantity over the data, which is maximum likelihood with nothing approximated.</p
  >
  <h4>The difficulty, and the trick</h4
  ><p
    >For a general network, the inverse does not exist and the determinant costs far too much to
    compute. Coupling layers (Dinh and others, 2015 and 2017) are designed so that both are easy.
    Split the coordinates into two parts. Leave the first as it is, and move the second by an amount
    that depends only on the first:</p
  >$$y_1=x_1,\qquad y_2=x_2\,e^{\,s(x_1)}+t(x_1).$$<p
    >Here \(s\) and \(t\) are the two outputs of an ordinary small network. They can be as
    complicated as you like, and they are never inverted. To undo the layer, note that \(x_1=y_1\)
    is still available, so \(s\) and \(t\) can be recomputed, and then
    \(x_2=(y_2-t(y_1))\,e^{-s(y_1)}\). The Jacobian is triangular, so its determinant is the product
    of its diagonal:</p
  >$$\log\left|\det\frac{\partial\mathbf y}{\partial\mathbf x}\right|=s(x_1).$$
  <h4>Stacking layers</h4
  ><p
    >One coupling layer leaves \(x_1\) untouched, so between layers the axes are changed. With many
    dimensions the two halves swap roles. In two dimensions this page turns the plane by 60° before
    each layer, which costs nothing because a turn does not change areas. For a chain
    \(f=f_K\circ\dots\circ f_1\) the log-determinants add:</p
  >$$\log p_X(\mathbf x)=\log p_Z(\mathbf z)+\sum_{k=1}^{K}s_k .$$<p
    >The loss shown is minus the average of this over a batch.</p
  >
  <h4>Sampling and density, both exact</h4
  ><p
    >To sample, draw \(\mathbf z\sim\mathcal N(\mathbf 0,\mathbf I)\) and apply the inverses in
    reverse order: this is the animation on the left. To evaluate the density at a point, apply the
    layers forwards and add up the \(s_k\): this is the top-right picture, and the readout for your
    own point. A density that can be evaluated exactly is useful for spotting unusual inputs, for
    compression, and for comparing models fairly.</p
  >
  <h4>What it cannot do</h4
  ><p
    >A smooth invertible map cannot tear the sheet or glue parts of it together. A blob has no hole,
    so its image has no hole. To cover a ring, or two separate groups, the model must stretch a thin
    film of density across the gap. You can see that film in the density picture, and some generated
    points land on it. More layers make the film thinner but never remove it. The second limit is
    cost: every layer must keep the same number of dimensions as the data, with no bottleneck.</p
  >
  <h4>Where flows went next</h4
  ><p
    >Glow applied coupling layers to images. Autoregressive flows make each coordinate depend on all
    the earlier ones. Continuous normalizing flows replace the stack of layers with an ODE,
    \(d\mathbf x/dt=\mathbf v_\theta(\mathbf x,t)\), and flow matching, which has its own tab, is
    the modern way of training those without ever computing a determinant.</p
  >
  <h4>What this page trains</h4
  ><p
    >Six coupling layers. Each has its own network with two hidden layers of 32 neurons, whose scale
    output is kept between −1.2 and 1.2. Training uses Adam on batches of 96 for 1,500 steps.</p
  ></template
>

<template data-part="question"
  >The model gives the exact density at any point. A student proposes using it as a spam filter for
  data: flag any input whose density is low. In the ring data set, which points would this wrongly
  accept?</template
>

<template data-part="answer"
  >Points on the thin film that the model had to stretch across the hole or the gap. A flow cannot
  tear the Gaussian apart, so some density always connects regions that the data keeps separate. A
  point on that bridge receives a moderate density even though no real data ever appears there. The
  exact density is exact for the model, not for the world: it is only as good as the fit.</template
>
