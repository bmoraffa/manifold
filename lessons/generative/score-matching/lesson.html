<template data-part="lede"
  >Suppose you could stand anywhere in the plane and ask one question: in which direction does the
  data get denser? That arrow is called the score. With arrows everywhere you can generate data by
  dropping points at random and letting them climb, with a little jitter. The surprise is that the
  arrows can be learned without ever knowing the density itself, by practising one simple job:
  removing noise.</template
>

<template data-part="intro"
  ><p
    >Imagine a dark hillside with a few campfires. You cannot see the fires, but everywhere you
    stand you can feel which way is warmer. Follow the warmth and you reach a fire. The score is
    that "warmer this way" arrow, with data density in place of heat. There is one difficulty: far
    from every fire you feel almost nothing, and what you do feel is unreliable. The fix is to begin
    with huge bonfires whose warmth reaches the whole hillside, walk toward them, and then shrink
    the fires in stages. Each stage only has to guide you from "roughly right" to "a bit more
    exactly right".</p
  >
</template>

<template data-part="math"
  ><h4>The score</h4
  ><p>For a density \(p(\mathbf x)\) the score is the gradient of its logarithm:</p>$$\mathbf
  s(\mathbf x)=\nabla_{\mathbf x}\log p(\mathbf x).$$<p
    >It points toward higher density, and it is longer where the density changes faster. Writing a
    model as \(p(\mathbf x)=e^{-E(\mathbf x)}/Z\) shows why the score is convenient: the awkward
    constant \(Z\), which makes probabilities sum to one, disappears when you take the gradient of
    the logarithm. A network can output a score without anyone ever computing \(Z\).</p
  >
  <h4>Learning it by denoising</h4
  ><p
    >We do not know \(p\), so we cannot compute its score to train against. Vincent (2011) showed a
    way around this. Blur the data with Gaussian noise of size \(\sigma\): \(\tilde{\mathbf
    x}=\mathbf x+\sigma\boldsymbol\varepsilon\). The score of the blurred density \(p_\sigma\) is
    the minimiser of</p
  >$$\mathcal L(\sigma)=\mathbb E_{\mathbf x,\boldsymbol\varepsilon}\Big\lVert\,\mathbf
  s_\theta(\tilde{\mathbf x},\sigma)+\frac{\boldsymbol\varepsilon}{\sigma}\Big\rVert^2 .$$<p
    >In words: the arrow at a noisy point should point back along the noise that was added,
    \(-\boldsymbol\varepsilon/\sigma=(\mathbf x-\tilde{\mathbf x})/\sigma^2\). Many clean points
    could have produced the same noisy point, and the average of all their "way back" arrows is
    exactly \(\nabla\log p_\sigma\). This page trains the network to output
    \(\hat{\boldsymbol\varepsilon}\) and uses \(\mathbf
    s_\theta=-\hat{\boldsymbol\varepsilon}/\sigma\), which is the same loss multiplied by
    \(\sigma^2\) so that every level counts equally.</p
  >
  <h4>Checking against the exact answer</h4
  ><p
    >For the 500 data points on this page, the blurred density is a mixture of 500 small Gaussians,
    one on each point, and its score has a closed form:</p
  >$$\nabla\log p_\sigma(\mathbf x)=\frac{1}{\sigma^2}\sum_i w_i(\mathbf x)\,(\mathbf x_i-\mathbf
  x),\qquad w_i(\mathbf x)\propto\exp\!\Big(-\frac{\lVert\mathbf x-\mathbf
  x_i\rVert^2}{2\sigma^2}\Big).$$<p
    >That is the top-right picture. The network never sees this formula. The bar chart counts how
    many of its arrows fall within 25° of it.</p
  >
  <h4>Generating: Langevin dynamics</h4><p>Given a score, repeat</p>$$\mathbf x\leftarrow\mathbf
  x+\frac{\alpha}{2}\,\mathbf s_\theta(\mathbf x,\sigma)+\sqrt{\alpha}\,\mathbf z,\qquad\mathbf
  z\sim\mathcal N(\mathbf 0,\mathbf I).$$<p
    >Climb the arrow a little, then jitter. Without the jitter every point would end on a peak of
    the density. With it, and with a small step \(\alpha\), the points settle into samples spread
    according to \(p_\sigma\) itself.</p
  >
  <h4>Why one noise level is a poor bet</h4
  ><p
    >With a small \(\sigma\) the blurred density is almost the real one, but training only ever
    showed the network points close to the data. Far away, where random starting points land, the
    arrows were never practised and cannot be trusted. Even the exact score has a second problem
    there: between two separate groups it is nearly blind to how many points each group holds, so
    the groups receive the wrong shares. With a large \(\sigma\) the arrows are reliable everywhere,
    but they lead to a blurred version of the data. On the two-dimensional shapes of this page a
    middle level happens to work about as well as the whole ladder, as you can check. For images,
    the distance from a random start to the data is vastly larger than the detail that has to be
    resolved, and no single level covers both.</p
  >
  <h4>Annealing</h4
  ><p
    >Song and Ermon (2019) train one network on a ladder of levels
    \(\sigma_1>\sigma_2>\dots>\sigma_L\) and sample by running Langevin dynamics at each level in
    turn, with step \(\alpha_i\propto\sigma_i^2\), using the result of one level as the start of the
    next. The large levels move the points across empty space. The small levels sharpen them. This
    page uses ten levels from 1.2 down to 0.05, each 0.7 times the one before, with twelve Langevin
    steps per level.</p
  >
  <h4>The link to diffusion</h4
  ><p
    >A diffusion model's noise prediction is this same quantity under another name: \(\nabla\log
    p_t(\mathbf x)=-\boldsymbol\varepsilon_\theta(\mathbf x,t)/\sqrt{1-\bar\alpha_t}\). Its many
    noise levels are the ladder, and its sampling loop is annealed Langevin dynamics with a
    particular choice of step sizes. Song and others (2021) joined the two views into one framework
    in which the noise level changes continuously.</p
  ></template
>

<template data-part="question"
  >The loss compares the network’s arrow with the direction back to one particular clean point. But
  many clean points could have produced the same noisy point. Why does training on these conflicting
  targets give the right answer?</template
>

<template data-part="answer"
  >Because the loss is a squared error, and the single arrow that minimises a squared error against
  many targets is their average. At a given noisy point the targets are the “way back” arrows to
  every clean point that could have produced it, weighted by how likely each one is. That weighted
  average is exactly the gradient of the log of the blurred density, which is the score. The
  individual targets conflict, but their mean is what we wanted all along. It is the same reason the
  error never falls to zero.</template
>
