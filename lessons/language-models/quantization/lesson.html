<template data-part="lede"
  >A trained network is a long list of numbers, and each one is normally stored with 32 bits. A
  large language model has billions of them, which is why it needs a data centre. Quantization
  stores every weight with fewer bits by rounding it to the nearest value on a short list. The
  surprise is how far this can go: at 8 bits almost nothing is lost, at 4 bits very little, and
  then, quite suddenly, the network falls apart. Here a real letter-reading network is rounded while
  you watch.</template
>

<template data-part="intro"
  ><p
    >Measure the height of everyone in a class to the nearest tenth of a millimetre and you have
    recorded far more than anyone needs. To the nearest centimetre is plenty: the list is much
    shorter to write down and nothing useful is lost. To the nearest half metre is too coarse:
    almost everyone becomes "1.5" and the list is useless. Somewhere between lies the coarsest ruler
    that still does the job. Quantization is the search for that ruler for the weights of a network.
    It works as well as it does because a network's answer comes from adding up thousands of
    weights, and small rounding errors in opposite directions largely cancel.</p
  >
</template>

<template data-part="math"
  ><h4>Uniform quantization</h4
  ><p
    >Take the weights of one layer and let \(m\) be the largest size among them. With \(b\) bits,
    use the whole numbers from \(-Q\) to \(Q\), where \(Q=2^{\,b-1}-1\), and a step</p
  >$$\Delta=\frac{m}{Q}.$$<p
    >Each weight \(w\) is replaced by a whole number \(q\), which is all that is stored, and is read
    back as \(\hat w\):</p
  >$$q=\operatorname{round}\!\Big(\frac{w}{\Delta}\Big),\qquad \hat w=q\,\Delta .$$<p
    >The line of calculations under the pictures does this for one weight. For 8 bits \(q\) runs
    from \(-127\) to \(127\). The layer also stores the single number \(\Delta\).</p
  >
  <h4>The error</h4
  ><p
    >Rounding moves a weight by at most half a step, \(|w-\hat w|\le\Delta/2\). If the errors are
    spread evenly inside that interval, their typical size is</p
  >$$\sqrt{\mathbb E\big[(w-\hat w)^2\big]}=\frac{\Delta}{\sqrt{12}} .$$<p
    >Removing one bit doubles \(\Delta\) and so doubles the error, while the saving in size from
    that bit gets smaller each time: from 8 to 7 bits saves an eighth, from 2 to 1 saves a half.
    That is why the accuracy curve is flat for a long way and then falls off a cliff.</p
  >
  <h4>One bit</h4
  ><p
    >With a single bit there is no room for zero, so the rule changes: keep only the sign of each
    weight and give all of them the same size, the average size in the layer,</p
  >$$\hat w=\operatorname{sign}(w)\cdot\frac{1}{n}\sum_i|w_i| .$$<p
    >That a network still works at all like this says how much of what it knows is carried by the
    pattern of signs.</p
  ><p
    >On this page 2 bits can score lower than 1 bit. With 2 bits and the full range the three
    allowed values are \(-m\), 0 and \(m\). Because \(m\) is set by the single largest weight, most
    weights are closer to 0 than to \(\pm m\) and are rounded to exactly zero, which switches them
    off. The 1-bit rule never produces a zero. Clipping the range, described next, repairs much of
    the 2-bit case.</p
  >
  <h4>The range matters</h4
  ><p
    >The allowed values are spread across the whole range \([-m,m]\). If one weight is far larger
    than the others, it stretches the range, the step \(\Delta\) grows, and all the ordinary weights
    are rounded more coarsely to accommodate one outlier. <b>Clipping</b> sets \(m\) to a percentile
    of the sizes, here the 99th, and squashes the few larger weights down to it. They are
    represented badly and everything else is represented better. Whether that pays depends on the
    layer, and choosing the range well is most of the craft in this simple form of quantization.</p
  >
  <h4>In large language models</h4
  ><p
    >A model with 7 billion weights takes 28 gigabytes at 32 bits, 14 at 16 bits, 7 at 8 bits and
    3.5 at 4 bits. Four-bit versions of open models are what run on laptops and phones. Fewer bits
    also make the arithmetic itself faster and cheaper in energy. Rounding a finished model, as this
    page does, is called post-training quantization. When that loses too much, the model can be
    trained with the rounding already in place so that it learns weights that survive it, which is
    quantization-aware training. Practical schemes also use different steps for different groups of
    weights, and spend more bits on the layers that turn out to be most sensitive.</p
  >
  <h4>What this page trains</h4
  ><p
    >A network that reads 5 by 7 pictures of six letters, with 35 inputs, 24 hidden neurons and 6
    outputs. Its 984 weights are quantized, one scale per layer. The 30 biases are left at full
    precision. The pictures have 12% of their squares flipped at random, which makes the task hard
    enough for errors to show. Accuracy is measured on 300 pictures the network did not train on.</p
  ></template
>

<template data-part="question"
  >Going from 32 bits to 8 bits makes the model four times smaller and costs almost no accuracy.
  Going from 2 bits to 1 bit makes it only twice smaller and destroys much of the accuracy. Why is
  the trade so different at the two ends?</template
>

<template data-part="answer"
  >Each bit removed doubles the size of the rounding step, and so doubles the error in every weight.
  At 32 bits the error is so far below what the network can notice that doubling it twenty times
  over still leaves it negligible: those bits were storing precision the network never used. At 2
  bits the step is already about the size of a typical weight, so doubling it again erases the
  differences between weights that the network depends on. The saving, meanwhile, is measured
  against what is left, so the last bits removed save the fewest bytes in absolute terms and cost
  the most.</template
>
