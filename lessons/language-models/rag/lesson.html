<template data-part="lede"
  >A language model only knows what was in its training text. It has never read your course
  handbook, last week’s report, or anything written after it was trained, and when asked about them
  it may invent an answer. Retrieval-augmented generation, or RAG, is the fix used almost
  everywhere: first search a collection of documents for the passages closest to the question, then
  hand those passages to the model together with the question. Here the search is real, and you can
  add your own passage and ask about it.</template
>

<template data-part="intro"
  ><p
    >There are two kinds of exam. In a closed-book exam you answer from memory, and when memory
    fails you are tempted to write something that merely sounds right. In an open-book exam you
    first find the right page and then answer from what it says. A language model on its own always
    sits the closed-book exam. Retrieval turns it into an open-book one. The model does not become
    more knowledgeable. It is handed the right page at the moment it needs it. Everything then
    depends on finding the right page.</p
  >
</template>

<template data-part="math"
  ><h4>Embeddings: text as a point</h4
  ><p
    >To search by meaning, every passage \(d\) is turned into a vector \(\mathbf e(d)\). This page
    uses the classical choice, <b>TF-IDF</b>. There is one coordinate for every word \(w\) in the
    collection, and its value is</p
  >$$e_w(d)=\mathrm{tf}(w,d)\cdot\log\frac{N+1}{\mathrm{df}(w)+1},$$<p
    >where \(\mathrm{tf}\) counts how often the word occurs in the passage, \(N\) is the number of
    passages and \(\mathrm{df}(w)\) is the number of passages that contain the word. A word that
    appears everywhere, such as "student", gets a small weight. A word that appears in one passage,
    such as "parking", gets a large one. Very common words like "the" are dropped. The question is
    embedded in the same way.</p
  >
  <h4>Scoring</h4
  ><p
    >Closeness is measured by <b>cosine similarity</b>, the cosine of the angle between two
    vectors:</p
  >$$\mathrm{sim}(q,d)=\frac{\mathbf e(q)\cdot\mathbf e(d)}{\lVert\mathbf e(q)\rVert\,\lVert\mathbf
  e(d)\rVert}.$$<p
    >It is 1 when the two texts use the same words in the same proportions and 0 when they share no
    weighted word. Dividing by the lengths means a long passage does not win merely by being long.
    The right-hand chart shows this number for every passage.</p
  >
  <h4>Retrieve, then generate</h4
  ><p
    >The \(k\) passages with the highest similarity are pasted into the prompt in front of the
    question. The model then computes its usual next-token probabilities, now conditioned on the
    retrieved text:</p
  >$$p(\text{answer}\mid\text{question})\ \longrightarrow\
  p\big(\text{answer}\mid\text{passage}_1,\dots,\text{passage}_k,\ \text{question}\big).$$<p
    >Nothing about the model changes: no training, no new weights. That is the appeal. Updating what
    the system knows means editing the collection, which takes seconds.</p
  >
  <h4>Choosing k</h4
  ><p
    >With \(k\) too small the passage that holds the answer may be left out, and the model cannot
    answer however capable it is. With \(k\) too large the prompt fills with unrelated text, which
    costs more, runs slower, and gives the model more chances to be distracted by something
    irrelevant. Typical systems retrieve between 3 and 20 passages and often re-rank them with a
    second, more careful model.</p
  >
  <h4>Where it fails</h4
  ><p
    >Most failures of RAG are failures of the search, and you can produce each of them here.
    <b>Vocabulary mismatch</b>: the question says "teaches" and the passage says "taught", so a
    word-matching search sees no overlap. <b>Nothing relevant exists</b>: the search still returns
    its \(k\) best passages, however poor, so a good system checks the score and is told to say "I
    do not know". <b>The answer is split</b> across two passages and only one is retrieved.
    <b>Bad chunking</b>: a passage was cut in the middle of the fact.</p
  >
  <h4>Dense embeddings</h4
  ><p
    >Modern systems replace TF-IDF with a neural network that maps text to a vector of a few hundred
    to a few thousand numbers, trained so that texts with the same meaning land close together even
    when they share no words. With such embeddings "who teaches" and "is taught by" are neighbours.
    The rest of the pipeline is exactly what you see here: embed, score with cosine similarity, take
    the top \(k\), build the prompt. Many systems combine the two kinds of search, because exact
    word matching is still the best way to find names, codes and numbers.</p
  >
  <h4>What this page does, and what stands in for the model</h4
  ><p
    >The embedding, the similarity scores, the ranking and the prompt are all computed for real in
    your browser. The map squeezes the embeddings into two dimensions with PCA, so nearness on the
    map is only a rough guide and the bar chart is the exact picture. There is no large language
    model inside this page. Its place is taken by a simple reader that picks, from the retrieved
    passages, the sentence that best matches the question and the kind of answer asked for (a name
    for “who”, a number for “how many”), and that refuses when the best similarity is below 0.12. A
    real model would phrase the answer in its own words and could combine several passages. It could
    not do better than the passages it was given.</p
  ></template
>

<template data-part="question"
  >A company adds retrieval to its chatbot, and the bot still answers a question about the refund
  policy wrongly. The refund policy is in the document collection. Name two different places the
  failure could be, and how you would tell them apart.</template
>

<template data-part="answer"
  >First look at what was retrieved. If the refund passage is not among the k passages in the
  prompt, the search failed: perhaps the customer’s wording shares no words with the passage, or the
  passage was cut badly, or k is too small. The fix is in the retrieval. If the passage is in the
  prompt and the answer is still wrong, the model failed to use it: perhaps it was buried among many
  irrelevant passages, or the instruction to answer only from the passages was weak. Reading the
  actual prompt, as this page lets you do, separates the two cases at once.</template
>
