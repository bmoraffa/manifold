<template data-part="lede"
  >One big model that does everything must use all of itself for every input. A mixture of experts
  splits the work: several small models, each good at one kind of input, and a router that looks at
  each input and decides whose answer to use. Nobody assigns the specialities. The experts and the
  router are trained together and the division of labour appears by itself. Large language models
  use this idea to grow much bigger without becoming much slower. Here the experts are as simple as
  they can be, straight lines, so that you can watch each one find its job.</template
>

<template data-part="intro"
  ><p
    >A hospital does not send every patient to every doctor. A receptionist looks at each patient
    and sends them to cardiology, orthopaedics or dermatology. Each department sees only its own
    kind of case and becomes good at it. Adding a department makes the hospital more capable without
    making any single visit slower, because a patient still sees one or two doctors, not all of
    them. The interesting part is that in a mixture of experts nobody draws up the departments. The
    receptionist and the doctors start out knowing nothing and sort it out between them from results
    alone.</p
  >
</template>

<template data-part="math"
  ><h4>The model</h4
  ><p
    >There are \(K\) experts \(f_1,\dots,f_K\) and a router, also called a gate. For an input \(x\)
    the router produces one score per expert and turns the scores into shares with a softmax:</p
  >$$g_k(x)=\frac{e^{u_k(x)}}{\sum_j e^{u_j(x)}},\qquad \hat y(x)=\sum_{k=1}^{K}g_k(x)\,f_k(x).$$<p
    >On this page each expert is a line, \(f_k(x)=a_kx+b_k\), and each router score is a line too,
    \(u_k(x)=c_kx+d_k\). A single line cannot follow data with a bend in it. \(K\) lines, each used
    in its own region, can.</p
  >
  <h4>How the division of labour emerges</h4
  ><p
    >Train everything together on the squared error \(\tfrac12(\hat y-y)^2\). With \(\delta=\hat
    y-y\), the gradients are</p
  >$$\frac{\partial L}{\partial f_k}=\delta\,g_k,\qquad \frac{\partial L}{\partial
  u_k}=\delta\,g_k\,\big(f_k-\hat y\big).$$<p
    >The first says an expert is corrected in proportion to its share \(g_k\): it learns from the
    points it is trusted with and hardly at all from the others. The second says the router raises
    an expert's share where that expert's answer would pull the mixture toward the truth, and lowers
    it where it would pull away. The two feed each other. An expert that is slightly better in some
    region gets more of it, learns it better, and gets more still. That loop is what turns an even
    blur into sharp territories (Jacobs, Jordan, Nowlan and Hinton, 1991).</p
  >
  <h4>Blending against routing</h4
  ><p
    >Blending every expert's answer uses all \(K\) experts for every input, so nothing is saved.
    Once the territories are sharp, the shares are close to 0 or 1 and little is lost by asking only
    the expert with the largest share:</p
  >$$\hat y_{\text{top}}(x)=f_{k^\star}(x),\qquad k^\star=\arg\max_k g_k(x).$$<p
    >Now each input costs one expert, however many exist. The two error readouts show how much this
    costs. The cost is highest near the boundaries, where two experts are both partly right.</p
  ><p
    >This only works if each expert can stand on its own. On the smooth wave the mixture on this
    page finds a different solution: no line fits a curve, so it produces the curve by blending
    several lines, none of which is close to the data by itself. Remove the blending and the answer
    collapses. Large models avoid this by routing each input to its top few experts during training
    as well, so that every expert is forced to give a usable answer alone.</p
  >
  <h4>In large language models</h4
  ><p
    >In a Transformer, most of the weights sit in the feed-forward part of each layer. A
    mixture-of-experts model replaces that part with several feed-forward networks, for instance 8,
    and a small router that sends each token to the best 2. The model holds the knowledge of all 8,
    and each token pays for 2. This is called a sparse mixture of experts (Shazeer and others,
    2017), and it is how some open and commercial models reach very large sizes at a moderate
    running cost. The experts are not tidy human specialities such as "maths" or "French": what each
    one takes on is whatever division happened to lower the error.</p
  >
  <h4>What goes wrong</h4
  ><p
    >The reinforcing loop can run away. One expert gets ahead early, receives everything, and the
    others receive no data and never improve: these are dead experts. Watch the middle picture with
    a large \(K\). Large models add a load-balancing term to the loss that penalises uneven use, and
    often add noise to the router's scores during training. The opposite failure also occurs: the
    router never commits, every expert does a little of everything, and the model is an expensive
    average.</p
  >
  <h4>Not the same as an ensemble</h4
  ><p
    >An ensemble, as in the Ensembles module, runs every model on every input and averages. Its
    members are trained to solve the whole problem and it gains from their errors cancelling. A
    mixture of experts trains its members to solve different parts of the problem and gains from
    sending each input to the right one.</p
  >
  <h4>What this page trains</h4
  ><p
    >\(K\) lines and a router with \(2K\) numbers, trained together with Adam on all 160 points at
    every step. Training stops when the error has changed by less than one part in a thousand over
    100 steps, or after 4,000 steps.</p
  ></template
>

<template data-part="question"
  >With six experts on the three-piece data, some experts end up handling almost none of the data.
  Is the model with idle experts worse than a model trained with three experts from the
  start?</template
>

<template data-part="answer"
  >Not in accuracy: the working experts fit the three pieces just as a three-expert model would, and
  the idle ones contribute almost nothing to the answer because their shares are near zero. What is
  lost is efficiency. The idle experts still take up memory and were paid for in training. In a
  large model that is a serious waste, which is why a load-balancing penalty is added to push the
  router into using every expert. On this data there are only three pieces to find, so there is
  nothing useful for the extra experts to do, and leaving them idle is the sensible
  outcome.</template
>
