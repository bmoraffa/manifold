<template data-part="lede"
  >Before learning by trial and error, take the easier case: the robot has a complete map. It knows
  every square, what each move does, and what each reward is. No experience is needed, only
  thinking. The thinking is one small calculation repeated over and over: the value of a square is
  the best you can get by making one move and then collecting the value of wherever you land. Watch
  values spread out from the goal like water, and the arrows fall into place behind them.</template
>

<template data-part="intro"
  ><p
    >Suppose you want to know how many minutes each junction in a town is from the railway station,
    and you have a map. Write 0 on the station. Every junction next to it is "one street away":
    write that down. Every junction next to those is "one more street". Keep going and the numbers
    flood outward from the station until the map is covered. Once every junction has its number,
    finding the way from anywhere is trivial: at each junction, walk toward the neighbour with the
    smallest number. Value iteration is this flood, with rewards in place of minutes and with the
    complication that a move may not go where you intended.</p
  >
</template>

<template data-part="math"
  ><h4>The setting: a Markov decision process</h4
  ><p
    >There is a set of states \(s\), a set of actions \(a\), transition probabilities \(P(s'\mid
    s,a)\) saying where each action leads, a reward \(r(s,a,s')\), and a discount \(\gamma\). A
    <b>policy</b> \(\pi\) says which action to take in each state. The <b>value</b> \(V^\pi(s)\) is
    the expected total discounted reward from \(s\) when following \(\pi\). The goal is the policy
    whose values are highest everywhere.</p
  >
  <h4>The Bellman optimality equation</h4
  ><p
    >The values of the best policy satisfy a consistency condition (Bellman, 1957). The value of a
    state is the best, over actions, of the immediate reward plus the discounted value of the next
    state:</p
  >$$V^\star(s)=\max_a\sum_{s'}P(s'\mid s,a)\,\big[r(s,a,s')+\gamma V^\star(s')\big].$$<p
    >This is one equation for every state, all tied together, and the \(\max\) makes them impossible
    to solve by ordinary algebra.</p
  >
  <h4>Value iteration</h4
  ><p>Turn the equation into an update. Start from \(V_0=0\) and compute, for every state,</p
  >$$V_{k+1}(s)=\max_a\sum_{s'}P(s'\mid s,a)\,\big[r(s,a,s')+\gamma V_k(s')\big].$$<p
    >The panel under the pictures writes this out for one square: four lines, one per move, then the
    best. Each sweep brings every value closer to \(V^\star\) by at least the factor \(\gamma\):</p
  >$$\max_s\big|V_{k+1}(s)-V^\star(s)\big|\le\gamma\,\max_s\big|V_k(s)-V^\star(s)\big|.$$<p
    >That is why the top-right curve falls steadily, and why a \(\gamma\) near 1 needs more sweeps.
    Information travels one square per sweep, so a goal ten squares away takes at least ten sweeps
    to be felt.</p
  >
  <h4>From values to behaviour</h4
  ><p>Given values, the best move in each state is the one that achieved the maximum:</p
  >$$\pi(s)=\arg\max_a\sum_{s'}P(s'\mid s,a)\,\big[r(s,a,s')+\gamma V(s')\big].$$<p
    >The arrows usually stop changing long before the values have converged, because the arrow only
    depends on which neighbour is better, not on by how much.</p
  >
  <h4>Policy iteration</h4
  ><p
    >Howard (1960) used that observation. Alternate two steps. <b>Evaluate</b>: with the arrows
    fixed, find the values of following them, by sweeping the simpler update without a \(\max\)
    until it settles,</p
  >$$V^\pi(s)=\sum_{s'}P(s'\mid s,\pi(s))\,\big[r+\gamma V^\pi(s')\big].$$<p
    ><b>Improve</b>: redraw every arrow toward the best move under those values. Each round gives a
    policy at least as good as the last, and there are finitely many policies, so it stops, usually
    after very few rounds. Each round costs many sweeps, though, as the readout shows.</p
  >
  <h4>What the settings do</h4
  ><p
    ><b>Slippery floor</b>: with chance \(p\) a move slides to one side or the other. Next to the
    pit, when steps are cheap, the robot then prefers a move that cannot slide into it, even walking
    into a wall. <b>Step reward</b>: at 0 there is no hurry and the robot takes the safest route
    however long. At \(-3\) life is so costly that a risky short cut becomes worthwhile, and for
    squares far from the goal even the pit can be preferable to a long walk. <b>\(\gamma\)</b>:
    small values make distant rewards nearly worthless.</p
  >
  <h4>Why this is not yet learning</h4
  ><p
    >Everything here needs \(P\) and \(r\) to be known: the robot is planning, not learning. In most
    real problems nobody hands you the rules. The next tabs keep the same Bellman idea and replace
    the known probabilities with experience: Monte Carlo and TD learning estimate values from
    sampled walks, and Q-learning does so while also choosing the moves.</p
  ></template
>

<template data-part="question"
  >In the room, set the reward for each step to 0 and the slippery floor to 0.3. The best move in
  C4, the square directly under the pit, is now “down”, straight into the wall, which gets the robot
  nowhere. Why is that the best move?</template
>

<template data-part="answer"
  >Because a move can slide sideways. The robot wants to go left, away from the pit. But a move to
  the left can slide up, and up from C4 is the pit. A move down pushes into the wall and keeps the
  robot where it is, and its two possible slides are left, to safety, and right, into another wall.
  So “down” can never enter the pit, and sooner or later it slides the robot to the left. When steps
  cost nothing, waiting for that lucky slide is better than taking a real chance of losing 10. Give
  each step a cost of 1 and the patience stops paying: click C4 to compare the four
  numbers.</template
>
