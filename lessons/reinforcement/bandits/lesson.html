<template data-part="lede"
  >Five food trucks park outside your office. Each has its own hidden chance of serving you a good
  lunch, and you have 1,500 lunches to spend. Every day at the best truck you have found so far is a
  day you learn nothing about the others. Every day spent testing another truck may be a wasted
  lunch. This is the simplest problem in reinforcement learning, and the same dilemma sits inside
  every harder one. Four strategies play it side by side here, and you can play against
  them.</template
>

<template data-part="intro"
  ><p
    >You move to a new town with five restaurants on your street. On the first night you pick one at
    random and it is good. On the second night, do you go back? If you always return to the best
    place you know, you may eat for years at the third-best restaurant in town because of one lucky
    evening. If you keep trying everything for ever, you keep eating bad dinners you could have
    avoided. The sensible course is in between: try the others enough to be reasonably sure, and try
    them less and less as the evidence comes in. The strategies on this page are different precise
    versions of "enough".</p
  >
</template>

<template data-part="math"
  ><h4>The problem</h4
  ><p
    >There are \(K\) options, called arms after the levers of slot machines. Arm \(k\) pays 1 with
    unknown probability \(\mu_k\) and 0 otherwise. On each of \(T\) days you choose one arm \(a_t\)
    and see only its result. The best arm has \(\mu^\star=\max_k\mu_k\). The <b>regret</b> after
    \(T\) days is the expected reward given up by not always choosing it:</p
  >$$\text{Regret}(T)=\sum_{t=1}^{T}\big(\mu^\star-\mu_{a_t}\big).$$<p
    >A strategy that keeps choosing a worse arm a fixed share of the time has regret that grows in a
    straight line. A good strategy has regret that grows more and more slowly, like \(\log T\),
    which is the best that can be achieved.</p
  >
  <h4>Greedy and ε-greedy</h4
  ><p
    >Keep the average result \(\hat\mu_k\) of each arm and its number of pulls \(n_k\).
    <b>Greedy</b> pulls \(\arg\max_k\hat\mu_k\). After trying each arm once it never explores again,
    so an unlucky first result on the best arm can banish it for good. <b>ε-greedy</b> pulls a
    uniformly random arm with probability \(\varepsilon\) and the greedy arm otherwise. It always
    finds the best arm in the end, and it always goes on spending the share \(\varepsilon\) on
    random pulls, most of them on arms it already knows are worse. Its regret is a straight line
    with a smaller slope.</p
  >
  <h4>UCB: optimism in the face of uncertainty</h4
  ><p
    >The upper confidence bound rule (Auer and others, 2002) gives each arm a score: its average
    plus a bonus that is large when the arm has been tried little,</p
  >$$\text{score}_k=\hat\mu_k+\sqrt{\frac{\ln t}{2\,n_k}},$$<p
    >and pulls the highest score. An arm is chosen either because it looks good or because too
    little is known about it to rule it out. Each pull shrinks that arm's bonus. The \(\ln t\) makes
    every bonus creep up slowly, so no arm is abandoned for ever, and it is revisited more and more
    rarely. Exploration is directed at the arms where it can still change the decision. The original
    UCB1 rule uses the larger bonus \(\sqrt{2\ln t/n_k}\), which is safer in theory and explores
    noticeably more than is needed on a problem this small.</p
  >
  <h4>Thompson sampling: act on a plausible guess</h4
  ><p
    >Keep a full belief about each \(\mu_k\). Starting from "anything between 0 and 1 is equally
    likely", after \(w_k\) good and \(l_k\) bad results the belief is a Beta distribution,</p
  >$$\mu_k\sim\mathrm{Beta}(1+w_k,\ 1+l_k).$$<p
    >Each day, draw one value from every arm's belief and pull the arm whose draw is highest
    (Thompson, 1933). A rarely tried arm has a wide belief, so its draw is sometimes high and it
    gets tried. A well-known poor arm has a narrow belief around a low value and almost never wins
    the draw. The rule has no setting to tune, and it chooses each arm with exactly the probability
    that the arm is the best one given the evidence.</p
  >
  <h4>Why this matters beyond lunch</h4
  ><p
    >Websites choose which headline or advert to show with these rules, clinical trials use them to
    give fewer patients the worse treatment, and recommendation systems use them to try new items.
    In the rest of this module the same tension returns as the ε in Q-learning: a robot that only
    does what currently looks best never finds out that something else is better.</p
  >
  <h4>What this page runs</h4
  ><p
    >Five arms with success chances 0.20, 0.35, 0.50, 0.60 and 0.80, in a random order that is
    hidden until you ask. All four strategies face the same five trucks for 1,500 days, each with
    its own lunches. Regret is computed from the true chances, so it is exact and does not depend on
    the luck of individual lunches. One run is one sample, so press Start over a few times. Averaged
    over 300 runs of this exact setup, the regret after 1,500 days is about 99 for greedy (usually
    under 5, occasionally over 300), 68 for ε-greedy with ε = 0.1, 33 for UCB and 22 for Thompson
    sampling.</p
  ></template
>

<template data-part="question"
  >After 1,500 days ε-greedy with ε = 0.1 has found the best truck and rates it highest. Its regret
  is still rising steadily. Why, and what simple change would fix it?</template
>

<template data-part="answer"
  >It still chooses a random truck on one day in ten, and four times out of five that random truck
  is not the best one. Those days are wasted for ever, however certain it has become, so its regret
  rises by a fixed amount per day. The fix is to explore less as evidence accumulates, for example
  by shrinking ε over time. UCB and Thompson sampling do this automatically: their exploration fades
  exactly as fast as their uncertainty does.</template
>
