<template data-part="lede"
  >A robot is dropped into a room it has never seen. Nobody tells it where the goal is, where the
  pit is, or what its moves do. All it gets is a number after every step: −1 for an ordinary step,
  +10 for reaching the goal, −10 for falling into the pit. Q-learning turns that trickle of numbers
  into a table that says, for every square and every move, how good that move is. On this page you
  can watch every single entry of the table being computed, with the arithmetic written
  out.</template
>

<template data-part="intro"
  ><p
    >Imagine learning your way round a new city with no map, by keeping a notebook. On each page is
    one street corner, and on that page four numbers: how good it has turned out to be to go north,
    east, south or west from there. At first every number is zero. You walk. Each time you take a
    step you look at the page for the corner you have just arrived at, find its best number, and use
    it to correct the number for the step you just took: "going east from the bakery got me to the
    fountain, and the fountain is a good place to be, so east from the bakery is good too". You
    never need to know the whole route. Good news spreads backwards through the notebook, one corner
    at a time, from the places where something actually happened.</p
  >
</template>

<template data-part="math"
  ><h4>What the table means</h4
  ><p
    >\(Q(s,a)\) is an estimate of the total reward the robot will collect from now on if it is in
    square \(s\), makes move \(a\), and behaves as well as possible afterwards. Rewards further in
    the future are counted a little less, by a factor \(\gamma\) for each step of delay:</p
  >$$Q^\star(s,a)=\mathbb E\big[r_1+\gamma r_2+\gamma^2r_3+\dots\ \big|\ s,a,\ \text{then act
  optimally}\big].$$<p
    >If the table were correct, behaving well would be easy: in every square, make the move with the
    highest value. Learning the table is the whole problem.</p
  >
  <h4>The update</h4
  ><p
    >The robot is in \(s\), makes move \(a\), receives reward \(r\) and lands in \(s'\). It then
    changes one entry of the table:</p
  >$$Q(s,a)\ \leftarrow\
  Q(s,a)+\alpha\Big[\underbrace{r+\gamma\max_{a'}Q(s',a')}_{\text{target}}-Q(s,a)\Big].$$<p
    >The <b>target</b> is a better guess of what \(Q(s,a)\) should be, made one step later: the
    reward that actually arrived plus the best value the table currently offers from the new square.
    The bracket is the <b>temporal-difference error</b>: how much better or worse things turned out
    than the table said. The learning rate \(\alpha\) decides how far to move: with \(\alpha=1\) the
    old value is thrown away, with \(\alpha=0.1\) it moves a tenth of the way. If \(s'\) ends the
    episode there is no future, and the target is \(r\) alone. The panel under the pictures writes
    these lines out with the numbers of the step just taken (Watkins, 1989).</p
  >
  <h4>A worked example</h4
  ><p
    >In the hallway with \(\alpha=0.5\) and \(\gamma=0.9\), suppose the robot stands on the square
    next to the goal, with the whole table at zero, and steps right. It reaches the goal and
    receives \(+10\). The goal ends the episode, so</p
  >$$Q(\text{A4},\rightarrow)\leftarrow0+0.5\,[\,10-0\,]=5 .$$<p
    >In a later episode it steps right from A3 into A4, with reward \(-1\). The best value now on
    offer in A4 is 5, so</p
  >$$Q(\text{A3},\rightarrow)\leftarrow0+0.5\,[\,-1+0.9\times5-0\,]=1.75 .$$<p
    >The reward at the goal has reached a square from which the goal cannot be seen. After enough
    visits the values settle at \(10\), \(8\), \(6.2\), \(4.58\) going back from the goal: each is
    \(-1+0.9\times\) the one in front of it.</p
  >
  <h4>Explore or exploit</h4
  ><p
    >Always taking the move that looks best is called exploiting. A robot that only exploits never
    tries the moves it wrongly believes are bad, so it can settle on a poor route for ever. With
    <b>ε-greedy</b> behaviour it makes a random move with probability \(\varepsilon\) and the
    best-looking move otherwise. Every entry of the table then keeps being tested.</p
  >
  <h4>Why it learns the best behaviour while behaving imperfectly</h4
  ><p
    >The target uses \(\max_{a'}Q(s',a')\), the value of the best next move, whatever move the robot
    actually makes next. So the table describes the best possible behaviour even while the robot is
    stumbling around at random one step in five. This is called <b>off-policy</b> learning, and it
    is the difference from SARSA in the next tab. Provided every square and move keeps being visited
    and \(\alpha\) is reduced gradually, the table is guaranteed to converge to \(Q^\star\).</p
  >
  <h4>The three settings</h4
  ><p
    ><b>\(\alpha\)</b>: large values learn fast and are thrown about by luck when the floor is
    slippery. Small values are steady and slow. <b>\(\gamma\)</b>: at 0 only the immediate reward
    counts, and since every ordinary step pays \(-1\), the robot cannot tell a step toward the goal
    from a step away. Near 1, distant rewards count almost fully. <b>\(\varepsilon\)</b>: at 0
    nothing is explored. At 1 the robot moves at random, which still fills in the table correctly
    but collects very little reward on the way.</p
  >
  <h4>How this page decides it has finished</h4
  ><p
    >The true values are known here, because the page also solves the world exactly with the method
    of the Value and Policy Iteration tab. They are used only to draw the right-hand chart. Learning
    stops when no entry has changed by more than 0.01 during 25 episodes in a row, or after 400
    episodes. On the slippery floor with a fixed \(\alpha\) the entries never stop jiggling, so the
    limit is what ends the run.</p
  >
  <h4>Where the table stops being enough</h4
  ><p
    >A table needs one row for every situation. A 3 by 4 room has 11. Chess has more positions than
    there are atoms in the Earth. For such problems the table is replaced by a neural network that
    takes the situation as input and outputs the values of the moves, trained on the same target.
    That is the deep Q-network in the last tab of this module.</p
  ></template
>

<template data-part="question"
  >After the very first episode in The Room with a Pit, almost every entry the robot touched is
  negative, even on squares that lie on the best route. Why, and why does that not ruin the
  learning?</template
>

<template data-part="answer"
  >During the first episode nothing in the table knows about the goal yet, so every ordinary step is
  updated toward a target of −1 plus γ times zero. The squares along the route are therefore marked
  as slightly bad. Only the very last step, into the goal, gets a positive value. In later episodes
  that positive value is passed back one square per visit, and it soon outweighs the small negative
  numbers. The early negative values even help: they make squares the robot has already tried look
  slightly worse than squares it has not, which pushes it to try new moves.</template
>
