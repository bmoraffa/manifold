<template data-part="intro"
  ><p
    >Two apprentices learn to carry trays through a crowded kitchen. Both are clumsy: one step in
    ten goes somewhere they did not intend. The first reasons, "the best route is the short one past
    the hot stove, and that is what I will learn", and gives no thought to its own clumsiness. The
    second reasons, "given how I actually walk, how do routes work out for me?", and finds that the
    route past the stove regularly ends in a burn. It learns to go the long way round. The first has
    learned the route that is best for a waiter who never stumbles. The second has learned the route
    that is best for the waiter it currently is.</p
  >
</template>

<template data-part="math"
  ><h4>The two updates</h4
  ><p
    >After the step \(s,a\to r,s'\), Q-learning uses the best next move in its target, and SARSA
    uses the next move \(a'\) that it has actually chosen:</p
  >$$\text{Q-learning:}\quad Q(s,a)\leftarrow
  Q(s,a)+\alpha\big[r+\gamma\max_{a'}Q(s',a')-Q(s,a)\big]$$$$\text{SARSA:}\quad Q(s,a)\leftarrow
  Q(s,a)+\alpha\big[r+\gamma\,Q(s',a')-Q(s,a)\big].$$<p
    >The name SARSA spells out what one update needs: \(s,a,r,s',a'\). When the next move is the
    best-looking one, the two targets are identical. They differ only when the next move is an
    exploratory one, which happens with probability \(\varepsilon\).</p
  >
  <h4>On-policy and off-policy</h4
  ><p
    >SARSA's table answers the question "how good is this move, given that I will go on behaving as
    I do now, random moves included?" It evaluates the policy it is following, so it is called
    <b>on-policy</b>. Q-learning's table answers "how good is this move, given that I behave
    perfectly from the next step on?" It learns about a policy it is not following, so it is
    <b>off-policy</b>.</p
  >
  <h4>Why the cliff separates them</h4
  ><p
    >On a square at the cliff edge, a random move has a one in four chance of stepping off, at a
    cost of 100. SARSA's targets include those accidents, so the values of edge squares are dragged
    down and the route moves away from the edge. Q-learning's targets ignore them, because the best
    move from an edge square is never to jump. Its table is right about the shortest path. But while
    it learns, it still explores, walks along the edge, and falls. That is why its reward during
    learning is lower although its route is better.</p
  >
  <h4>Which is right?</h4
  ><p
    >If learning happens in a simulator and only the final behaviour is used, with exploration
    switched off, Q-learning's route is the one you want. If mistakes during learning cost something
    real, as for a robot that can break or a system that serves customers while it learns, SARSA's
    caution is worth having. As \(\varepsilon\to0\) the accidents disappear and the two learn the
    same thing: try it.</p
  >
  <h4>What this page runs</h4
  ><p
    >The cliff walk of Sutton and Barto, here 4 squares high and 10 wide. Every step costs 1, the
    cliff costs 100 and returns the robot to the start, and the goal ends the episode. There is no
    discounting, \(\gamma=1\). Both robots run for 500 episodes. The reward curve shows the average
    of the last 20 episodes, since single episodes swing wildly whenever a robot falls.</p
  ></template
>

<template data-part="question"
  >With ε = 0.1, Q-learning’s recommended route is 11 steps and SARSA’s is longer. A classmate says
  SARSA has “learned the wrong answer”. In what sense is SARSA’s answer correct?</template
>

<template data-part="answer"
  >SARSA has learned the true values of moves for a robot that keeps making a random move one time
  in ten. For that robot, walking along the edge really is worse, because the expected cost of falls
  outweighs the steps saved. SARSA’s route is the best one available to the robot as it actually
  behaves. Q-learning’s route is the best one for a robot that will stop exploring. Neither is
  wrong. They answer different questions, and the right one to ask depends on whether the exploring
  will ever be switched off.</template
>
