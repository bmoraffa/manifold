<template data-part="lede"
  >Start with a rule so simple it is barely better than a coin toss: one straight cut. See which
  points it gets wrong, make those points heavier, and fit the next cut to the reweighted data. Add
  the cuts together, each with a vote in proportion to its accuracy.</template
>

<template data-part="intro"
  ><p
    >A student revising for an exam does not reread the whole book each evening. They work through
    practice questions, mark the ones they got wrong, and spend the next session on those. Boosting
    trains a sequence of simple models the same way: each new one concentrates on the examples its
    predecessors found hard. Individually each model is weak. Together, weighted by how reliable
    each proved to be, they are strong. Bagging built its trees independently and in parallel;
    boosting builds them one after another, each depending on the last.</p
  >
</template>

<template data-part="steps"
  ><li>Give every training point the same weight.</li
  ><li>Fit a weak learner (one cut) to the weighted points.</li
  ><li>Add up the weight of the points it gets wrong: its weighted error ε.</li
  ><li>Give it a vote α = ½ ln((1 − ε)/ε). Small error, big vote.</li
  ><li
    >Multiply the weight of each point it got wrong by e^α and each it got right by e^−α. Go back to
    step 2.</li
  ></template
>

<template data-part="math"
  ><h4>The algorithm</h4
  ><p>Labels \(y_i=\pm1\). Start with weights \(w_i=1/n\). For \(m=1,\dots,M\):</p
  >$$\varepsilon_m=\sum_{i}w_i\,\mathbb 1\big[h_m(\mathbf x_i)\ne y_i\big],\qquad
  \alpha_m=\tfrac12\ln\frac{1-\varepsilon_m}{\varepsilon_m}$$$$w_i\leftarrow\frac{w_i\,\exp\!\big(-\alpha_m\,y_i\,h_m(\mathbf
  x_i)\big)}{Z_m}$$<p
    >where \(h_m\) is the weak learner fitted to the weighted data and \(Z_m\) rescales the weights
    to sum to 1. The final classifier is a weighted vote:</p
  >$$F(\mathbf x)=\sum_{m=1}^{M}\alpha_m\,h_m(\mathbf x),\qquad \hat y=\operatorname{sign}F(\mathbf
  x).$$ <h4>Reading the formulas</h4
  ><p
    >\(\alpha_m\) is zero when \(\varepsilon_m=\tfrac12\) (a coin toss earns no vote) and grows as
    the error shrinks. The update multiplies the weight of a misclassified point by \(e^{\alpha_m}\)
    and of a correct one by \(e^{-\alpha_m}\). After the update, the learner just fitted has
    weighted error exactly \(\tfrac12\) on the new weights: the next learner is forced to find
    something different.</p
  >
  <h4>Why it works</h4
  ><p>AdaBoost is gradient descent, one learner at a time, on the exponential loss</p
  >$$L=\sum_i\exp\!\big(-y_i\,F(\mathbf x_i)\big).$$<p
    >If every weak learner has error at most \(\tfrac12-\gamma\), the training error falls at least
    as fast as \(e^{-2\gamma^2M}\): exponentially. Each stump has high bias; adding them removes
    bias. Boosting attacks bias, where bagging attacked variance.</p
  >
  <h4>Its weakness</h4
  ><p
    >The exponential loss punishes a badly misclassified point without limit. A mislabelled point
    gets heavier every round until the whole ensemble bends to accommodate it. AdaBoost is sensitive
    to label noise and outliers; gradient boosting with a gentler loss is the usual remedy.</p
  ></template
>

<template data-part="question"
  >A weak learner has weighted error 0.7, worse than chance. What does AdaBoost do with
  it?</template
>

<template data-part="answer"
  >Its vote weight α = ½ ln(0.3 / 0.7) is negative. AdaBoost uses it upside down: a rule that is
  wrong 70% of the time is right 70% of the time when reversed. Only an error of exactly one half is
  useless.</template
>
