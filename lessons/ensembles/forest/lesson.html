<template data-part="lede"
  >Bagged trees are too alike: they all reach for the same strong feature first, so they make the
  same mistakes. A random forest hides some of the features at every split. Each tree gets a little
  worse, the trees get much more different, and the vote gets better.</template
>

<template data-part="intro"
  ><p
    >A committee of experts who all read the same newspaper is barely better than one expert: they
    share the same blind spots. A committee is strong when its members are individually competent
    <em>and</em> think differently. Bagging makes trees differ only through resampling, and if one
    feature is much more useful than the rest, every tree splits on it first and the trees end up
    alike. The random forest forces variety: at each split a tree may only choose among a random
    handful of features.</p
  >
</template>

<template data-part="steps"
  ><li
    >Draw a new training set of the same size by picking points at random with replacement. About a

  ><li>Grow a deep tree on it. At every split, look at only a random subset of the features.</li
  ><li>Repeat to get many different trees.</li
  ><li>To predict, let every tree vote and take the average.</li
  ><li

<template data-part="math"
  ><h4>The one change</h4
  ><p
    >Grow each tree on a bootstrap resample, as in bagging. But at <em>every split</em>, draw \(m\)
    of the \(p\) features at random and choose the best split among those \(m\) only. Typical
    choices are \(m\approx\sqrt p\) for classification and \(m\approx p/3\) for regression. With
    \(m=p\) it is bagging again. (Here \(p=2\), so the only choices are 1 and 2; with real data and
    dozens of features the effect is far stronger.)</p
  >
  <h4>Why it works</h4>$$\operatorname{Var}\big(\text{average of }B\text{
  trees}\big)=\rho\,\sigma^2+\frac{1-\rho}{B}\,\sigma^2$$<p
    >For large \(B\) only \(\rho\sigma^2\) is left. Restricting the features makes each tree
    slightly worse, so \(\sigma^2\) and the bias rise a little, but it cuts the correlation \(\rho\)
    between trees sharply, and the product falls. The readout "how often two trees agree" tracks
    \(\rho\).</p
  >
  <h4>Feature importance</h4
  ><p
    >Each split lowers the impurity. Add up those reductions over every split in every tree, grouped
    by the feature that was used:</p
  >$$\text{importance}(j)=\sum_{\text{trees}}\ \sum_{\text{splits on
  }j}\frac{n_{\text{node}}}{n}\,\Delta I.$$<p
    >It ranks the features by how much sorting each one did. A second method shuffles one feature's
    values in the out-of-bag points and measures how much the accuracy drops.</p
  >
  <h4>In practice</h4
  ><p
    >Random forests need almost no tuning, do not need feature scaling, cope with many features,
    give out-of-bag error and importances for free, and rarely do badly. They are the standard first
    thing to try on tabular data. What they give up is the readability of a single tree.</p
  ></template
>

<template data-part="question"
  >Why does deliberately making each tree worse make the forest better?</template
>

<template data-part="answer"
  >The forest’s error depends on how good the trees are and on how correlated they are. Hiding
  features costs each tree a little accuracy but makes the trees far less alike. Once many trees are
  averaged, the shared, correlated part of the error is all that remains, so reducing the
  correlation matters more than the small loss in each tree.</template
>
