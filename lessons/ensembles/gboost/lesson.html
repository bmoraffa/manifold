<template data-part="lede"
  >Start with the simplest prediction there is, the average. Look at the errors it leaves. Fit a
  small tree to those errors and add a fraction of it to the prediction. Look at the errors that
  remain, and repeat. Hundreds of small corrections add up to a flexible curve.</template
>

<template data-part="intro"
  ><p
    >A golfer does not expect to sink the ball from the tee. The first shot gets it roughly toward
    the green. The second is aimed at what the first left: the remaining distance to the hole. Each
    later shot is smaller and corrects the leftover error of all the shots before. Gradient boosting
    plays the same way. No single tree is asked to model the data. Each is asked only to model what
    the ensemble so far has got wrong.</p
  >
</template>

<template data-part="math"
  ><h4>The algorithm for squared error</h4>$$F_0(x)=\bar y,\qquad r_i^{(m)}=y_i-F_{m-1}(x_i),\qquad
  F_m(x)=F_{m-1}(x)+\nu\,h_m(x)$$<p
    >where \(h_m\) is a small regression tree fitted to the residuals \(r^{(m)}\), and
    \(\nu\in(0,1]\) is the learning rate. The final model is the sum of all the trees.</p
  >
  <h4>Why "gradient"</h4
  ><p
    >Think of the predictions \(F(x_1),\dots,F(x_n)\) as \(n\) adjustable numbers and the loss
    \(L=\tfrac12\sum_i(y_i-F(x_i))^2\) as a function of them. Its gradient with respect to
    \(F(x_i)\) is</p
  >$$\frac{\partial L}{\partial F(x_i)}=-(y_i-F(x_i))=-r_i.$$<p
    >The residuals are the negative gradient. Adding a tree fitted to the residuals is one step of
    gradient descent, taken in the space of functions instead of the space of weights, with \(\nu\)
    as the step size. For any other differentiable loss, replace the residuals with that loss's
    negative gradient (the "pseudo-residuals") and everything else stays the same: log loss gives
    classification, absolute or Huber loss gives robustness to outliers. This generality is what
    separates gradient boosting from AdaBoost, which is the special case of exponential loss.</p
  >
  <h4>The three dials</h4
  ><p
    ><b>Learning rate \(\nu\).</b> Small steps mean each tree corrects only part of the error,
    leaving room for later trees to correct it differently. Smaller \(\nu\) needs more rounds and
    almost always generalises better. <b>Number of rounds.</b> Unlike bagging, boosting does overfit
    eventually: training error keeps falling toward zero while test error turns back up. Stop at the
    minimum of the validation error (early stopping). <b>Tree depth.</b> Depth 1 gives an additive
    model with no interactions; depth \(d\) allows interactions among up to \(d\) features. Depths
    of 3 to 6 are usual.</p
  >
  <h4>In practice</h4
  ><p
    >With subsampling of rows and columns and a penalty on leaf values, this is XGBoost, LightGBM
    and CatBoost: the strongest general-purpose methods for tabular data.</p
  ></template
>

<template data-part="question"
  >Halving the learning rate roughly doubles the number of rounds needed. Why bother?</template
>

<template data-part="answer"
  >With a large learning rate each tree commits fully to the residual pattern it happens to see,
  noise included. With a small one, each tree makes a cautious correction and hundreds of slightly
  different trees average out their individual quirks. The path to the answer is smoother and the
  test error at the best round is usually lower.</template
>
