<template data-part="lede"
  >With several inputs, give each its own smooth curve and add them up. The curves are found by
  taking turns: hold one fixed, smooth what is left over against the other, and repeat. Watch the
  two curves settle.</template
>

<template data-part="intro"
  ><p
    >Splines and local regression bend a curve in one input. With many inputs, fitting a fully
    flexible surface needs an enormous amount of data, because the points thin out fast as
    dimensions are added. An additive model takes a middle road: each input gets its own free-form
    curve, but the curves only ever add. You lose interactions between inputs, and in exchange you
    get a model that needs far less data and can be read one picture at a time.</p
  >
</template>

<template data-part="tryit"
  >Press “Start over” and take one turn at a time. After the first turn f₁ is rough because f₂ is
  still flat. How many turns until nothing changes? Then choose the product x₁ × x₂ and see what an
  additive model cannot do.</template
>

<template data-part="math"
  ><h4>The model</h4>$$y=\alpha+f_1(x_1)+f_2(x_2)+\dots+f_p(x_p)+\varepsilon$$<p
    >Linear regression is the special case \(f_j(x_j)=\beta_jx_j\). Each \(f_j\) here is a natural
    cubic spline, though any smoother from the previous lessons would do. Since a constant can be
    moved between the curves freely, each \(f_j\) is centred to average zero and the level is
    carried by \(\alpha=\bar y\).</p
  >
  <h4>Backfitting</h4
  ><p
    >If \(f_2\) were known, finding \(f_1\) would be a one-dimensional smoothing problem: subtract
    what \(f_2\) explains and smooth the remainder against \(x_1\). Neither is known, so take
    turns:</p
  >$$r_{i}^{(1)}=y_i-\alpha-f_2(x_{i2}),\qquad f_1\leftarrow\operatorname{smooth}\big(r^{(1)}\
  \text{against}\ x_1\big)$$$$r_{i}^{(2)}=y_i-\alpha-f_1(x_{i1}),\qquad
  f_2\leftarrow\operatorname{smooth}\big(r^{(2)}\ \text{against}\ x_2\big)$$<p
    >and repeat until the curves stop moving. The dots in each picture are these
    <b>partial residuals</b>: the part of \(y\) not yet explained by the other input. This is
    coordinate descent, the same idea used for the lasso, with whole functions in place of single
    coefficients.</p
  >
  <h4>Why it takes several turns</h4
  ><p
    >If the inputs are unrelated, one turn each is nearly enough. When they are correlated, part of
    the effect of \(x_2\) leaks into \(f_1\) on the first turn and has to be handed back on later
    turns. Raise the correlation and count the turns.</p
  >
  <h4>What it cannot do</h4
  ><p
    >A product such as \(y=x_1x_2\) has no additive part at all: averaged over \(x_2\), the effect
    of \(x_1\) is zero. The curves come out flat and the error stays high. Interactions must be
    added by hand as extra terms \(f_{12}(x_1,x_2)\), or left to models that find them on their own,
    such as trees and neural networks.</p
  ></template
>

<template data-part="question"
  >An additive model fits well and f₁ is a clear U shape. What can you say that you could not say
  from a neural network with the same accuracy?</template
>

<template data-part="answer"
  >You can state the effect of x₁ directly: holding the other inputs fixed, the prediction falls and
  then rises as x₁ increases, by the amounts shown on the curve. That reading is exact for an
  additive model. A neural network has no such single curve, because the effect of x₁ may differ for
  every value of the other inputs.</template
>
