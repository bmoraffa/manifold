<template data-part="lede"
  >No formula for the whole curve. To predict at one spot, look only at the points near it and
  weight them by closeness. Slide the spot along and the predictions trace out a curve. The
  bandwidth decides who counts as a neighbour.</template
>

<template data-part="intro"
  ><p
    >Every method so far chose a shape in advance, a line or a polynomial, and then fitted it. Here
    the data chooses the shape. To predict at \(x_0\), ask the training points nearby what their
    \(y\) values were and average them, listening more to the closest ones. There are no
    coefficients to learn: the training data itself is the model.</p
  >
</template>

<template data-part="math"
  ><h4>Kernel regression (Nadaraya–Watson)</h4>$$\hat
  f(x_0)=\frac{\sum_{i}K\!\big(\tfrac{x_i-x_0}{h}\big)\,y_i}{\sum_{i}K\!\big(\tfrac{x_i-x_0}{h}\big)}$$<p
    >\(K\) is a bump centred at zero, drawn along the bottom of the picture; each point's weight is
    the height of the bump above it. Common choices are the Gaussian \(K(u)=e^{-u^2/2}\), the
    Epanechnikov dome \(K(u)=\max(1-u^2,0)\) and the box \(K(u)=\mathbb 1[|u|\le1]\). The kernel
    matters little. The bandwidth \(h\) matters a great deal.</p
  >
  <h4>Bandwidth is the bias–variance dial</h4
  ><p
    >A small \(h\) uses few neighbours: the estimate follows the data closely (low bias) but is
    noisy (high variance). A large \(h\) averages over many points: steady, but it flattens real
    bumps (high bias). In the limit \(h\to\infty\) every prediction is the overall mean. Roughly,
    variance scales like \(1/(nh)\) and squared bias like \(h^4\), so the best \(h\) shrinks slowly
    as data grows.</p
  >
  <h4>Local linear regression (LOESS)</h4
  >$$\big(\hat\beta_0,\hat\beta_1\big)=\arg\min_{\beta_0,\beta_1}\sum_iK\!\big(\tfrac{x_i-x_0}{h}\big)\big(y_i-\beta_0-\beta_1(x_i-x_0)\big)^2,\qquad
  \hat f(x_0)=\hat\beta_0$$<p
    >Fit a small weighted line near \(x_0\) and read off its height there. A weighted average is
    biased wherever the neighbours are lopsided, which always happens at the ends of the data, where
    all neighbours lie on one side. A local line corrects for the slope and removes that bias.</p
  >
  <h4>Choosing h without a test set</h4>$$\mathrm{CV}(h)=\frac1n\sum_{i=1}^n\big(y_i-\hat
  f_{-i}(x_i)\big)^2$$<p
    >Predict each point from all the <em>other</em> points and average the squared misses. Training
    error is useless for this choice, because it falls to zero as \(h\to0\) when each point simply
    predicts itself. Leave-one-out error has a real minimum, shown on the right.</p
  >
  <h4>Where this leads</h4
  ><p
    >The same weights \(K\) reappear as the kernel in kernel ridge regression, Gaussian processes
    and support vector machines, and the weighted average is the ancestor of attention in
    transformers, where the weights are learned.</p
  ></template
>

<template data-part="question"
  >Why does training error go to zero as the bandwidth shrinks?</template
>

<template data-part="answer"
  >With a tiny bandwidth the only point with any weight near xᵢ is the point itself, so the
  prediction there is exactly yᵢ. That is memorising, and it says nothing about how the method does
  on new points. Leave-one-out error removes each point before predicting it, so it cannot cheat
  this way.</template
>
