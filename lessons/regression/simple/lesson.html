<template data-part="lede"
  >Every possible line has a score: the average squared miss. Gradient descent walks downhill on
  that score until the line fits. Drag any point, or click the loss map to start from a different
  line.</template
>

<template data-part="intro"
  ><p
    >A line is two numbers, an intercept and a slope. For any choice of the two, measure how far
    each point is above or below the line, square those misses and average them. That average is a
    single number, the loss, and it is small only when the line passes close to the points. The
    right-hand picture shows the loss for every line at once: it is a bowl, and fitting means
    finding its lowest point.</p
  >
</template>

<template data-part="tryit"
  >Raise the learning rate to 0.4 and run again: what happens to the path on the loss map? Then set

<template data-part="math"
  ><h4>The model and the loss</h4>$$\hat y_i=\beta_0+\beta_1x_i,\qquad
  L(\beta_0,\beta_1)=\frac1n\sum_{i=1}^n\big(y_i-\beta_0-\beta_1x_i\big)^2$$<p
    >Squaring makes the loss smooth, punishes large misses much more than small ones, and gives a
    bowl with exactly one minimum. The contours of the bowl are ellipses, the same shape as the
    Gaussian contours, and that is no accident: least squares is maximum likelihood when the noise
    is Gaussian.</p
  >
  <h4>Gradient descent</h4>$$\frac{\partial L}{\partial\beta_0}=-\frac2n\sum_i r_i,\qquad
  \frac{\partial L}{\partial\beta_1}=-\frac2n\sum_i r_i\,x_i,\qquad
  \boldsymbol\beta\leftarrow\boldsymbol\beta-\eta\,\nabla L$$<p
    >where \(r_i=y_i-\hat y_i\) is the residual. The gradient points uphill, so each step goes the
    other way, with length set by the learning rate \(\eta\). Too small and it crawls. Too large and
    each step overshoots the valley and the loss grows: the path zig-zags and flies off the map.</p
  >
  <h4>The exact answer</h4
  ><p>Setting both derivatives to zero gives the minimum in closed form:</p
  >$$\hat\beta_1=\frac{\sum_i(x_i-\bar x)(y_i-\bar y)}{\sum_i(x_i-\bar
  x)^2}=\rho\,\frac{\sigma_y}{\sigma_x},\qquad \hat\beta_0=\bar y-\hat\beta_1\bar x.$$<p
    >The slope is the one you met in the Gaussian module when slicing the hill.</p
  >
  <h4>How good is the fit</h4>$$R^2=1-\frac{\sum_i r_i^2}{\sum_i(y_i-\bar y)^2}$$<p
    >the share of the variance of \(y\) that the line explains. Test error is the same loss measured
    on points the fit never saw.</p
  >
  <h4>Is the slope real?</h4
  ><p
    >A different sample would give a different slope. Its standard error estimates how much it would
    wobble:</p
  >$$\operatorname{SE}(\hat\beta_1)=\sqrt{\frac{s^2}{\sum_i(x_i-\bar x)^2}},\qquad s^2=\frac{\sum_i
  r_i^2}{n-2},\qquad t=\frac{\hat\beta_1}{\operatorname{SE}(\hat\beta_1)}\sim t_{n-2}\ \text{ if the
  true slope is }0.$$<p
    >The p-value is the chance of a \(|t|\) this large when there is no relationship at all. The 95%
    interval is \(\hat\beta_1\pm t^{*}_{n-2}\operatorname{SE}\). More points, less noise, or a wider
    spread of \(x\) all shrink it.</p
  >
  <p
    >An uploaded CSV uses its first two numeric columns, rescaled to fit the plot. \(R^2\), \(t\)
    and the p-value are unaffected by the rescaling.</p
  ></template
>

<template data-part="question">The p-value is 0.30. Does that prove x has no effect on y?</template>

<template data-part="answer"
  >No. It means this sample cannot tell a slope of that size apart from zero. The interval for the
  slope will be wide and include both zero and values far from it. More data or less noise might
  reveal an effect.</template
>
