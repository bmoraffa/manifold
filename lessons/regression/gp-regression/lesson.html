<template data-part="lede"
  >Most regression methods give you one curve. A Gaussian process gives you every curve that is
  consistent with the data, weighted by how plausible it is, and so it can tell you where it is sure
  and where it is guessing. Click to add measurements and watch the possible curves pinch together
  around each one and fan out in the gaps.</template
>

<template data-part="intro"
  ><p
    >Imagine every smooth curve you could possibly draw across the picture, all at once, like a
    thick bundle of threads. That bundle is your belief before you have seen anything. Now someone
    tells you the curve passes close to a particular dot. Throw away every thread that misses the
    dot. What is left is still a bundle, but pinched at that place. Near the dot the remaining
    threads agree, so you are confident. Far from any dot they still spread out, so you are not. A
    Gaussian process does this with mathematics instead of scissors, and the average of the
    surviving threads is its prediction.</p
  >
</template>

<template data-part="math"
  ><h4>The model</h4
  ><p
    >A Gaussian process is a distribution over functions such that the heights at any finite set of
    places are jointly Gaussian. It is fixed by a mean function, taken as zero here, and a
    <b>kernel</b> \(k(x,x')\) giving the covariance of the heights at \(x\) and \(x'\):</p
  >$$f\sim\mathcal{GP}(0,k),\qquad y_i=f(x_i)+\varepsilon_i,\quad\varepsilon_i\sim\mathcal
  N(0,\sigma_n^2).$$
  <h4>Kernels on this page</h4
  >$$k_{\text{smooth}}=\sigma_f^2\exp\!\Big(-\frac{r^2}{2\ell^2}\Big),\qquad
  k_{\text{rough}}=\sigma_f^2\Big(1+\frac{\sqrt3\,r}{\ell}\Big)\exp\!\Big(-\frac{\sqrt3\,r}{\ell}\Big),$$$$k_{\text{repeating}}=\sigma_f^2\exp\!\Big(-\frac{2\sin^2(\pi
  r/p)}{\ell^2}\Big),\qquad k_{\text{straight}}=\sigma_f^2\,(1+x\,x'),$$<p
    >with \(r=|x-x'|\) and period \(p=3\). The smooth one is the squared-exponential (RBF) kernel,
    the rough one is Matérn 3/2. The straight kernel turns the Gaussian process into Bayesian linear
    regression. The <b>length scale</b> \(\ell\) says how far you must move before the curve can
    change much.</p
  >
  <h4>The prediction</h4
  ><p
    >Let \(\mathbf K\) be the kernel between all pairs of measured places, \(\mathbf k_*\) the
    kernel between a new place \(x_*\) and the measured ones. Conditioning a joint Gaussian gives</p
  >$$\mu_*=\mathbf k_*^{\top}(\mathbf K+\sigma_n^2\mathbf I)^{-1}\mathbf
  y,\qquad\sigma_*^2=k(x_*,x_*)-\mathbf k_*^{\top}(\mathbf K+\sigma_n^2\mathbf I)^{-1}\mathbf
  k_*.$$<p
    >The mean is a weighted sum of the measurements. The variance starts at the prior value and has
    something subtracted for what the data told you. It does not depend on the measured heights at
    all, only on where you measured.</p
  >
  <h4>Choosing the settings</h4
  ><p>The probability of the data with the function integrated out is available in closed form:</p
  >$$\log p(\mathbf y)=\underbrace{-\tfrac12\mathbf y^{\top}(\mathbf K+\sigma_n^2\mathbf
  I)^{-1}\mathbf y}_{\text{data fit}}\ \underbrace{-\tfrac12\log\lvert\mathbf K+\sigma_n^2\mathbf
  I\rvert}_{\text{complexity penalty}}-\frac n2\log2\pi.$$<p
    >A tiny length scale fits anything and pays a heavy complexity penalty. A huge one is cheap and
    fits badly. Maximizing the sum balances the two without a validation set. The score can have
    several peaks: one explanation with a short length scale and little noise, another with a long
    length scale and more noise. So the Fit button first compares 36 settings on a coarse grid and
    moves to the best of them if it clearly beats the current one, then climbs by gradient ascent on
    \(\log\ell,\log\sigma_f,\log\sigma_n\), and stops when it gains less than 0.0005 in a step.</p
  >
  <h4>Cost</h4
  ><p
    >Everything needs the inverse of an \(n\times n\) matrix, which costs \(O(n^3)\). That is the
    practical limit of exact Gaussian processes: superb with a few thousand points, and in need of
    approximations beyond that.</p
  ></template
>

<template data-part="question"
  >In A Gap in the Middle the band is wide inside the gap. Would taking ten more measurements at the
  far left, where there are already several, narrow it?</template
>

<template data-part="answer"
  >Hardly at all. The predictive variance at a place depends only on how strongly the kernel ties
  that place to the measured ones. With a length scale of about 1, points at the far left are almost
  uncorrelated with the middle, so they subtract almost nothing from the variance there. To narrow
  the band in the gap you have to measure in the gap, or believe in a longer length scale or a
  repeating pattern that links the gap to the data you have.</template
>
