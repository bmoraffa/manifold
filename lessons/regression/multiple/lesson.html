<template data-part="lede"
  >With two inputs the line becomes a plane. Rotate it and watch it tilt into place. Then make the
  two inputs correlated and see the estimates lose their footing.</template
>

<template data-part="intro"
  ><p
    >Each input gets its own slope, and each slope answers a specific question: if this input goes
    up by one <em>while the other stays fixed</em>, how much does the prediction change? When the
    two inputs always move together, the data never shows one changing without the other, so it
    cannot say how to split the credit. The plane is still well pinned down above the data, but it
    can pivot freely about the line where the data lies.</p
  >
</template>

<template data-part="tryit"
  >Slide the correlation between the inputs from 0 to 0.95. The plane hardly changes, but watch the
  cloud of estimates on the right. Which combinations of the two slopes can the data no longer tell
  apart?</template
>

<template data-part="math"
  ><h4>The model</h4>$$\hat y=\beta_0+\beta_1x_1+\beta_2x_2\qquad\text{or, stacking all
  points,}\qquad \hat{\mathbf y}=X\boldsymbol\beta$$<p
    >where each row of \(X\) is \((1,x_{i1},x_{i2})\).</p
  >
  <h4>The normal equations</h4>$$L(\boldsymbol\beta)=\frac1n\lVert\mathbf
  y-X\boldsymbol\beta\rVert^2,\qquad \nabla L=0\ \Longrightarrow\
  X^{\top}X\,\hat{\boldsymbol\beta}=X^{\top}\mathbf y,\qquad
  \hat{\boldsymbol\beta}=(X^{\top}X)^{-1}X^{\top}\mathbf y.$$<p
    >Geometrically, \(X\hat{\boldsymbol\beta}\) is the projection of \(\mathbf y\) onto the space
    spanned by the columns of \(X\); the residual vector is perpendicular to every column.</p
  >
  <h4>How much the estimates wobble</h4
  >$$\operatorname{Cov}(\hat{\boldsymbol\beta})=\sigma^2\,(X^{\top}X)^{-1}$$<p
    >The right-hand cloud is this covariance, drawn by refitting on fresh noise. With uncorrelated
    inputs it is round. As the correlation \(r\) between \(x_1\) and \(x_2\) grows, \(X^{\top}X\)
    becomes nearly singular and the cloud stretches into a long thin ellipse:
    \(\hat\beta_1+\hat\beta_2\) is still known well, \(\hat\beta_1-\hat\beta_2\) is not. The
    variance of each slope is multiplied by</p
  >$$\mathrm{VIF}=\frac{1}{1-r^2}.$$
  <h4>Does the model explain anything?</h4>$$R^2=1-\frac{\mathrm{RSS}}{\mathrm{TSS}},\qquad \bar
  R^2=1-(1-R^2)\frac{n-1}{n-p-1},\qquad
  F=\frac{(\mathrm{TSS}-\mathrm{RSS})/p}{\mathrm{RSS}/(n-p-1)}\sim F_{p,\,n-p-1}$$<p
    >with \(p=2\) inputs. \(R^2\) never goes down when you add an input, even a useless one; the
    adjusted version charges for each extra input. The F test asks whether all slopes could be zero
    at once. Note that with strongly correlated inputs the F test can be decisive while neither
    slope is individually significant.</p
  ></template
>

<template data-part="question"
  >With correlation 0.95 the fitted plane still predicts well. So why does multicollinearity
  matter?</template
>

<template data-part="answer"
  >It matters when you interpret the slopes or predict away from the data. The individual slopes are
  unreliable and can even flip sign between samples, and predictions for an x₁ and x₂ that do not
  follow the usual pattern can be badly wrong.</template
>
