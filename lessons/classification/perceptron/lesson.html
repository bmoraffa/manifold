<template data-part="lede"
  >Start with any line. Visit the points one at a time. If a point is on the right side, do nothing.
  If it is on the wrong side, swing the line toward it. Repeat. When a straight line can separate
  the classes this always finishes. When none can, it never does.</template
>

<template data-part="intro"
  ><p
    >This is the oldest learning algorithm, from 1958, and the simplest picture of what learning
    from examples means. The model makes a guess. If the guess is right, leave everything alone. If
    it is wrong, nudge the weights so that this example would have come out a little more right.
    That is all. A single artificial neuron with this rule is the ancestor of every neural
    network.</p
  >
</template>

<template data-part="math"
  ><h4>The model</h4>$$\hat y=\operatorname{sign}\big(\mathbf w^{\top}\mathbf x+b\big),\qquad
  y\in\{-1,+1\}$$<p
    >A hard yes or no: which side of the line \(\mathbf w^{\top}\mathbf x+b=0\) the point falls on.
    The vector \(\mathbf w\) points across the line toward the positive side.</p
  >
  <h4>The update</h4
  ><p
    >For each point in turn, if it is misclassified, meaning \(y_i(\mathbf w^{\top}\mathbf
    x_i+b)\le0\):</p
  >$$\mathbf w\leftarrow\mathbf w+\eta\,y_i\,\mathbf x_i,\qquad b\leftarrow b+\eta\,y_i$$<p
    >Adding \(y_i\mathbf x_i\) rotates \(\mathbf w\) toward a positive point or away from a negative
    one. After the update that point's score \(y_i\mathbf w^{\top}\mathbf x_i\) has gone up by
    \(\eta\lVert\mathbf x_i\rVert^2\): it is closer to being right, though not necessarily right
    yet.</p
  >
  <h4>The convergence theorem</h4
  ><p
    >If some line separates the classes with margin \(\gamma\), and all points lie within radius
    \(R\), the perceptron makes at most</p
  >$$\Big(\frac{R}{\gamma}\Big)^2\ \text{ corrections}$$<p
    >and then stops, whatever the order of the points. A wide gap between the classes means few
    mistakes.</p
  >
  <h4>Its limits</h4
  ><p
    >If no separating line exists, the updates never stop: the line keeps swinging as different
    points take turns being wrong. The checkerboard (XOR) is the famous example; the proof in 1969
    that a single perceptron cannot solve it stalled neural network research for a decade, until
    hidden layers were shown to fix it. And when the data is separable, the perceptron stops at the
    first line that works, which may pass very close to some points. Choosing the best such line is
    the idea of the support vector machine.</p
  ></template
>

<template data-part="question"
  >Two runs on the same separable data end with different lines. Is one of them wrong?</template
>

<template data-part="answer"
  >Neither is wrong by the perceptron’s own standard: both separate the training data, and it stops
  as soon as that happens. Which line it reaches depends on the starting weights and the order of
  the points. They may differ in how well they generalise, which is the motivation for maximising
  the margin.</template
>
