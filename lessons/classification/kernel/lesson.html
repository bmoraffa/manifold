<template data-part="math"
  ><h4>Lifting by hand</h4>$$\phi(x_1,x_2)=\big(x_1,\ x_2,\ x_1^2+x_2^2\big)$$<p
    >In the lifted space fit an ordinary linear classifier, a plane \(w_0+w_1x_1+w_2x_2+w_3z=0\).
    Back on the table that plane is the set where \(w_0+w_1x_1+w_2x_2+w_3(x_1^2+x_2^2)=0\): a
    circle. A linear method plus a nonlinear lift gives a nonlinear boundary. For the checkerboard,
    the right lift is \(z=x_1x_2\), positive in two opposite quadrants and negative in the other
    two.</p
  >
  <h4>The problem with lifting by hand</h4
  ><p
    >You have to know which lift to use. You could add every product of features up to some degree,
    but the number of new coordinates explodes: degree 5 on 100 features is nearly a hundred
    million.</p
  >
  <h4>The trick</h4
  ><p
    >Many linear methods (SVMs, ridge regression, PCA) only ever use the data through inner products
    \(\mathbf x_i^{\top}\mathbf x_j\). After lifting they would need \(\phi(\mathbf
    x_i)^{\top}\phi(\mathbf x_j)\). A <b>kernel</b> is a function that returns that number directly
    from the original points, without ever computing \(\phi\):</p
  >$$k(\mathbf a,\mathbf b)=\phi(\mathbf a)^{\top}\phi(\mathbf b)$$$$\text{polynomial: }\ k(\mathbf
  a,\mathbf b)=(1+\mathbf a^{\top}\mathbf b)^p\qquad\qquad \text{RBF: }\ k(\mathbf a,\mathbf
  b)=\exp\!\big(-\gamma\lVert\mathbf a-\mathbf b\rVert^2\big)$$<p
    >The polynomial kernel corresponds to all products of features up to degree \(p\), computed at
    the cost of one inner product. The RBF kernel corresponds to a lift into infinitely many
    dimensions.</p
  >
  <h4>What the model looks like</h4>$$f(\mathbf x)=\sum_{i=1}^n\alpha_i\,k(\mathbf x_i,\mathbf
  x)+b$$<p
    >A weighted sum of bumps, one centred on each training point (for an SVM, only on the support
    vectors). The last option draws this \(f\) as a surface: hills over one class, hollows over the
    other, and the boundary where it crosses zero. \(\gamma\) sets the width of each bump: small
    \(\gamma\) gives broad bumps and a smooth boundary, large \(\gamma\) gives narrow spikes and a
    boundary that wraps each point, which is overfitting.</p
  ></template
>

<template data-part="question"
  >The RBF kernel lifts the data into infinitely many dimensions. Why does that not overfit
  hopelessly?</template
>

<template data-part="answer"
  >Because the fit is regularised. The margin of an SVM, or the penalty in kernel ridge, limits how
  much the function may wiggle regardless of how many dimensions it lives in. The flexibility that
  matters is set by γ and the penalty, not by the dimension of the lifted space.</template
>
