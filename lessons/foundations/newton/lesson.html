<template data-part="lede"
  >Gradient descent knows only which way is down. Newton’s method also measures how the slope is
  changing, fits a bowl to the surface where it stands, and jumps straight to the bottom of that
  bowl. Watch the two race.</template
>

<template data-part="intro"
  ><p
    >Gradient descent takes the same length of step whether the valley floor is one stride away or a
    mile away, because the slope alone cannot tell the difference. Curvature can. If the slope is
    flattening quickly, the bottom is near, so take a short step. If the slope is barely changing,
    the bottom is far, so take a long one. Newton's method rescales the step in every direction by
    the curvature in that direction.</p
  >
</template>

<template data-part="math"
  ><h4>The step</h4
  ><p>Approximate the loss near \(\mathbf w\) by its second-order Taylor expansion, a bowl:</p
  >$$L(\mathbf w+\mathbf d)\approx L(\mathbf w)+\nabla L^{\top}\mathbf d+\tfrac12\,\mathbf
  d^{\top}H\,\mathbf d,\qquad H_{ij}=\frac{\partial^2L}{\partial w_i\,\partial w_j}.$$<p
    >The bottom of that bowl is where its gradient vanishes:</p
  >$$\mathbf d=-H^{-1}\nabla L,\qquad \mathbf w_{t+1}=\mathbf w_t-H^{-1}\nabla L(\mathbf w_t).$$<p
    >Compare with gradient descent: the single number \(\eta\) has been replaced by the matrix
    \(H^{-1}\), a separate, automatically chosen learning rate for every direction.</p
  >
  <h4>What it buys</h4
  ><p
    >If the loss really is a bowl (a quadratic), the approximation is exact and Newton lands on the
    minimum in one step, however stretched the bowl is. Near any minimum it converges quadratically:
    the number of correct digits roughly doubles each step.</p
  >
  <h4>What it costs</h4
  ><p
    >With \(d\) parameters, \(H\) has \(d^2\) entries and inverting it costs about \(d^3\)
    operations. For a network with a million weights that is out of the question. Second, Newton
    seeks any point where the gradient is zero. Where the surface curves downward in some direction,
    \(H\) is not positive definite and the step heads for a saddle or a maximum. Practical methods
    (damped Newton, quasi-Newton such as L-BFGS, and Adam's per-weight scaling) keep the idea of
    rescaling by curvature and avoid both problems.</p
  ></template
>

<template data-part="question"
  >Why is plain Newton’s method not used to train neural networks?</template
>

<template data-part="answer"
  >Two reasons. The Hessian of a network with millions of weights is far too large to store or
  invert. And the loss surfaces of networks are full of saddle points, which Newton is attracted to.
  Methods that approximate curvature cheaply, per weight, are used instead.</template
>
