<template data-part="lede"
  >Every prediction error is made of three parts. Bias: the model is too stiff to follow the truth.
  Variance: the model is so flexible that it changes with every new batch of data. Noise: the world
  itself is not perfectly predictable, and no model can remove that part. Making a model more
  flexible trades the first for the second. The third stays put.</template
>

<template data-part="intro"
  ><p
    >Picture an archer shooting many arrows at a target. If the arrows land in a tight group but off
    to one side, the archer has <b>bias</b>: a consistent error that more arrows will not fix. If
    they are centred on the bullseye but spread wide, that is <b>variance</b>: each shot depends too
    much on the moment. Now put the target on a boat that rocks. Even a perfect archer misses a
    little, because the target itself moves. That is <b>irreducible noise</b>. In machine learning
    each arrow is a model trained on one batch of data, the bullseye is the truth, and the rocking
    boat is everything about the outcome that the inputs do not explain.</p
  >
</template>

<template data-part="math"
  ><h4>The decomposition</h4
  ><p
    >Suppose the world produces \(y=f(x)+\varepsilon\), with noise of mean 0 and variance
    \(\sigma^2\). Train a model on a random batch and call its prediction \(\hat f(x)\). Averaging
    over batches and over the noise in a new measurement at \(x\),</p
  >$$\mathbb E\big[(y-\hat f(x))^2\big]=\underbrace{\big(\mathbb E[\hat
  f(x)]-f(x)\big)^2}_{\text{bias}^2}+\underbrace{\mathbb E\Big[\big(\hat f(x)-\mathbb E[\hat
  f(x)]\big)^2\Big]}_{\text{variance}}+\underbrace{\sigma^2}_{\text{noise}} .$$
  <p
    >To see why, write \(y-\hat f=\varepsilon+(f-\bar f)+(\bar f-\hat f)\) with \(\bar f=\mathbb
    E[\hat f]\). The three pieces are uncorrelated: the new noise is independent of the training
    batch, and \(\bar f-\hat f\) has mean zero. So the squares add and the cross terms vanish.</p
  >
  <h4>Why this page can show it exactly</h4
  ><p
    >The model here is a polynomial fitted by least squares, which is linear in the data: the
    prediction at any \(x\) is a fixed weighted sum of the batch's \(y\) values, \(\hat f(x)=\mathbf
    h(x)^{\top}\mathbf y\). Each batch uses the same \(x\) positions with fresh noise. Then nothing
    has to be estimated:</p
  >$$\mathbb E[\hat f(x)]=\mathbf h(x)^{\top}\mathbf f,\qquad\text{bias}(x)=\mathbf
  h(x)^{\top}\mathbf f-f(x),\qquad\text{variance}(x)=\sigma^2\,\lVert\mathbf h(x)\rVert^2 .$$<p
    >The curves in the lower picture are these formulas averaged over \(x\). The thin lines are
    simulations, and the second bar shows what you would measure from only the batches drawn so far.
    It closes in on the exact bar as batches accumulate, and the animation stops once the two
    agree.</p
  >
  <h4>The trade-off</h4
  ><p
    >A polynomial of degree \(d\) has \(p=d+1\) coefficients. Averaged over the training positions,
    its variance is exactly</p
  >$$\overline{\text{variance}}=\sigma^2\,\frac{p}{n} .$$<p
    >Every extra coefficient adds \(\sigma^2/n\) of variance, whether or not it helps. Meanwhile
    bias² can only fall as \(d\) grows, quickly at first and then hardly at all once the model can
    follow the truth. The total is therefore U-shaped. Its lowest point is where one more
    coefficient would remove less bias than the \(\sigma^2/n\) of variance it costs.</p
  >
  <h4>What irreducible noise does</h4
  ><p
    >Noise enters the total twice. First directly, as the floor \(\sigma^2\): the best possible
    model, the truth itself, still has this error, so no amount of data or tuning takes the test
    error below it. Second through the variance, which is proportional to \(\sigma^2\): noisier data
    make every fitted line wobble more. Bias does not depend on \(\sigma\) at all. So when noise is
    high, the variance curve rises more steeply while the bias curve stays where it was, and the
    bottom of the U moves toward simpler models. With very noisy data a straight line can beat the
    "correct" flexible model.</p
  >
  <h4>What more data does</h4
  ><p
    >Variance is proportional to \(1/n\), so more data lowers the green curve and moves the best
    flexibility to the right. Bias is unaffected: a stiff model stays wrong however much data it
    sees. The noise floor is unaffected too. The only ways to lower \(\sigma^2\) are better
    measurements or new input variables that explain what is now treated as noise.</p
  >
  <h4>How this guides practice</h4
  ><p
    >High training error and similar test error: bias dominates, so use a more flexible model or
    better features. Low training error and much higher test error: variance dominates, so get more
    data, simplify, regularise, or average many models (bagging). Both errors stuck at a level that
    no model improves on: you have probably reached the noise floor.</p
  ></template
>

<template data-part="question"
  >A team has tuned every model they can think of and the test error will not go below 4.0. They
  collect ten times more data and it stays at 4.0. What is the most likely explanation, and what
  could actually help?</template
>

<template data-part="answer"
  >They have reached the irreducible noise: with the inputs they have, outcomes that look identical
  to the model differ by about that much. More data only reduces variance, and tuning only trades
  bias against variance. The remaining options are to measure the target more accurately, or to find
  new input variables that explain part of what currently looks like noise.</template
>
