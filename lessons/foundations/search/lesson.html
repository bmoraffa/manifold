<template data-part="lede"
  >Some settings are not learned from data: you have to try values and see. A grid looks tidy, but
  if only one setting really matters, a grid wastes most of its tries. Random search spends the same
  budget and usually finds better.</template
>

<template data-part="intro"
  ><p
    >You are tuning a learning rate and a batch size, and you can afford 16 training runs. A 4 × 4
    grid tries 4 learning rates, each with 4 batch sizes. If the batch size turns out to make almost
    no difference, twelve of those sixteen runs told you nothing new: you learned about only 4
    learning rates. Sixteen random points try 16 different learning rates. Same cost, four times the
    information about the setting that counts. Since you rarely know in advance which setting
    matters, random is the safer bet.</p
  >
</template>

<template data-part="math"
  ><h4>Parameters and hyperparameters</h4
  ><p
    >Weights are learned by minimising the training loss. Hyperparameters, such as the learning
    rate, the polynomial degree, \(\lambda\), or the number of layers, shape that minimisation from
    outside and must be chosen by comparing validation scores.</p
  >
  <h4>Counting distinct values</h4
  ><p>With a budget of \(B\) trials and \(d\) hyperparameters, a grid tests only</p>$$B^{1/d}\
  \text{ distinct values of each setting,}$$<p
    >while random search tests \(B\) distinct values of every setting. With \(d=6\) and \(B=729\) a
    grid tries just 3 values per setting. If only a few settings matter (and in practice this is
    usual), the grid's projection onto those few is very coarse and random search's is fine.</p
  >
  <h4>How likely is random search to succeed?</h4
  ><p
    >If the good region covers a fraction \(p\) of the search space, each random trial lands in it
    with probability \(p\), independently:</p
  >$$P(\text{at least one hit in }B\text{ trials})=1-(1-p)^{B}.$$<p
    >For the best 5% of settings, 60 trials give \(1-0.95^{60}\approx95\%\), whatever the number of
    hyperparameters.</p
  >
  <h4>Doing better than random</h4
  ><p
    >Random search ignores what earlier trials found. Bayesian optimisation fits a model, often a
    Gaussian process, to the scores seen so far and picks the next trial where the model predicts a
    good score or is very uncertain. Successive halving and Hyperband start many runs and stop the
    poor ones early. All of them should search learning rates and penalties on a log scale.</p
  ></template
>

<template data-part="question">When would grid search be the better choice?</template>

<template data-part="answer"
  >When there are only one or two hyperparameters and all of them matter, or when you need results
  on exactly the same values to compare across experiments. With three or more hyperparameters, or
  when you do not know which ones matter, random search or a smarter method is better.</template
>
