<template data-part="lede"
  >A model always looks good on the data it was fitted to. To judge it honestly, hold some data
  back. Cross-validation does this several times, with each block of data taking a turn as the
  held-out part.</template
>

<template data-part="intro"
  ><p
    >A student who has seen the exam paper in advance will score well, and the score tells you
    nothing. To learn what they know, set questions they have not seen. A model is the same: its
    error on the training data is an exam it has already memorised. So hide part of the data during
    fitting and score the model on that. Cross-validation is the frugal version: every point gets
    used for fitting most of the time and for scoring exactly once.</p
  >
</template>

<template data-part="math"
  ><h4>Three sets, three jobs</h4
  ><p
    ><b>Training set:</b> fit the parameters. <b>Validation set:</b> compare models and choose
    settings such as the degree or \(\lambda\). <b>Test set:</b> used once, at the very end, to
    report how the chosen model will do. The third set is needed because choosing the best of many
    models on the validation set is itself a form of fitting, so the winner's validation score is
    optimistic.</p
  >
  <h4>k-fold cross-validation</h4
  ><p
    >Split the data into \(k\) blocks. For each block in turn, fit on the other \(k-1\) and measure
    the error on that block:</p
  >$$\mathrm{CV}_k=\frac1k\sum_{j=1}^{k}\ \frac{1}{|B_j|}\sum_{i\in B_j}\big(y_i-\hat
  f^{(-j)}(x_i)\big)^2$$<p
    >where \(\hat f^{(-j)}\) was fitted without block \(j\). With \(k=n\) each block is a single
    point: leave-one-out.</p
  >
  <h4>Choosing k</h4
  ><p
    >Small \(k\) trains on much less data than you really have, so the estimate is pessimistic
    (biased upward), and it depends heavily on how the split happened to fall. Large \(k\) trains on
    nearly everything, so bias is small, but it costs \(k\) fits. \(k=5\) or \(10\) is the usual
    compromise.</p
  >
  <h4>Using it</h4
  ><p
    >Compute \(\mathrm{CV}_k\) for each candidate model and pick the lowest, as in the bottom chart.
    Then refit the winner on all the data. Any step that looks at the targets, including feature
    selection and scaling, must be done inside each fold, not before the split.</p
  ></template
>

<template data-part="question"
  >You try 200 models and report the best cross-validation score as the expected accuracy. What is
  wrong with that?</template
>

<template data-part="answer"
  >The best of 200 scores is partly luck: some model will fit the quirks of the validation folds by
  chance. The reported number is optimistic. Hold out a separate test set that plays no part in the
  selection and report the winner’s score on that.</template
>
