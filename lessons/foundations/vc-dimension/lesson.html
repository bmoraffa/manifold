<template data-part="lede"
  >A model that can fit any pattern of labels you give it has learned nothing when it fits yours.
  The VC dimension measures that flexibility with a game. Put some points down. An opponent labels
  them in every possible way. If your family of models has an answer for every labelling, the points
  are shattered. The largest number of points that can be shattered is the VC dimension, and it
  controls how much data you need before a good fit means anything.</template
>

<template data-part="intro"
  ><p
    >Suppose a fortune-teller can explain any outcome after the fact. If you won, the stars foretold
    it. If you lost, the stars foretold that too. Their record of explaining the past is perfect and
    tells you nothing about whether they can predict the future. A family of models is in the same
    position when it is flexible enough to match every possible labelling of your data: a perfect
    fit was guaranteed in advance. A family that can match only a few of the possible labellings is
    different. If it fits yours, that is evidence. The VC dimension counts how many points a family
    can explain away completely.</p
  >
</template>

<template data-part="math"
  ><h4>Shattering</h4
  ><p
    >Let \(\mathcal H\) be a family of classifiers. A set of \(n\) points is <b>shattered</b> by
    \(\mathcal H\) if, for every one of the \(2^n\) ways of labelling them \(\pm1\), some
    \(h\in\mathcal H\) labels all of them correctly. The <b>Vapnik-Chervonenkis dimension</b> is</p
  >$$d_{\mathrm{VC}}(\mathcal H)=\max\{\,n:\ \text{some set of }n\text{ points is shattered by
  }\mathcal H\,\}.$$<p
    >Note the two quantifiers. To show \(d_{\mathrm{VC}}\ge n\) you need <i>one</i> arrangement that
    works. To show \(d_{\mathrm{VC}}&lt;n\) you must show that <i>every</i> arrangement fails.</p
  >
  <h4>The three families here</h4
  ><p
    ><b>Intervals</b> label a point positive when it lies in \([a,b]\). Two points can be shattered.
    Three cannot: positive, negative, positive from left to right is impossible. So
    \(d_{\mathrm{VC}}=2\).</p
  ><p
    ><b>Straight lines</b> in the plane label one side positive. Three points not in a row can be
    shattered. Four never can: either one point lies inside the triangle of the others, and cannot
    be labelled differently from all three, or the four form a quadrilateral, and the two diagonals
    cannot be given opposite labels. So \(d_{\mathrm{VC}}=3\). In \(d\) dimensions a hyperplane has
    \(d_{\mathrm{VC}}=d+1\).</p
  ><p
    ><b>Upright rectangles</b> label the inside positive. Four points in a diamond can be shattered.
    With five, take the leftmost, rightmost, top and bottom points: any rectangle containing those
    four contains the fifth as well. So \(d_{\mathrm{VC}}=4\).</p
  >
  <h4>The growth function</h4
  ><p
    >Let \(m_{\mathcal H}(n)\) be the largest number of distinct labellings \(\mathcal H\) can
    produce on any \(n\) points. Up to the VC dimension it equals \(2^n\). Beyond it, Sauer's lemma
    says it grows only like a polynomial:</p
  >$$m_{\mathcal
  H}(n)\le\sum_{i=0}^{d_{\mathrm{VC}}}\binom{n}{i}\le\Big(\frac{e\,n}{d_{\mathrm{VC}}}\Big)^{d_{\mathrm{VC}}}.$$<p
    >That break from exponential to polynomial is what makes learning possible. The bottom-right
    chart shows the two curves separating.</p
  >
  <h4>Why it matters</h4
  ><p>With probability at least \(1-\delta\), every classifier in the family satisfies</p
  >$$\text{true error}\ \le\ \text{training
  error}+\sqrt{\frac{8}{n}\Big(d_{\mathrm{VC}}\ln\frac{2en}{d_{\mathrm{VC}}}+\ln\frac4\delta\Big)}.$$<p
    >The gap between what you measure and what you get shrinks as the number of examples \(n\) grows
    and widens with the VC dimension. A family with infinite VC dimension offers no such guarantee
    at all. The bound is loose in practice, often by a large factor, and modern networks generalize
    far better than it predicts. Its lasting lesson is the trade: more flexibility buys a better fit
    and costs certainty about what that fit means.</p
  >
  <h4>What this page checks</h4
  ><p
    >For each labelling the page searches the family exhaustively: every pair of cut points for
    intervals, the bounding box of the positive points for rectangles, and 720 directions for lines.
    The growth-function chart uses the exact values for these three families, \(\binom n2+n+1\) for
    intervals, \(n^2-n+2\) for lines and the Sauer bound for rectangles.</p
  ></template
>

<template data-part="question"
  >Three points in a row cannot be shattered by straight lines. Four points in general position
  cannot either. Why is the VC dimension of lines 3 and not 2?</template
>

<template data-part="answer"
  >Because the definition asks for the best case over arrangements. It is enough that one set of
  three points can be shattered, and any three points that are not in a row can be. The failure for
  three points in a row is a property of that unlucky arrangement, not of the family. For four
  points the failure is different in kind: it happens for every arrangement, whether one point is
  inside the triangle of the others or the four form a quadrilateral. So three is achievable and
  four is not, and the VC dimension is 3.</template
>
