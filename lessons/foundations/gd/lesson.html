<template data-part="lede"
  >Training a model means finding the lowest point of a loss surface you cannot see all at once.
  Gradient descent feels the slope under its feet and takes a step downhill, again and again. Choose
  a surface, a step size and a starting point.</template
>

<template data-part="intro"
  ><p
    >You are on a hillside in thick fog and want to reach the valley floor. You cannot see the
    valley, but you can feel which way the ground slopes where you stand. So you take a step in the
    steepest downhill direction, feel again, and repeat. That is the whole algorithm. Everything
    else, step size, momentum, noise, is about how to take those steps well.</p
  >
</template>

<template data-part="math"
  ><h4>The update</h4>$$\mathbf w_{t+1}=\mathbf w_t-\eta\,\nabla L(\mathbf w_t)$$<p
    >The gradient \(\nabla L\) is the vector of slopes in each direction; it points uphill, so the
    step goes against it. The learning rate \(\eta\) sets the step length.</p
  >
  <h4>Why the learning rate has a limit</h4
  ><p
    >Near a minimum the surface is a bowl with curvature \(\lambda\) in each direction. One step
    multiplies the distance to the bottom in that direction by \((1-\eta\lambda)\). That shrinks
    only if</p
  >$$|1-\eta\lambda|&lt;1\quad\Longleftrightarrow\quad \eta&lt;\frac{2}{\lambda_{\max}}.$$<p
    >The steepest direction sets the limit. In a narrow valley the walls are steep and the floor is
    nearly flat: a rate small enough for the walls is far too small for the floor, so progress along
    the valley is painfully slow. Just below the limit the path bounces from wall to wall.</p
  >
  <h4>Momentum</h4>$$\mathbf v_{t+1}=\beta\,\mathbf v_t-\eta\,\nabla L(\mathbf w_t),\qquad \mathbf
  w_{t+1}=\mathbf w_t+\mathbf v_{t+1}$$<p
    >Keep a running velocity, like a heavy ball rolling. Across the valley the gradient keeps
    flipping sign and cancels; along it the gradient keeps the same sign and builds up. With
    \(\beta=0.9\) the effective step along a steady direction is about ten times larger.</p
  >
  <h4>Noise: stochastic gradient descent</h4
  ><p
    >Real training estimates the gradient from a small batch of data, so each step uses the true
    gradient plus noise. The path jitters and never settles exactly, but each step is far cheaper,
    and the noise can shake it out of shallow dips.</p
  >
  <h4>What it cannot promise</h4
  ><p
    >Gradient descent only knows the local slope. On a surface with several valleys it ends in
    whichever one the starting point drains into.</p
  ></template
>

<template data-part="question"
  >The loss is going up at every step. What is the most likely cause?</template
>

<template data-part="answer"
  >The learning rate is above the limit 2 / λmax for the steepest direction, so each step overshoots
  the valley floor by more than it started with. Lowering the learning rate fixes it.</template
>
