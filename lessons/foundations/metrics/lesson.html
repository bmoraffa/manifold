<template data-part="lede"
  >A classifier gives every case a score. A threshold turns scores into yes or no, and every case
  lands in one of four boxes. Slide the threshold and watch what you gain and what you
  pay.</template
>

<template data-part="intro"
  ><p
    >A smoke alarm can be wrong in two ways: it can stay silent in a fire, or go off when you make
    toast. Turning up its sensitivity trades one mistake for the other, and no setting removes both
    unless the alarm can tell smoke from toast perfectly. Every classifier has this dial. The right
    setting depends on what each mistake costs, which is a question about the world, not about the
    model.</p
  >
</template>

<template data-part="tryit"
  >Set the share of positives to 0.02, as for a rare disease, and put the threshold far to the right
  so the classifier says “no” to everyone. What is the accuracy? What is the recall? Then watch
  which of the two curves on the right changes when you change the share of positives.</template
>

<template data-part="math"
  ><h4>The confusion matrix</h4
  ><p
    >Out of every 1,000 cases the readouts count: <b>TP</b> positives correctly flagged,
    <b>FN</b> positives missed, <b>FP</b> negatives wrongly flagged, <b>TN</b> negatives correctly
    passed.</p
  >
  <h4>The rates</h4>$$\text{accuracy}=\frac{TP+TN}{\text{all}},\qquad
  \text{precision}=\frac{TP}{TP+FP},\qquad \text{recall}=\frac{TP}{TP+FN},\qquad
  \text{FPR}=\frac{FP}{FP+TN}$$$$F_1=\frac{2\cdot\text{precision}\cdot\text{recall}}{\text{precision}+\text{recall}}$$<p
    ><b>Recall:</b> of the real positives, how many did I catch? <b>Precision:</b> of the cases I
    flagged, how many were real? \(F_1\) is their harmonic mean, which is high only when both
    are.</p
  >
  <h4>Why accuracy misleads</h4
  ><p
    >If 2% of cases are positive, answering "no" every time is 98% accurate and catches nothing.
    With unbalanced classes look at precision and recall instead.</p
  >
  <h4>The ROC curve</h4
  ><p
    >Plot recall against the false positive rate for every threshold. A useless classifier follows
    the diagonal; a perfect one hugs the top-left corner. The area under it has a direct meaning:</p
  >$$\mathrm{AUC}=P\big(\text{score of a random positive}>\text{score of a random
  negative}\big).$$<p
    >Both axes are rates within one class, so the ROC curve does not move when the share of
    positives changes. That makes it good for comparing classifiers and blind to class imbalance.</p
  >
  <h4>The precision–recall curve</h4
  ><p
    >Precision mixes the two classes, so it does depend on the share of positives. When positives
    are rare, even a small false positive rate produces more false alarms than hits and precision
    collapses. The precision–recall curve shows this; the ROC curve hides it.</p
  ></template
>

<template data-part="question"
  >A screening test for a rare disease has 99% recall and a 5% false positive rate. A patient tests
  positive. Are they probably ill?</template
>

<template data-part="answer"
  >Probably not. If 1 in 1,000 people has the disease, then of 1,000 tested about 1 is a true
  positive and about 50 are false positives. Precision is about 2%. Set the share of positives to
  0.01 and look at the precision readout.</template
>
