<template data-part="lede"
  >After a neuron adds up its inputs, it passes the total through a small curve called the
  activation function. That curve is what lets a network learn anything other than straight lines.
  Its slope also decides how well the learning signal survives the trip back through many layers.
  Send the signal back and watch what each curve does to it.</template
>

<template data-part="intro"
  ><p
    >Photocopy a page, then photocopy the copy, and keep going. If each copy keeps only a quarter of
    the ink, the tenth copy is blank. If each keeps all of it, the tenth is as sharp as the first.
    Training a deep network sends a learning signal backward through every layer, and at each layer
    the signal is multiplied by the slope of the activation function. A curve whose slope is always
    small is a bad photocopier.</p
  >
</template>

<template data-part="math"
  ><h4>The four curves</h4
  >$$\sigma(z)=\frac{1}{1+e^{-z}},\qquad\tanh(z)=\frac{e^{z}-e^{-z}}{e^{z}+e^{-z}},\qquad\mathrm{ReLU}(z)=\max(0,z),\qquad\mathrm{LeakyReLU}(z)=\max(0.1z,\;z).$$<p
    >Their slopes are</p
  >$$\sigma'(z)=\sigma(z)\big(1-\sigma(z)\big)\le\tfrac14,\qquad\tanh'(z)=1-\tanh^2(z)\le1,\qquad\mathrm{ReLU}'(z)=\begin{cases}1&z>0\\0&z\le0\end{cases},\qquad\mathrm{LeakyReLU}'(z)=\begin{cases}1&z>0\\0.1&z\le0.\end{cases}$$
  <h4>Why the slope matters</h4
  ><p>Backpropagation gives the blame at layer \(l\) as</p>$$\boldsymbol\delta^{(l)}=\big(\mathbf
  W^{(l+1)\top}\boldsymbol\delta^{(l+1)}\big)\odot\phi'\big(\mathbf z^{(l)}\big).$$<p
    >Going back through \(k\) layers multiplies by \(k\) weight matrices and \(k\) sets of slopes.
    With the sigmoid every slope is at most \(\tfrac14\), so unless the weights are large the signal
    shrinks geometrically: this is the <b>vanishing gradient</b>. The first layers then learn
    thousands of times more slowly than the last, and a deep sigmoid network barely trains. Making
    the weights larger does not help, because large inputs push the sigmoid into its flat ends,
    where the slope is nearly zero (<b>saturation</b>).</p
  >
  <h4>Why ReLU changed things</h4
  ><p
    >For positive inputs ReLU has slope exactly 1, so the signal passes through unchanged, and
    nothing saturates on that side. About half the neurons are off for any given input, and those
    pass nothing, but the paths that remain open carry the signal at full strength. With suitably
    scaled weights the overall strength stays roughly constant however deep the network. ReLU is
    also cheap to compute. Its weakness is the <b>dead neuron</b>: one whose input is negative for
    every training example has slope 0 everywhere and never updates again. Leaky ReLU keeps a small
    slope on the negative side so that such a neuron can recover.</p
  >
  <h4>Choosing one</h4
  ><ul
    ><li><b>Hidden layers:</b> ReLU or a close relative (Leaky ReLU, GELU, SiLU) by default.</li
    ><li
      ><b>tanh:</b> still used where outputs centred on zero matter, as in recurrent networks. It is
      better than the sigmoid for hidden layers because its slope reaches 1 and its output averages
      near zero.</li
    ><li
      ><b>Sigmoid:</b> for an output that must be a probability, and for gates. Avoid it in deep
      hidden layers.</li
    ><li
      ><b>Output layer:</b> chosen by the task, not by the trainability of the network: sigmoid for
      yes or no, softmax for one of many, none for a number.</li
    ></ul
  >
  <h4>What this page computes</h4
  ><p
    >The right-hand picture is a real calculation: a stack of layers 40 neurons wide with random
    weights of variance (size)²/40, fifty random inputs sent forward, and a random signal sent
    backward by the formula above. Each bar is the root-mean-square size of the signal at that
    layer. The Weight Initialization tab shows how the size of the weights should be chosen for each
    activation.</p
  ></template
>

<template data-part="question"
  >With the sigmoid, the gradient shrinks by roughly a factor of four or more per layer. A colleague
  suggests multiplying the learning rate of the early layers by a large number to compensate. What
  is wrong with that?</template
>

<template data-part="answer"
  >The factor differs from layer to layer, from weight to weight and from one moment in training to
  the next, so no fixed multiplier is right for long. A gradient that has shrunk by a factor of a
  million has also lost its information to rounding and noise. Fixing the cause works better: use an
  activation whose slope is 1 over much of its range, initialise the weights to preserve the signal,
  and add skip connections or normalisation in very deep networks.</template
>
