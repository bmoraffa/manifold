<template data-part="lede"
  >A large network given a small, noisy set of examples will memorise them, mistakes included.
  Dropout is a simple cure: during every training step, switch off a random share of the neurons. No
  neuron can rely on any other being there, so the network has to learn the pattern in many
  overlapping ways. Two identical networks train here side by side, one with dropout and one
  without.</template
>

<template data-part="intro"
  ><p
    >Imagine a team where one brilliant member knows everything and the rest have learned to pass
    every question to her. The team does well until the day she is away. Now imagine a manager who
    sends a random half of the team home each day. Nobody can depend on anyone in particular, so
    everyone has to become competent, and knowledge ends up spread across the team with plenty of
    overlap. On the day that matters, everyone comes in. That is dropout: the team is the layer, the
    members are neurons, and the days with absences are training steps.</p
  >
</template>

<template data-part="math"
  ><h4>What it does during training</h4
  ><p
    >For each training example and each hidden neuron, draw a mask \(m_j\) that is 0 with
    probability \(p\) and 1 otherwise, and replace the neuron's output \(a_j\) by</p
  >$$\tilde a_j=\frac{m_j}{1-p}\,a_j .$$<p
    >The division by \(1-p\) (called inverted dropout) keeps the expected output the same, \(\mathbb
    E[\tilde a_j]=a_j\), so the next layer sees inputs of the usual size. Backpropagation uses the
    same mask: a neuron that was off receives no gradient on that step.</p
  >
  <h4>What it does at prediction time</h4
  ><p
    >Nothing. All neurons are on and no scaling is needed, because the scaling was already applied
    in training. The decision regions drawn on this page are the prediction-time network.</p
  >
  <h4>Why it works</h4><p>Three ways to see it, all saying the same thing.</p
  ><ul
    ><li
      ><b>No co-adaptation.</b> A neuron cannot rely on a specific partner, because that partner is
      absent a share \(p\) of the time. Fragile arrangements of neurons that fit a single odd
      training point do not survive.</li
    ><li
      ><b>An ensemble for the price of one.</b> Each mask defines a different thinned network. With
      \(H\) hidden neurons there are \(2^H\) of them, all sharing weights. Training with dropout
      trains them all a little, and predicting with every neuron on approximates averaging their
      answers. Averaging many models reduces variance, as bagging did.</li
    ><li
      ><b>Noise as a penalty.</b> Adding noise to the hidden layer makes solutions that depend on
      large, finely balanced weights perform badly, which pushes the network toward smaller, more
      evenly spread weights, much as an L2 penalty does.</li
    ></ul
  >
  <h4>The cost</h4
  ><p
    >Dropout makes the training loss noisier and higher, and training takes longer. If \(p\) is too
    large the network does not have enough capacity left on each step and underfits. Typical values
    are 0.5 for large fully connected layers and 0.1 to 0.3 elsewhere. With plenty of data there is
    little overfitting to cure and dropout helps less.</p
  >
  <h4>Batch normalisation, briefly</h4
  ><p
    >Batch normalisation is a different technique that is often mentioned alongside dropout. It
    rescales the inputs of each layer to mean 0 and variance 1 over the current mini-batch, then
    lets the layer learn its own scale and shift. Its main effect is to make deep networks train
    faster and more reliably, and the noise from using batch statistics also regularises a little.
    It does not have its own animation on this site yet.</p
  ></template
>

<template data-part="question"
  >With dropout the training loss is higher than without, yet the test loss is lower. How can a
  model that fits the training data worse be the better model?</template
>

<template data-part="answer"
  >The training set here contains wrongly labelled points. Fitting them perfectly means bending the
  boundary around each one, and those bends are wrong for new data. Dropout makes such narrow,
  single-point fits unstable, because the few neurons that would encode them are often switched off,
  so the network keeps only the broad pattern that many neurons agree on. Its higher training loss
  is mostly the mislabelled points it declined to memorise.</template
>
