<template data-part="lede"
  >A single neuron can only draw one straight edge. Put a few of them in a layer, feed that layer
  into another, and the edges combine into curves, rings and spirals. Here you can watch that
  happen: the picture inside each neuron shows what that neuron has learned to respond to.</template
>

<template data-part="intro"
  ><p
    >Think of a sculptor who may only make straight cuts. One cut divides the block in two: that is
    one neuron. Three cuts can leave a triangle standing. With enough cuts, and a second sculptor
    who combines the pieces the first one made, any shape can be carved. A neural network works the
    same way. The first hidden layer makes straight cuts through the input space, and each later
    layer combines the pieces from the layer before into more elaborate regions.</p
  >
</template>

<template data-part="math"
  ><h4>One neuron</h4
  ><p
    >A neuron takes its inputs, multiplies each by a weight, adds a bias, and passes the total
    through an activation function \(\phi\):</p
  >$$a=\phi\big(w_1x_1+w_2x_2+b\big).$$<p
    >The set of points where \(w_1x_1+w_2x_2+b=0\) is a straight line, and the neuron is "on" on one
    side and "off" on the other. Look at any neuron in the first hidden layer: its picture is always
    a straight edge.</p
  >
  <h4>Layers</h4
  ><p
    >A layer is many neurons reading the same inputs. Stacking the weights into a matrix \(\mathbf
    W^{(l)}\) and the biases into a vector \(\mathbf b^{(l)}\),</p
  >$$\mathbf a^{(0)}=\mathbf x,\qquad\mathbf a^{(l)}=\phi\big(\mathbf W^{(l)}\mathbf
  a^{(l-1)}+\mathbf b^{(l)}\big),\qquad\hat y=\sigma\big(\mathbf w^{\top}\mathbf a^{(L)}+b\big),$$<p
    >where the final \(\sigma\) is the logistic function, so that \(\hat y\) is the probability of
    the gold class. A neuron in layer 2 takes a weighted sum of the straight-edge pictures from
    layer 1 and bends the result, which is how corners and closed regions appear.</p
  >
  <h4>Why the activation must bend</h4
  ><p
    >If \(\phi\) were the identity, each layer would be a linear map, and a stack of linear maps is
    one linear map: \(\mathbf W^{(2)}\mathbf W^{(1)}\mathbf x\). The whole network would be a single
    straight cut, however deep. The non-linear activation is what lets layers build on one
    another.</p
  >
  <h4>What training does</h4
  ><p>The loss is the average log loss (cross-entropy) over the training points,</p>$$\mathcal
  L=-\frac1n\sum_{i=1}^{n}\big[y_i\log\hat y_i+(1-y_i)\log(1-\hat y_i)\big].$$<p
    >Each epoch computes the gradient of \(\mathcal L\) with respect to every weight by
    backpropagation (its own tab) and moves the weights a small step against it. This page uses the
    Adam optimiser from the Foundations module. Training stops here when the loss has stopped
    falling.</p
  >
  <h4>Width and depth</h4
  ><p
    >More neurons in a layer give more cuts to work with. More layers let cuts be combined into
    pieces, and pieces into shapes, so a deep network can describe some shapes with far fewer
    neurons than a wide shallow one. The count of weights grows quickly: a layer of \(m\) neurons
    reading \(n\) inputs has \(m(n+1)\) parameters. When the network is much larger than the data
    needs, training loss keeps falling while test loss turns back up: the same overfitting you saw
    with polynomials.</p
  ></template
>

<template data-part="question"
  >A network with one hidden layer of 2 tanh neurons cannot separate the ring from its core. Why
  not?</template
>

<template data-part="answer"
  >Each first-layer neuron makes one straight cut, so two neurons give two lines. The output can
  only combine "which side of line 1" and "which side of line 2", and no region bounded by two lines
  is closed: it always runs off to infinity somewhere. Closing a region around the core takes at
  least three cuts, which is why three neurons are the minimum.</template
>
