<template data-part="lede"
  >Training a network means answering one question for every weight: if I nudge this weight up a
  little, does the error go up or down, and by how much? Backpropagation answers it for all weights
  in one backward sweep. Here a tiny network decides whether to take an umbrella, and every number
  is on the screen.</template
>

<template data-part="intro"
  ><p
    >A restaurant serves a dish that is too salty. The head chef does not retrain the whole kitchen.
    She asks who added salt, and how much each contributed. The cook who made the sauce is mostly
    responsible; the one who salted the pasta water, a little. Each of them then asks the same of
    whoever supplied their ingredients. Blame is passed backward along the same routes the
    ingredients travelled forward, shared out in proportion to how much each route mattered. That is
    backpropagation. The dish is the output, the saltiness is the error, and the routes are the
    weights.</p
  >
</template>

<template data-part="math"
  ><h4>The forward pass</h4
  ><p
    >This network has inputs \(x_1,x_2\), two hidden neurons with \(\tanh\), and one sigmoid
    output:</p
  >$$z_j=w_{j1}x_1+w_{j2}x_2+b_j,\quad h_j=\tanh z_j,\qquad z_o=v_1h_1+v_2h_2+c,\quad\hat
  y=\sigma(z_o),\qquad L=\tfrac12(\hat y-y)^2 .$$ <h4>The backward pass is the chain rule</h4
  ><p
    >We want \(\partial L/\partial\) (every weight). Define the "blame" of a neuron as the
    derivative of the loss with respect to its total input, \(\delta=\partial L/\partial z\). For
    the output neuron,</p
  >$$\delta_o=\frac{\partial L}{\partial\hat y}\cdot\frac{\partial\hat y}{\partial z_o}=(\hat
  y-y)\;\hat y(1-\hat y).$$<p
    >A weight's gradient is the blame of the neuron it feeds, times the value that travelled along
    it:</p
  >$$\frac{\partial L}{\partial v_j}=\delta_o\,h_j,\qquad\frac{\partial L}{\partial c}=\delta_o
  .$$<p
    >The blame of a hidden neuron is the output's blame, carried back along the connecting weight
    and multiplied by the slope of the hidden neuron's own activation:</p
  >$$\delta_j=\delta_o\,v_j\,\big(1-h_j^2\big),\qquad\frac{\partial L}{\partial
  w_{ji}}=\delta_j\,x_i,\qquad\frac{\partial L}{\partial b_j}=\delta_j .$$ <h4>The general rule</h4
  ><p>For any layered network the same two lines repeat from the last layer to the first:</p
  >$$\boldsymbol\delta^{(l)}=\big(\mathbf
  W^{(l+1)\top}\boldsymbol\delta^{(l+1)}\big)\odot\phi'\big(\mathbf
  z^{(l)}\big),\qquad\frac{\partial L}{\partial\mathbf W^{(l)}}=\boldsymbol\delta^{(l)}\,\mathbf
  a^{(l-1)\top}.$$<p
    >One forward pass stores the values, one backward pass reuses them, and the cost of getting
    every gradient is about the same as computing the output once. Without this, each weight would
    need its own forward pass, which for a network with a million weights would be a million times
    slower.</p
  >
  <h4>The update</h4
  ><p
    >Every parameter then takes a step against its gradient, \(\theta\leftarrow\theta-\eta\,\partial
    L/\partial\theta\), with learning rate \(\eta\). The table lists all nine. On this page the loop
    stops when the loss is below 0.0005, where the answer is within about three percentage points of
    the truth.</p
  >
  <h4>What to notice</h4
  ><p
    >The gradient of a weight is a product of three kinds of factor: an error, some weights along
    the way, and slopes of activations. If the output is saturated, \(\hat y(1-\hat y)\) is near
    zero and everything behind it learns slowly even when the answer is badly wrong. If an input is
    0, the weights leaving it get zero gradient and do not move. And a neuron connected to the
    output by a large weight receives a large share of the blame. The Activation Functions tab shows
    what these products do in a deep network.</p
  ></template
>

<template data-part="question"
  >Set cloud cover to 0 and step through. The two weights leaving that input have gradient exactly
  0, whatever the error. Why, and is that a problem?</template
>

<template data-part="answer"
  >The gradient of a weight is the blame of the neuron it feeds times the value carried along it,
  and that value is 0. Changing the weight would change nothing about this prediction, so this
  example gives no information about it. It is not a problem in practice: other training examples
  have non-zero cloud cover and will move those weights. It is one reason inputs are usually centred
  so that they are not stuck at zero.</template
>
