<template data-part="lede"
  >Give a network a picture, force it through a bottleneck of just two numbers, and ask for the same
  picture back on the other side. To succeed it has to discover on its own what matters about the
  pictures. Nobody tells it which letter is which, yet the letters sort themselves into groups on
  the map of those two numbers. Drag across the map to see what each spot turns into.</template
>

<template data-part="intro"
  ><p
    >Suppose you must describe a friend's face over a bad phone line using only two numbers. You
    could not send the picture. You would have to agree on a scheme first: perhaps the first number
    says how round the face is and the second how long the hair. A good scheme lets the listener
    redraw something close to the original. An autoencoder invents such a scheme by itself. The
    encoder is you, the two numbers are the phone line, the decoder is the listener, and the scheme
    is whatever makes the redrawn pictures match best.</p
  >
</template>

<template data-part="math"
  ><h4>The model</h4
  ><p
    >An encoder \(f\) maps the input \(\mathbf x\in\mathbb R^{35}\) to a short code \(\mathbf
    z\in\mathbb R^{2}\), and a decoder \(g\) maps the code back:</p
  >$$\mathbf z=f(\mathbf x),\qquad\hat{\mathbf x}=g(\mathbf z),\qquad\mathcal
  L=\frac1n\sum_{i=1}^{n}\ell\big(\mathbf x_i,\;g(f(\mathbf x_i))\big).$$<p
    >Here both are small networks, \(35\to H\to2\) and \(2\to H\to35\), and \(\ell\) is the
    cross-entropy between each original pixel and the predicted one. The target is the input itself,
    so no labels are needed: this is unsupervised (more precisely, self-supervised) learning.</p
  >
  <h4>Why the bottleneck matters</h4
  ><p
    >If the code were as large as the input, the network could copy its input straight through and
    learn nothing. Two numbers cannot hold 35 pixels, so the network must keep what distinguishes
    one picture from another and drop the rest. Pictures that share most of their pixels need nearly
    the same code, so they land close together on the map. That is why the letters form groups
    without ever being told they are letters.</p
  >
  <h4>Relation to PCA</h4
  ><p
    >With no hidden layers and no activation, the best possible autoencoder with a two-number code
    finds the same plane as the first two principal components. The non-linear layers let it bend
    that plane into a curved surface that fits the data better. An autoencoder is a non-linear
    generalisation of PCA.</p
  >
  <h4>The decoder is a generator</h4
  ><p
    >The decoder turns any point of the map into a picture, including points that no training
    picture landed on. Dragging the diamond between two groups gives pictures in between. In a plain
    autoencoder the regions between groups can decode to rubbish, because nothing trained them. The
    <b>variational autoencoder</b> fixes this by making the codes fill the map smoothly, which turns
    the decoder into a proper generative model. That is the start of the Generative AI module.</p
  >
  <h4>What autoencoders are used for</h4
  ><ul
    ><li><b>Compression and visualisation:</b> a short code in place of a long input.</li
    ><li><b>Denoising:</b> train with a corrupted input and the clean picture as the target.</li
    ><li
      ><b>Anomaly detection:</b> an input unlike the training data is reconstructed badly, and the
      size of the error flags it.</li
    ><li
      ><b>Pre-training:</b> the encoder's code is a compact set of features for another task.</li
    ></ul
  ></template
>

<template data-part="question"
  >After training, a picture of the letter K, which was never in the training set, is fed in. What
  do you expect to come out, and how could that be put to use?</template
>

<template data-part="answer"
  >Something that looks like a blend of the letters it does know, probably closest to H or X,
  because the decoder can only produce pictures of the kind it was trained on. The reconstruction
  will differ from the input in many pixels, so the error will be much larger than for a familiar
  letter. That is the basis of anomaly detection with autoencoders: a large reconstruction error
  signals an input unlike the training data.</template
>
