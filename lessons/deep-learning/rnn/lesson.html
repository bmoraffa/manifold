<template data-part="lede"
  >Your phone suggests the next word as you type. To do that it has to remember what came before. A
  recurrent network reads a sequence one item at a time and keeps a small memory that it updates at
  every step. Here one learns to spell a phrase you choose, letter by letter, and then writes it
  back on its own.</template
>

<template data-part="intro"
  ><p
    >When you read a sentence you do not start afresh at every word. You carry a running sense of
    what the sentence has said so far, and each new word updates it. A recurrent network (RNN) has
    exactly one such running summary: a vector called the hidden state. At every step it takes the
    new item and the old summary, mixes them, and produces a new summary. Nothing else is
    remembered, so whatever the network needs to know about the past has to be squeezed into that
    vector.</p
  >
</template>

<template data-part="math"
  ><h4>One step</h4
  ><p
    >Let \(\mathbf x_t\) be the letter at step \(t\), written as a vector with a 1 in that letter's
    position and 0 elsewhere. The memory \(\mathbf h_t\) and the prediction \(\hat{\mathbf y}_t\)
    are</p
  >$$\mathbf h_t=\tanh\big(\mathbf W_{xh}\mathbf x_t+\mathbf W_{hh}\mathbf h_{t-1}+\mathbf
  b_h\big),\qquad\hat{\mathbf y}_t=\operatorname{softmax}\big(\mathbf W_{hy}\mathbf h_t+\mathbf
  b_y\big).$$<p
    >The same three weight matrices are used at every step. That is what "recurrent" means, and it
    is why the network can read a sequence of any length with a fixed number of weights.</p
  >
  <h4>Learning: backpropagation through time</h4
  ><p
    >The loss is the cross-entropy between the predicted next letter and the true one, added up over
    the phrase: \(\mathcal L=-\sum_t\log\hat y_t[\text{true next letter}]\). To get gradients,
    unroll the network in time, as in the left picture, and treat it as a deep network with one
    layer per step and shared weights. Blame flows from each prediction back through the memory to
    all earlier steps:</p
  >$$\frac{\partial\mathcal L}{\partial\mathbf h_t}=\mathbf W_{hy}^{\top}\big(\hat{\mathbf
  y}_t-\mathbf y_t\big)+\mathbf W_{hh}^{\top}\Big[\big(1-\mathbf
  h_{t+1}^2\big)\odot\frac{\partial\mathcal L}{\partial\mathbf h_{t+1}}\Big].$$<p
    >The gradient of each shared matrix is the sum of its gradients at all steps.</p
  >
  <h4>Why memory is needed</h4
  ><p
    >In "hello world" the letter l is followed by l, by o and by d. A model that sees only the
    current letter cannot do better than guess among them. The RNN can, because by the time it reads
    each l its memory holds a trace of the letters before it. The number of memory cells limits how
    much can be kept: with too few, different histories collapse onto the same memory and the
    predictions blur.</p
  >
  <h4>The weakness, and LSTM and GRU</h4
  ><p
    >Going back \(k\) steps multiplies the gradient by \(\mathbf W_{hh}^{\top}\) and by tanh slopes
    \(k\) times, the same repeated product as in the Activation Functions lesson. Over long gaps it
    vanishes, so a plain RNN learns short-range patterns well and long-range ones poorly. The
    <b>LSTM</b> and the <b>GRU</b> add gates, small sigmoid layers that decide at each step how much
    of the old memory to keep, how much new information to write and how much to reveal. The LSTM's
    memory update is \(\mathbf c_t=\mathbf f_t\odot\mathbf c_{t-1}+\mathbf i_t\odot\tilde{\mathbf
    c}_t\): when the forget gate \(\mathbf f_t\) is near 1 the memory, and the gradient with it,
    passes through unchanged, much like a residual shortcut through time. Those gated versions are
    not animated on this page.</p
  >
  <h4>Where RNNs stand now</h4
  ><p
    >For language, Transformers have largely replaced RNNs because attention lets every position
    look directly at every other. RNNs are still used for streaming signals and small devices, and
    the idea of a state carried through time appears throughout machine learning.</p
  ></template
>

<template data-part="question"
  >The network has learned “hello world” and is writing it back. It has just read the second “l”.
  The input is the same as for the first “l”, yet it now predicts “o” instead of “l”. Where is the
  difference stored?</template
>

<template data-part="answer"
  >In the memory (the hidden state). The prediction depends on the new memory, and the new memory is
  computed from the current letter and the previous memory. Before the first l the previous memory
  encoded “he”; before the second it encoded “hel”. Same input, different previous memory, so a
  different new memory and a different prediction.</template
>
