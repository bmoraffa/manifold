<template data-part="lede"
  >Some tasks need an answer for every pixel: which pixels are tumour, which are road. Here two
  small convolutional networks learn, live, to pick out shapes from noisy pictures and mark every
  pixel as shape or background. They are identical except for one thing: one has skip connections
  and one does not. Watch their answers side by side, then draw your own shape and see what each
  makes of it.</template
>

<template data-part="intro"
  ><p
    >To describe a photograph over the phone you would first step back and say what it shows: "a
    face, in the middle". That overview needs the picture shrunk in your mind, with the detail
    ignored. But if the listener must then redraw it exactly, the overview is not enough: they need
    the fine lines back. A U-Net does both. One half steps back, level by level, to grasp the
    content. The other half redraws at full size, and at each level it is handed the detail that was
    set aside at the same level on the way down.</p
  >
</template>

<template data-part="math"
  ><h4>The shape</h4
  ><p
    >The <b>encoder</b> (down path) alternates convolutions with pooling, halving the width and
    height each time and increasing the number of feature maps, so that later layers see large
    areas. The <b>decoder</b> (up path) alternates upsampling with convolutions back to full size. A
    <b>skip connection</b> copies the encoder's feature maps at each size and joins them to the
    decoder's maps of the same size:</p
  >$$\mathbf d_l=\operatorname{conv}\big(\big[\operatorname{up}(\mathbf d_{l+1}),\;\mathbf
  e_l\big]\big).$$<p
    >Drawn with the sizes shrinking then growing, the network forms a U, and the skips are the
    horizontal rungs (Ronneberger and others, 2015).</p
  >
  <h4>Why the skips are needed</h4
  ><p
    >Halving a picture three times leaves one number for every 64 pixels. Exact positions of edges
    are gone and no amount of upsampling can bring them back: the decoder would have to invent them.
    The skip supplies them directly. The deep path answers "what is here?", the skip answers
    "exactly where?", and the decoder combines the two.</p
  >
  <h4>What this page trains</h4
  ><p
    >Two real convolutional networks, trained live by backpropagation. Each has three \(3\times3\)
    convolution layers on the way down (4, 6 and 8 feature maps at sizes 16, 8 and 4), two on the
    way up and a final one that outputs one number per pixel, turned into a probability by a
    sigmoid. Pooling is \(2\times2\) max pooling and enlargement repeats each pixel. The loss is the
    cross-entropy between the output and the true shape at every pixel. The two networks start from
    the same random kernels and see the same pictures; the only difference is whether the encoder's
    maps are joined to the decoder's at sizes 8 and 16. The score shown is intersection over union:
    pixels both mark as shape, divided by pixels either marks.</p
  >
  <h4>Where U-Nets are used</h4
  ><p
    >Segmenting medical scans (the original purpose), satellite images and road scenes; removing
    noise and sharpening images; and as the denoising network inside image diffusion models, which
    you will meet in the Generative AI module. There the input is a noisy picture and the output is
    an estimate of the noise, pixel for pixel.</p
  ></template
>

<template data-part="question"
  >A U-Net has its skip connections removed and is trained to outline cells in microscope images.
  What kind of mistakes would you expect in its output?</template
>

<template data-part="answer"
  >The right objects in roughly the right places, but with blurred, blobby outlines: neighbouring
  cells merged, thin gaps closed, small cells missed. The bottleneck keeps what is in the image and
  approximately where, and loses the exact positions of edges. Without the skips the decoder has to
  guess the boundaries from the coarse map.</template
>
