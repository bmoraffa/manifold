<template data-part="lede"
  >Some data is not a table or a picture but a web of connections: friendships, molecules, roads,
  web pages. A graph neural network learns from such data by letting every node repeatedly ask its
  neighbours what they think and update its own view. Here two people in a small social network have
  told us which club they joined. Watch that knowledge spread along the friendships until everyone
  has an answer.</template
>

<template data-part="intro"
  ><p
    >Suppose you move to a new town and want to know which football team a stranger supports. You do
    not know, but you know two of their friends, and each of those has friends whose team you do
    know. Ask around: each person forms a guess from their friends' guesses, and passes their own
    guess on. After a few rounds of gossip, a reasonable answer has reached everyone, because
    friends tend to agree. A graph neural network is this gossip, with learned rules for how to
    combine what is heard.</p
  >
</template>

  friendship per round. Notice the nodes on the bridge between the two groups: they stay pale. Now
  untick “Labelled nodes keep their known answer” and run: every node drifts to the same colour.

<template data-part="math"
  ><h4>Message passing</h4
  ><p
    >Let \(\mathbf h_i^{(t)}\) be the vector held by node \(i\) after round \(t\) and \(\mathcal
    N(i)\) its neighbours. One round, or one layer, is</p
  >$$\mathbf h_i^{(t+1)}=\phi\Big(\mathbf W\cdot\frac{1}{1+|\mathcal N(i)|}\Big[\mathbf
  h_i^{(t)}+\sum_{j\in\mathcal N(i)}\mathbf h_j^{(t)}\Big]\Big).$$<p
    >Each node averages its own vector with its neighbours', multiplies by a learned matrix
    \(\mathbf W\) and applies an activation. This is essentially the graph convolutional network of
    Kipf and Welling (2017). The same \(\mathbf W\) is used at every node, as a convolution reuses
    one kernel at every pixel, so the layer works on a graph of any size or shape.</p
  >
  <h4>What this page shows</h4
  ><p
    >Each node holds one number, its belief that it is in the gold club, and the round is the plain
    average with no learned weights (\(\mathbf W=1\), no activation). Labelled nodes are reset to
    their known value after each round. <b>That is the untrained core of a graph network</b>, known
    on its own as label propagation. A trained network would also use each node's own features and
    learn \(\mathbf W\) so that the averaging emphasises what matters.</p
  >
  <h4>Depth is reach</h4
  ><p
    >After one round a node knows about its friends; after two, about friends of friends. A network
    with \(k\) layers sees exactly \(k\) steps away. That is the graph version of the receptive
    field.</p
  >
  <h4>Over-smoothing</h4
  ><p
    >Averaging with neighbours makes connected nodes more alike every round. With nothing to hold
    them apart, all nodes of a connected graph converge to the same value, and the network can no
    longer tell them apart. That is why practical graph networks are shallow, usually two to four
    layers, or use residual shortcuts back to each node's original features.</p
  >
  <h4>Where they are used</h4
  ><p
    >Predicting properties of molecules (atoms are nodes, bonds are edges), recommending products
    (people and items), estimating travel times on road maps, detecting fraud in payment networks,
    and weather forecasting on a mesh of the globe. A Transformer is a graph network on a graph in
    which every token is connected to every other, with attention deciding the weight of each
    edge.</p
  ></template
>

<template data-part="question"
  >A node is five friendships away from the nearest labelled node. What is the smallest number of
  rounds after which its belief can differ from one half, and what does that say about choosing the
  number of layers?</template
>

<template data-part="answer"
  >Five. Information moves one friendship per round, so after four rounds nothing from a labelled
  node has reached it. In a graph network the number of layers sets how far each node can see, so it
  must be at least the distance over which the relevant information has to travel, but not much
  more, because each extra round also blurs neighbouring nodes together.</template
>
