<template data-part="lede"
  >A child who can already read does not learn a new alphabet game from nothing. Networks can reuse
  knowledge too. First a network studies hundreds of labelled letter pictures. Then a new question
  arrives, “is this letter a vowel?”, with only a handful of examples. One learner starts from
  scratch. The other keeps what the first network learned to see and only learns the new answer.
  Watch which one copes.</template
>

<template data-part="intro"
  ><p
    >A chef who has cooked Italian food for ten years is asked to make a Thai dish from three
    recipes. A beginner given the same three recipes will struggle, because three recipes cannot
    teach knife skills, timing or how to taste. The chef already has all of that and only needs to
    learn what is new. Most of what a network learns on one task with a lot of data, how to see
    edges and strokes, how to read grammar, is useful for other tasks with little data.</p
  >
</template>

  >Run it with 1 example per letter: six pictures in all. Compare the two rows of small pictures on

  worth it, and when does it stop mattering?</template
>

<template data-part="math"
  ><h4>The recipe</h4
  ><p
    >Split a network into a <b>feature extractor</b> \(\phi\) (the early layers) and a
    <b>head</b> \(g\) (the last layer).</p
  ><ol
    ><li><b>Pretrain</b> \(g_A(\phi(\mathbf x))\) on task A, which has plenty of data.</li
    ><li>For task B, keep \(\phi\), throw away \(g_A\) and attach a fresh head \(g_B\).</li
    ><li
      >Train on task B. Either <b>freeze</b> \(\phi\) and train only \(g_B\) (as on this page), or
      <b>fine-tune</b>: train everything, with a small learning rate so that \(\phi\) changes only a
      little.</li
    ></ol
  >
  <h4>Why it helps</h4
  ><p
    >It is the bias and variance trade-off again. Training from scratch on six examples means
    fitting every weight, here 889 of them, to six pictures: enormous variance, and the first-layer
    pictures on the lower left show the result. Freezing \(\phi\) leaves only the head's 25 weights
    to fit, and they are fitted on features that already separate the letters cleanly. Far fewer
    free numbers and better inputs mean much lower variance. The price is bias: if task B needs
    features that task A never taught, a frozen \(\phi\) cannot supply them.</p
  >
  <h4>When it works, and when not</h4
  ><ul
    ><li
      ><b>Works</b> when the two tasks share low-level structure: the same kind of pictures, the
      same language, the same sensor.</li
    ><li
      ><b>Helps most</b> when task B has little data. With plenty, training from scratch catches up,
      as the slider shows.</li
    ><li
      ><b>Can hurt</b> (negative transfer) when the tasks are unrelated, because the frozen features
      discard what the new task needs.</li
    ><li
      ><b>Freeze or fine-tune?</b> Freeze with very little data, fine-tune with more, and unfreeze
      from the last layer backward.</li
    ></ul
  >
  <h4>Why this matters now</h4
  ><p
    >Almost nobody trains a large model from zero. Vision models are pretrained on millions of
    images and language models on a large share of the public internet, then adapted with a few
    thousand examples, a few dozen, or just a written instruction. Those pretrained networks are
    called <b>foundation models</b>, and fine-tuning methods such as LoRA appear in the Language
    Models module.</p
  >
  <h4>About this demonstration</h4
  ><p
    >Both tasks use the same six letters, so the new task is a new question about familiar pictures.
    That is the easiest kind of transfer. The accuracy curves are averaged over four independent
    draws of the few examples, because with so few examples a single try is mostly luck.</p
  ></template
>

<template data-part="question"
  >With 12 examples per letter the two learners end up level. Does that mean transfer learning was
  pointless there?</template
>

<template data-part="answer"
  >Not quite. It reached that accuracy while training only 25 weights instead of 889, so it was
  cheaper and faster, and it got there with far fewer epochs. But the accuracy advantage is gone:
  once the new task has enough data of its own, a network trained from scratch can learn good
  features for itself. Transfer pays most when data for the new task is scarce.</template
>
