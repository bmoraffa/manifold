<template data-part="lede"
  >Very deep networks used to be untrainable, because the learning signal faded before it reached
  the first layers. The cure was almost embarrassingly simple: let each block add its result to its
  own input, so that there is always a direct road past it. Send the learning signal back through a
  plain stack and a stack with shortcuts, and compare what arrives.</template
>

<template data-part="intro"
  ><p
    >Think of a message passed along a line of sixty people, each of whom rewrites it in their own
    words. By the end it is unrecognisable. Now change one rule: each person passes on the original
    note untouched and staples their own comment to it. The original always arrives, and each person
    only has to add what they think is missing. A residual block works like that. Its layers do not
    have to reproduce their whole input, only to compute a correction to it, and the input itself
    travels along the shortcut.</p
  >
</template>

<template data-part="math"
  ><h4>The block</h4
  ><p
    >A plain layer computes \(\mathbf a_{l+1}=F(\mathbf a_l)\), where \(F\) is "multiply by weights,
    apply the activation". A residual block computes</p
  >$$\mathbf a_{l+1}=\mathbf a_l+F(\mathbf a_l).$$<p
    >If the best thing a block can do is nothing, it only has to learn \(F=0\), which is easy. A
    plain layer would have to learn to copy its input exactly, which is hard.</p
  >
  <h4>Why the gradient survives</h4><p>Differentiate the block:</p>$$\frac{\partial\mathbf
  a_{l+1}}{\partial\mathbf a_l}=\mathbf I+\frac{\partial F}{\partial\mathbf a_l}.$$<p
    >Going back through \(L\) plain layers multiplies \(L\) factors \(\partial F/\partial\mathbf
    a\), and if each is a little smaller than 1 in size the product vanishes geometrically. With
    shortcuts each factor is \(\mathbf I+\partial F/\partial\mathbf a\). Multiplying these out gives
    the identity plus many other terms, so there is always a path from the loss to every layer along
    which the signal is multiplied by exactly 1. The gradient at layer \(l\) is</p
  >$$\frac{\partial\mathcal L}{\partial\mathbf a_l}=\frac{\partial\mathcal L}{\partial\mathbf
  a_L}\Big(\mathbf I+\text{terms that pass through one or more blocks}\Big).$$
  <h4>What it made possible</h4
  ><p
    >Before residual connections (He and others, 2015), adding layers beyond about twenty made
    networks worse, even on the training data: an optimisation failure, not overfitting. With them,
    networks of 50, 150 and more than 1000 layers trained successfully. Every Transformer block also
    has two shortcuts, one around attention and one around its feed-forward layers, and U-Nets use
    long shortcuts between matching layers.</p
  >
  <h4>The other side</h4
  ><p
    >The shortcut stops the signal from vanishing, but if the blocks' own contribution is large the
    sum can grow layer after layer, forward and backward. That is why residual networks pair
    shortcuts with batch or layer normalisation and with careful initialisation, often starting each
    block close to \(F=0\).</p
  >
  <h4>What this page computes</h4
  ><p
    >Both rows use the same random weight matrices, 30 neurons wide. The residual row scales each
    block's contribution by one half. The bars are the root-mean-square size of the gradient at each
    layer, computed with the formulas above for thirty random inputs.</p
  ></template
>

<template data-part="question"
  >In a residual network, what does a block compute if all of its weights are zero, and why is that
  a good place to start training?</template
>

<template data-part="answer"
  >It computes a(l+1) = a(l) + 0: the block passes its input through unchanged. A network made of
  such blocks is the identity from first block to last, so the signal and the gradient both travel
  through perfectly at the start. Training then only has to add useful corrections, block by block,
  instead of first repairing a scrambled signal.</template
>
