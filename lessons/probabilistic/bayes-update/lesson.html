<template data-part="lede"
  >A café adds a new drink and wants to know what share of its customers like it. Before anyone has
  tried it, the owner has a hunch. Then customers answer one by one: yes or no. Bayesian updating is
  the rule for combining the hunch with the answers. It never gives a single number. It gives a
  whole curve of belief over every possible share, and the curve narrows as the evidence comes in.
  Watch three owners with very different hunches being pulled to the same conclusion.</template
>

<template data-part="intro"
  ><p
    >A doctor sees a patient with a cough. Before any test, she thinks a common cold is far more
    likely than anything serious, because colds are common. A test comes back, and it shifts her
    opinion, a lot if the result would be very surprising under one of the explanations, a little
    otherwise. A second test shifts it again, starting from where the first left it. She never
    throws away what she knew before, and she never ignores the evidence. Bayes' rule is the exact
    arithmetic of that way of thinking: what you believe afterwards is what you believed before,
    reweighted by how well each possibility explains what you saw.</p
  >
</template>

    ><div
      ><h3>How it works, step by step</h3
      ><ol id="by-steps"
        ><li
          >Before any answers, write down a belief about the share: a curve over every value from 0
          to 1. This is the prior.</li
        ><li>A customer answers yes or no.</li
        ><li
          >For every possible share, ask: how likely was that answer if this were the true share?
          Multiply the belief at that share by that likelihood.</li
        ><li>Rescale the curve so that its area is 1 again. This is the posterior.</li
        ><li>The posterior becomes the prior for the next customer. Repeat.</li
        ><li
          >Stop when the belief is narrow enough for the decision at hand: here, when 95% of it fits
          in a range 0.1 wide.</li
        ></ol

<template data-part="math"
  ><h4>Bayes' rule</h4
  ><p>Let \(\theta\) be the unknown share and \(D\) the data. The rule is</p
  >$$\underbrace{p(\theta\mid
  D)}_{\text{posterior}}=\frac{\overbrace{p(D\mid\theta)}^{\text{likelihood}}\
  \overbrace{p(\theta)}^{\text{prior}}}{p(D)},\qquad p(D)=\int p(D\mid\theta)\,p(\theta)\,d\theta
  .$$<p
    >The prior is the belief before the data. The likelihood says how probable the data would be for
    each value of \(\theta\). The denominator is only there to make the posterior's area equal 1.
    Posterior is proportional to likelihood times prior: that sentence is the whole method.</p
  >
  <h4>The café: a Beta prior and yes-or-no answers</h4
  ><p
    >If the true share is \(\theta\), a customer says yes with probability \(\theta\). After \(k\)
    yes answers among \(n\) customers the likelihood is \(\theta^k(1-\theta)^{n-k}\). For the prior,
    use the Beta family:</p
  >$$p(\theta)=\mathrm{Beta}(\theta;a,b)\propto\theta^{a-1}(1-\theta)^{b-1}.$$<p
    >Multiplying the two gives another curve of the same shape,</p
  >$$p(\theta\mid D)\propto\theta^{a+k-1}(1-\theta)^{b+n-k-1}=\mathrm{Beta}(\theta;\ a+k,\
  b+n-k).$$<p
    >So updating is addition: every yes adds 1 to \(a\), every no adds 1 to \(b\). A prior that
    reproduces itself like this is called <b>conjugate</b>. The prior behaves exactly like \(a+b\)
    imagined earlier customers, \(a\) of whom said yes. "No opinion" is \(\mathrm{Beta}(1,1)\), a
    flat line.</p
  >
  <h4>Reading the posterior</h4
  ><p>The mean of \(\mathrm{Beta}(a,b)\) is \(a/(a+b)\), so the best estimate after the data is</p
  >$$\mathbb E[\theta\mid D]=\frac{a+k}{a+b+n}=\underbrace{\frac{a+b}{a+b+n}}_{\text{weight on the
  prior}}\cdot\frac{a}{a+b}+\underbrace{\frac{n}{a+b+n}}_{\text{weight on the
  data}}\cdot\frac{k}{n}.$$<p
    >It is a weighted average of the prior guess and the plain frequency, and the weight on the data
    grows with every customer. That is why the stubborn owner is pulled to the truth slowly and the
    owner with no opinion almost at once, and why all three end in the same place. The 95% range,
    called a <b>credible interval</b>, is the middle 95% of the posterior's area. Its width shrinks
    like \(1/\sqrt n\).</p
  >
  <h4>The same number is also a prediction</h4
  ><p
    >The probability that the next customer says yes, taking the uncertainty about \(\theta\) into
    account, is the posterior mean \((a+k)/(a+b+n)\). With no opinion and no data it is
    \(\tfrac12\). After one yes it is \(\tfrac23\), not 1: one happy customer does not prove that
    everyone will be happy. The plain frequency would have said 100%.</p
  >
  <h4>Why bother with a prior?</h4
  ><p
    >With a great deal of data the prior stops mattering, as the bottom chart shows. With little
    data it matters a lot, and that is when it is most useful: it keeps the estimate sensible after
    three answers, and it is the natural place to put real knowledge, such as "new drinks at this
    café are usually liked by 20 to 40 percent of people". The cost is that a confident wrong prior
    takes many observations to overturn. A prior should be as sure as you actually are, and no
    surer.</p
  >
  <h4>Beyond the café</h4
  ><p
    >The same recipe, prior times likelihood, underlies spam filters, medical diagnosis, A/B
    testing, the Thompson sampling of the Multi-Armed Bandits tab, and Gaussian process regression.
    For most models the product has no tidy formula like the Beta one. Then the posterior is
    explored by sampling, which is the subject of the next tab, MCMC.</p
  >
  <h4>What this page runs</h4
  ><p
    >Customers are drawn at random with the true share you set. The run stops when the 95% credible
    interval is narrower than 0.1, or after 1,000 customers. The interval is computed by adding up
    the area under the curve numerically.</p
  ></template
>

<template data-part="question"
  >With no opinion at the start, the first customer says yes. The plain frequency is now 1 out of 1,
  or 100%. The Bayesian estimate is 2/3. Which is the better forecast for the second customer, and
  why?</template
>

<template data-part="answer"
  >The Bayesian one. A frequency of 100% claims that every future customer will say yes, on the
  strength of one answer, and would be proved wrong by the first no. The posterior after one yes is
  Beta(2, 1): it has shifted toward high values and still gives real weight to everything from about
  0.2 upward. Its mean, 2/3, says “probably more people like it than not, and I am far from sure”.
  That is what one answer actually tells you. As the answers accumulate the two estimates approach
  each other, and after a few hundred customers they agree to the second decimal place.</template
>
