<template data-part="lede"
  >A neural network has learned to estimate house prices from five facts about a house. It prices
  one particular house at well over 400 thousand. Why? “Because of 600 weights” is true and useless.
  A useful answer splits the estimate into parts: so much because it is large, so much off because
  it is old, so much because it is close to the centre. Shapley values are the one fair way to make
  that split. Describe a house with the sliders and watch its price being explained.</template
>

<template data-part="intro"
  ><p
    >Four friends share a taxi home, each living further along the same road, and the fare comes to
    40. How should they split it? Charging each the fare to their own door adds up to far more than
    40. Splitting evenly is unfair to the one who gets out first. One fair scheme imagines the
    friends joining the ride one at a time in some order, charges each the extra cost they add, and
    then averages over every possible order of joining. A model's estimate is the fare, the features
    are the passengers, and the Shapley value is each feature's fair share.</p
  >
</template>

<template data-part="math"
  ><h4>What is being explained</h4
  ><p
    >Take a trained model \(f\) and one input \(\mathbf x\), here a house with five features. The
    <b>base value</b> is the average prediction over typical houses, \(\phi_0=\mathbb E[f(\mathbf
    X)]\). An explanation is a set of numbers \(\phi_1,\dots,\phi_d\), one per feature, that account
    for the difference:</p
  >$$f(\mathbf x)=\phi_0+\sum_{j=1}^{d}\phi_j .$$ <h4>The value of knowing some features</h4
  ><p
    >For a subset \(S\) of features, let \(v(S)\) be the model's average prediction when the
    features in \(S\) are fixed to this house's values and the others are drawn from typical
    houses:</p
  >$$v(S)=\mathbb E\big[f(\mathbf x_S,\mathbf X_{\bar S})\big].$$<p
    >So \(v(\varnothing)=\phi_0\) and \(v(\text{all})=f(\mathbf x)\). Revealing feature \(j\) after
    the set \(S\) changes the prediction by \(v(S\cup\{j\})-v(S)\).</p
  >
  <h4>The Shapley value</h4
  ><p
    >That change depends on \(S\). The Shapley value (Shapley, 1953) averages it over every order in
    which the features could be revealed:</p
  >$$\phi_j=\sum_{S\subseteq\{1..d\}\setminus\{j\}}\frac{|S|!\,(d-|S|-1)!}{d!}\,\big[v(S\cup\{j\})-v(S)\big].$$<p
    >The weight is the share of orderings in which exactly the features in \(S\) come before \(j\).
    With 5 features there are 32 subsets and the sum can be computed exactly, which gives the dark
    ticks. With hundreds of features it cannot, and the practical method is the one animated here:
    sample random orders and average. Lundberg and Lee (2017) made this the basis of the SHAP
    library.</p
  >
  <h4>Why this split and no other</h4
  ><p
    >It is the only attribution that satisfies four reasonable demands at once. <b>Efficiency</b>:
    the shares add up to the difference from the base value. <b>Symmetry</b>: two features that
    always contribute equally get equal shares. <b>Dummy</b>: a feature that never changes the
    prediction gets zero. <b>Additivity</b>: the explanation of a sum of models is the sum of their
    explanations.</p
  >
  <h4>Interactions</h4
  ><p
    >If the model were a plain weighted sum of the features, every order would give the same moves,
    and one order would be enough. The moves differ between orders because features interact: in
    this model a garden adds more to a large house near the centre than to a small one far out. The
    Shapley value shares each interaction equally among the features involved. That is fair, and it
    also means the garden's number is specific to this house.</p
  >
  <h4>Local and global</h4
  ><p
    >A Shapley explanation is <b>local</b>: it is about one house. Averaging the sizes \(|\phi_j|\)
    over many houses gives a <b>global</b> ranking of features, the top-right chart. The curve at
    the bottom right is a different tool. The line for "this house" changes one feature and holds
    the others at this house's values. The line for "on average" does the same for many houses and
    averages, which is called a partial dependence plot.</p
  >
  <h4>What an explanation is not</h4
  ><p
    >These numbers explain the <b>model</b>, not the world. If the model has learned that houses
    with gardens cost more, the garden gets a positive share, whether or not building a garden would
    raise a price. They are not causes. When features are strongly related, such as floor area and
    bedrooms, replacing one while keeping the other creates houses that do not exist, and the credit
    between the two is divided somewhat arbitrarily. And a faithful explanation of a wrong model is
    still an explanation of something wrong.</p
  >
  <h4>What this page runs</h4
  ><p
    >A network with two hidden layers of 24 neurons, trained when the page opens on 700 invented
    houses whose prices follow a formula with interactions and some noise. "Typical houses" are a
    fixed sample of 60 of them. The run stops when no running average has moved by more than 0.3
    thousand over 60 orders, or after 1,500 orders.</p
  ></template
>

<template data-part="question"
  >In one order, floor area is revealed first and moves the estimate by +70. In another it is
  revealed last and moves it by +95. Which number is the true effect of floor area for this
  house?</template
>

<template data-part="answer"
  >Neither, and both. Each is the correct answer to a slightly different question: “how much does
  knowing the area change the estimate when nothing else is known?” and “how much does it change
  when everything else is already known?”. They differ because area interacts with the other
  features. A large house close to the centre gains more from its size than a house whose location
  is still treated as average. There is no single order that is the right one, which is why the
  Shapley value averages over all of them. The average is a fair summary, and the spread between
  orders is itself a sign of how strongly the feature interacts.</template
>
